<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ტარო · MAGNUS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400;600&family=Noto+Serif+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#05040b;--surface:#0e0b1a;--raised:#161127;--card:#120e20;
  --gold:#c9a84c;--gold-lt:#ecd59a;--gold-dim:#7a5f2a;
  --ink:#efe6d4;--ink-mid:#b3a68f;--ink-dim:#6d6253;
  --border:rgba(201,168,76,.16);--border-h:rgba(201,168,76,.45);
  --fire:#e2683c;--water:#4a90d9;--air:#c9c2a0;--earth:#5fae6e;--major:#a77bdb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse 800px 500px at 50% -10%,rgba(120,70,200,.12),transparent 60%),var(--void);
  color:var(--ink);font-family:'Noto Serif Georgian',serif;min-height:100vh;line-height:1.6}
.page{max-width:1180px;margin:0 auto;padding:34px 18px 80px}
a{color:inherit}
header{text-align:center;margin-bottom:26px;position:relative}
.back{position:absolute;left:0;top:4px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--gold);
  opacity:.7;text-decoration:none;border:1px solid var(--border);border-radius:3px;padding:6px 11px}
.back:hover{opacity:1;border-color:var(--border-h)}
h1{font-family:'Cinzel Decorative',serif;font-weight:400;font-size:clamp(26px,5vw,44px);letter-spacing:3px;
  background:linear-gradient(160deg,#f5e8ba,var(--gold) 40%,#9a7028 70%,var(--gold-lt));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:12px;color:var(--ink-dim);margin-top:4px;letter-spacing:1px}

/* ── spread picker ── */
.groups{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.grp-t{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--gold);opacity:.75;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--raised);border:1px solid var(--border);border-radius:5px;color:var(--ink-mid);cursor:pointer;
  padding:7px 11px;font-family:inherit;font-size:12.5px;transition:all .2s}
.chip small{color:var(--ink-dim);margin-left:5px;font-size:10px}
.chip:hover{border-color:var(--border-h);color:var(--ink)}
.chip.on{border-color:var(--gold);color:var(--gold-lt);background:rgba(201,168,76,.08)}

.ask{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:22px}
.ask h2{font-family:'Cinzel',serif;font-weight:400;font-size:15px;letter-spacing:2px;color:var(--gold-lt)}
.ask .desc{font-size:12.5px;color:var(--ink-mid);margin:4px 0 12px}
.ask .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ask input[type=text]{flex:1 1 260px;background:rgba(10,8,24,.8);border:1px solid rgba(201,168,76,.25);border-radius:6px;
  color:var(--ink);padding:9px 12px;font:inherit;font-size:13px;outline:none}
.ask input[type=text]:focus{border-color:var(--gold)}
.opt{font-size:12px;color:var(--ink-mid);display:flex;align-items:center;gap:6px;cursor:pointer}
.opt input{accent-color:var(--gold)}
.btn{background:linear-gradient(135deg,#8a6a24,#c9a84c);color:#120c02;border:none;border-radius:6px;padding:10px 20px;
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--border-h);font-weight:400}
.ab{display:none;gap:10px;flex-wrap:wrap;margin-top:12px}
.ab.show{display:flex}
.note{font-size:11px;color:var(--ink-dim);margin-top:10px}
.ab-names{display:none;gap:10px;flex-wrap:wrap;margin-top:10px}
.ab-names.show{display:flex}
.ab-names input{flex:1 1 200px}

/* ── table ── */
.table-wrap{overflow-x:auto;padding:10px 0 20px;margin-bottom:10px}
.table{display:grid;gap:14px 12px;justify-content:center;margin:0 auto;min-width:min-content}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.slot .pn{font-size:10px;color:var(--ink-dim);text-align:center;max-width:calc(var(--cw) + 16px);line-height:1.3;min-height:26px}
.slot .pn b{color:var(--gold);font-family:'Cinzel',serif;font-weight:400;margin-right:3px}
.slot.cross{z-index:2;transform:translateY(-16px)}
.slot.cross .card3d{transform:rotate(90deg)}
.slot.cross .pn{position:absolute;bottom:-34px;}

.card3d{width:var(--cw);height:calc(var(--cw) * 1.72);perspective:900px;cursor:pointer;opacity:0;transform:translateY(-14px);
  animation:deal .45s ease forwards}
@keyframes deal{to{opacity:1;transform:none}}
.slot.cross .card3d{animation:dealx .45s ease forwards}
@keyframes dealx{from{opacity:0}to{opacity:1;transform:rotate(90deg)}}
.inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card3d.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back-f{background:#130d24;border:1px solid rgba(201,168,76,.45);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.back-f svg{width:100%;height:100%}
.front{transform:rotateY(180deg);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 22px rgba(0,0,0,.55)}
.cf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 5px 6px;
  background:linear-gradient(170deg,var(--c1),var(--c2))}
.cf.rev{transform:rotate(180deg)}
.cf-top{font-family:'Cinzel',serif;font-size:11px;color:rgba(255,255,255,.85);letter-spacing:1px;position:relative}
.cf-frame{position:absolute;inset:4px;border:1px solid rgba(255,255,255,.18);border-radius:4px;pointer-events:none}
.el-major .cf-frame{border-color:rgba(236,213,154,.45);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 0 0 3px rgba(236,213,154,.18)}
.el-major .cf-art{background:radial-gradient(circle at 50% 50%,rgba(236,213,154,.22),transparent 58%)}
.el-major .cf-art .big{color:#f6e7bd;text-shadow:0 0 14px rgba(236,213,154,.55)}
.cf-art,.cf-name{position:relative}
.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px;z-index:3;background:#111}
.cf-art{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.cf-art .big{font-size:40px;line-height:1;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.35);font-family:'Segoe UI Symbol','Noto Sans Symbols 2',serif}
.cf-art svg{stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pips{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:70px}
.pips svg{width:17px;height:17px}
.solo svg{width:44px;height:44px}
.court{display:flex;flex-direction:column;align-items:center;gap:2px}
.court svg{width:34px;height:34px}
.court span{font-family:'Cinzel',serif;font-size:16px;color:#fff;opacity:.9}
.cf-name{font-size:9.5px;text-align:center;color:#fff;line-height:1.2;background:rgba(0,0,0,.28);border-radius:3px;padding:2px 4px;width:100%}
.el-fire{--c1:#5a1d10;--c2:#2a0c08}.el-water{--c1:#12305a;--c2:#081428}.el-air{--c1:#4a4630;--c2:#1f1d14}
.el-earth{--c1:#1d4526;--c2:#0b1c0f}.el-major{--c1:#3b2066;--c2:#170c2c}
.el-major{border-color:rgba(201,168,76,.55)}

/* ── reading ── */
.reading{display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-top:6px}
.reading.show{display:block}
.reading h3{font-family:'Cinzel',serif;font-weight:400;letter-spacing:2px;color:var(--gold-lt);font-size:14px;margin-bottom:4px}
.q{font-size:12.5px;color:var(--ink-mid);font-style:italic;margin-bottom:12px}
.ri{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.05)}
.ri .no{font-family:'Cinzel',serif;color:var(--gold);font-size:15px;text-align:center}
.ri .pos{font-size:11px;color:var(--ink-dim);letter-spacing:.5px}
.ri .nm{font-size:14.5px;color:var(--ink);margin:1px 0 2px}
.ri .nm .rv{color:#e58c8c;font-size:11px;margin-left:6px}
.ri .tags{font-size:10.5px;color:var(--ink-dim);margin-bottom:3px}
.ri .mn{font-size:13px;color:var(--ink-mid);line-height:1.7}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 6px}
.kw span{font-size:10.5px;color:var(--gold-lt);border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:0 8px;background:rgba(201,168,76,.05)}
.ctx{font-size:12.5px;color:#cbb9e6;margin-top:6px}.ctx b{color:#d8c6f5;font-weight:600}.ctx i{color:var(--ink-dim);font-size:11px}
.adv{font-size:12.5px;color:#a9d2b2;margin-top:4px}.adv b{color:#bfe5c7;font-weight:600}
.ri.pending .nm{color:var(--ink-dim);font-style:italic;font-size:12.5px}
.verdict{margin:6px 0 12px;padding:12px 14px;border-radius:6px;font-size:14px;border:1px solid}
.verdict b{font-family:'Cinzel',serif;letter-spacing:2px;font-size:16px;margin-right:8px}
.v-yes{border-color:rgba(95,174,110,.6);background:rgba(95,174,110,.08)}.v-yes b{color:#7fd08e}
.v-no{border-color:rgba(226,104,60,.6);background:rgba(226,104,60,.08)}.v-no b{color:#f08a63}
.v-maybe{border-color:rgba(201,168,76,.6);background:rgba(201,168,76,.07)}.v-maybe b{color:var(--gold-lt)}
.summary{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.summary h4{font-family:'Cinzel',serif;font-weight:400;font-size:12px;letter-spacing:2px;color:var(--gold);margin-bottom:8px}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px;margin-bottom:10px}
.bar{font-size:11.5px;color:var(--ink-mid)}
.bar .tr{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:3px}
.bar .tr i{display:block;height:100%;border-radius:3px}
.insight{font-size:12.8px;color:var(--ink-mid);padding:3px 0 3px 14px;position:relative}
.insight::before{content:'✦';position:absolute;left:0;color:var(--gold);font-size:9px;top:6px}
.quint{margin-top:10px;padding:10px 12px;border:1px dashed var(--border-h);border-radius:6px;font-size:13px;color:var(--ink-mid)}
.quint b{color:var(--gold-lt)}
.health{font-size:11px;color:#e0a07a;margin-top:10px}

/* ── encyclopedia ── */
details.enc{margin-top:28px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
details.enc summary{cursor:pointer;list-style:none;padding:13px 18px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;color:var(--gold)}
details.enc summary::-webkit-details-marker{display:none}
.enc-in{padding:0 18px 18px}
.enc-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.enc-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;align-items:start}
.enc-c{background:var(--raised);border:1px solid var(--border);border-left:3px solid var(--elc,#888);border-radius:5px;padding:9px 11px;font-size:12px}
.enc-c summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.enc-c summary::-webkit-details-marker{display:none}
.enc-c .mini{--cw:96px;position:relative;width:44px;height:76px;border-radius:4px;overflow:hidden;display:block}
.enc-c .mini .cf{transform:scale(.4583);transform-origin:0 0;width:96px;height:165px}
.enc-c .mini .cf.rev{transform:scale(.4583) rotate(180deg)}
.enc-c b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
.enc-c .t{display:block;font-size:10.5px;color:var(--ink-dim)}
.enc-c .kwl{display:block;font-size:10.5px;color:var(--gold-lt);margin-top:2px}
.enc-b{margin-top:8px;line-height:1.7}
.enc-c .u{color:var(--ink-mid);margin-top:4px}
.enc-c .r{color:#c99a9a;margin-top:3px}
/* ── gallery of spreads ── */
.groups{gap:22px}
.grp-t{font-size:10px;margin-bottom:9px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:13px 15px;border-radius:8px;
  font-size:15px;color:var(--ink);min-height:86px;position:relative}
.chip b{font-weight:400;font-family:'Noto Serif Georgian',serif;font-size:15.5px;line-height:1.3}
.chip .cd{font-size:11px;color:var(--ink-dim);line-height:1.45}
.chip small{position:absolute;top:10px;right:12px;margin:0;font-family:'Cinzel',serif;font-size:11px;color:var(--gold);opacity:.7}
.chip:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.4)}
/* ── focus mode: one spread fills the screen ── */
.focus-bar{display:none;align-items:center;gap:18px;margin:0 0 18px;padding:16px 20px;background:var(--surface);
  border:1px solid var(--border-h);border-radius:10px;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);
  background:rgba(14,11,26,.92)}
.fb-back{background:none;border:1px solid var(--border-h);color:var(--gold);border-radius:6px;padding:8px 13px;cursor:pointer;
  font-family:inherit;font-size:12px;white-space:nowrap}
.fb-back:hover{background:rgba(201,168,76,.1)}
.fb-main{flex:1;min-width:0}
.fb-grp{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--gold);opacity:.7}
.fb-main h2{font-family:'Noto Serif Georgian',serif;font-weight:600;font-size:clamp(20px,3vw,30px);color:var(--gold-lt);line-height:1.25}
.fb-desc{font-size:12.5px;color:var(--ink-mid)}
.fb-n{font-family:'Cinzel',serif;font-size:28px;color:var(--gold);text-align:center;line-height:1}
.fb-n small{display:block;font-size:9px;letter-spacing:2px;opacity:.7;font-family:'Noto Serif Georgian',serif}
body.focus .groups{display:none}
body.focus .focus-bar{display:flex}
body:not(.focus) .ask,body:not(.focus) .table-wrap,body:not(.focus) .reading{display:none}
body.focus .page{max-width:1500px}
/* ── cards scale with the space; faces scale with the card ── */
.table{--cw:120px}
.table .slot .pn{font-size:calc(9px + var(--cw) * .035);max-width:calc(var(--cw) + 30px)}
.cf-top{font-size:calc(var(--cw) * .11)}
.cf-art .big{font-size:calc(var(--cw) * .44)}
.pips{max-width:calc(var(--cw) * .74)}.pips svg{width:calc(var(--cw) * .18);height:calc(var(--cw) * .18)}
.solo svg{width:calc(var(--cw) * .46);height:calc(var(--cw) * .46)}
.court svg{width:calc(var(--cw) * .36);height:calc(var(--cw) * .36)}.court span{font-size:calc(var(--cw) * .16)}
.cf-name{font-size:calc(var(--cw) * .095)}
.card3d{width:var(--cw);height:calc(var(--cw) * 1.72)}
.face{border-radius:calc(var(--cw) * .06)}
.card3d.up{cursor:zoom-in}
.card3d:hover .inner{box-shadow:0 0 0 1px rgba(236,213,154,.5),0 10px 30px rgba(0,0,0,.55);border-radius:8px}
.slot.hl .card3d .inner{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(201,168,76,.45);border-radius:8px}
.ri{cursor:pointer;border-radius:6px;padding-left:6px;padding-right:6px}
.ri:hover,.ri.hl{background:rgba(201,168,76,.06)}
/* ── zoom ── */
.zoom{position:fixed;inset:0;z-index:100;background:rgba(3,2,8,.86);backdrop-filter:blur(6px);display:flex;align-items:center;
  justify-content:center;padding:20px;animation:zf .2s ease}
.zoom[hidden]{display:none}
@keyframes zf{from{opacity:0}}
.zoom-in{display:grid;grid-template-columns:auto minmax(0,460px);gap:26px;align-items:center;max-height:100%;overflow:auto;
  background:var(--surface);border:1px solid var(--border-h);border-radius:12px;padding:22px;position:relative}
.zoom-card{--cw:min(300px,38vw);width:var(--cw);height:calc(var(--cw) * 1.72);position:relative;border-radius:10px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.7)}
.zoom-card .cf{border-radius:10px}
.zoom-x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--ink-mid);font-size:22px;cursor:pointer}
.zoom-nav{display:flex;gap:8px;margin-top:14px}
.zoom-nav button{background:none;border:1px solid var(--border-h);color:var(--gold);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit}
.zoom .pos{font-size:12px;color:var(--ink-dim)}.zoom .nm{font-size:20px;color:var(--gold-lt);margin:2px 0 4px}
.zoom .mn{font-size:14px;line-height:1.75;color:var(--ink-mid)}
@media(max-width:700px){
  .zoom-in{grid-template-columns:1fr;justify-items:center;padding:16px}
  .zoom-card{--cw:min(230px,62vw)}
  .focus-bar{flex-wrap:wrap;gap:10px;padding:12px 14px}
  .fb-back{order:3;width:100%}
  .chips{grid-template-columns:1fr 1fr}
  .chip{min-height:74px;padding:11px 12px}.chip b{font-size:13.5px}.chip .cd{display:none}
}
@media(max-width:640px){
  .back{position:static;display:inline-block;margin-bottom:12px}
  .table{gap:10px 8px}
}
</style>
</head>
<body>
<div class="page">
<header>
  <a class="back" href="index.html?g=fun">← გასართობი</a>
  <h1>ტარო</h1>
  <div class="sub">78 არკანი · რაიდერ–უეიტის ტრადიცია · ოქროს განთიადის ასტროლოგიური შესაბამისობები</div>
</header>

<div class="groups" id="groups"></div>

<div class="focus-bar" id="focus-bar">
  <button class="fb-back" id="fb-back" type="button">← ყველა განლაგება</button>
  <div class="fb-main"><div class="fb-grp" id="fb-grp"></div><h2 id="fb-title"></h2><div class="fb-desc" id="fb-desc"></div></div>
  <div class="fb-n" id="fb-n"></div>
</div>

<div class="ask" id="ask">
  <div class="ab-names" id="ab-names">
    <input type="text" id="opt-a" placeholder="გზა A — მაგ. ვრჩები ახლანდელ სამსახურში">
    <input type="text" id="opt-b" placeholder="გზა B — მაგ. ვიწყებ ახალ საქმეს">
  </div>
  <div class="row" style="margin-top:10px">
    <input type="text" id="question" placeholder="შენი კითხვა (არჩევითი) — მაგ. რა მელის ამ ურთიერთობაში?">
    <label class="opt"><input type="checkbox" id="rev" checked> შებრუნებული ბარათები</label>
    <button class="btn" id="draw">✦ აურიე და გაშალე</button>
  </div>
  <div class="ab" id="actions">
    <button class="btn ghost" id="flipall">ყველას გადაბრუნება</button>
    <button class="btn ghost" id="copy">ტექსტის კოპირება</button>
  </div>
  <div class="note">ბარათზე დაჭერით ის გადაბრუნდება, გადაბრუნებულზე — გადიდდება. დაფიქრდი კითხვაზე, სანამ აურევ. <span id="img-note"></span></div>
</div>

<div class="table-wrap"><div class="table" id="table"></div></div>
<div class="reading" id="reading"></div>
<div class="zoom" id="zoom" hidden><div class="zoom-in" id="zoom-in"></div></div>

<details class="enc" id="enc">
  <summary>✦ ბარათების ცნობარი — 78 არკანი</summary>
  <div class="enc-in">
    <div class="enc-f" id="enc-f"></div>
    <div class="enc-g" id="enc-g"></div>
  </div>
</details>
</div>

<script src="tarot_texts.js"></script>
<script>

/* build the 78-card deck */
const DECK=[];
MAJORS.forEach((m,i)=>DECK.push({id:'M'+i,major:true,n:i,name:m[0],astro:m[1],glyph:m[2],yn:m[3],up:m[4],rv:m[5],el:'major'}));
for(const s of Object.keys(SUITS))MINORS[s].forEach((m,i)=>{
  const r=i+1;
  DECK.push({id:s+r,major:false,suit:s,rank:r,name:`${RANK_KA[r]} ${SUITS[s].gen}`,
    yn:m[0],up:m[1],rv:m[2],el:SUITS[s].el});
});
const TX=(typeof TAROT_TEXTS!=='undefined')?TAROT_TEXTS:{};
DECK.forEach(c=>{
  c.tx=TX[c.id]||null;
  c.corr=c.major?`${c.astro} · ${HEBREW[c.n]}`
        :c.rank===1?`${{fire:'ცეცხლის',water:'წყლის',air:'ჰაერის',earth:'მიწის'}[c.el]} ფესვი`
        :c.rank<=10?`დეკანი: ${DECAN[c.suit][c.rank-2]}`
        :COURT_ROLE[c.rank];
});

/* ── optional card images ──────────────────────────────────────
   Put files in a tarot/ folder next to tarot.html:
     majors   0 … 21              (0 = Fool, 21 = World)
     minors   "wands 1" … "wands 14", "cups 1" …, "swords 1" …, "pentacles 1" …
              (1 Ace … 10, 11 Page, 12 Knight, 13 Queen, 14 King)
   jpg, jpeg, png or webp. Checked once on load (file "0"); missing → drawn faces.
   ALIAS: alternative file names tried if the main one is missing.          */
const IMG={dir:'tarot/',ext:null};
const ALIAS={'pentacles 14':'pentacles 15'};
const imgName=c=>c.major?String(c.n):`${c.suit} ${c.rank}`;
const imgURL=n=>IMG.dir+encodeURIComponent(n)+'.'+IMG.ext;
function probeImages(){
  return new Promise(res=>{
    const exts=['jpg','png','jpeg','webp','JPG','PNG'];let i=0;
    const next=()=>{if(i>=exts.length)return res(null);const e=exts[i++],im=new Image();
      im.onload=()=>res(e);im.onerror=next;im.src=IMG.dir+'0.'+e;};
    next();
  });
}
function imgTag(c){
  if(!IMG.ext)return '';
  const n=imgName(c),alt=ALIAS[n];
  /* main name → alias (if any) → give up and show the drawn face */
  const onerr=alt?`if(!this.dataset.a){this.dataset.a=1;this.src='${imgURL(alt)}'}else this.remove()`:'this.remove()';
  return `<img class="cimg" src="${imgURL(n)}" alt="" loading="lazy" onerror="${onerr}">`;
}
function faceHTML(c,rev){
  let top,art;
  if(c.major){top=ROMAN[c.n];art=`<div class="big">${c.glyph}\uFE0E</div>`;}
  else if(c.rank===1){top='A';art=`<div class="solo">${svgIcon(c.suit)}</div>`;}
  else if(c.rank<=10){top=String(c.rank);art=`<div class="pips">${svgIcon(c.suit).repeat(c.rank)}</div>`;}
  else{top=RANK_SHORT[c.rank];art=`<div class="court">${svgIcon(c.suit)}<span>${RANK_SHORT[c.rank]}</span></div>`;}
  return `<div class="cf el-${c.el}${rev?' rev':''}"><div class="cf-frame"></div><div class="cf-top">${top}</div><div class="cf-art">${art}</div><div class="cf-name">${c.name}</div>${imgTag(c)}</div>`;
}

function ynOf(c,rev){const v=YN_W[c.yn];return rev?(v>0?0:-1):v;}   /* reversed: yes→maybe, maybe→no */
/* quintessence: majors count their number, pips their rank, courts 0;
   reduced by digit sum while above 22 (same as the matrix r22); 22 → 0 */
function r22(n){while(n>22)n=String(n).split('').reduce((a,d)=>a+ +d,0);return n;}
function quintessence(drawn){
  const s=drawn.reduce((a,{c})=>a+(c.major?c.n:(c.rank<=10?c.rank:0)),0);
  if(!s)return null;
  const q=r22(s);return {sum:s,n:q===22?0:q};
}
function analyse(sp,drawn){
  const n=drawn.length,out=[];
  const cnt={fire:0,water:0,air:0,earth:0},ranks={};
  let maj=0,rev=0,courts=0;
  for(const {c,rev:r} of drawn){
    if(c.major)maj++;else{cnt[c.el]++;ranks[c.rank]=(ranks[c.rank]||0)+1;if(c.rank>10)courts++;}
    if(r)rev++;
  }
  const minors=n-maj;
  let bars='<div class="bars">';
  for(const k of ['fire','water','air','earth']){const v=cnt[k],p=minors?v/minors*100:0;
    bars+=`<div class="bar">${EL[k][0]} — ${v}<div class="tr"><i style="width:${p}%;background:${EL[k][2]}"></i></div></div>`;}
  bars+=`<div class="bar">დიდი არკანი — ${maj}<div class="tr"><i style="width:${n?maj/n*100:0}%;background:var(--major)"></i></div></div></div>`;
  if(minors){
    const mx=Math.max(...Object.values(cnt));
    const dom=Object.keys(cnt).filter(k=>cnt[k]===mx&&mx>0);
    if(dom.length===1&&mx>=2)out.push(`დომინანტი ელემენტი — <b>${EL[dom[0]][0]}</b>: ${EL[dom[0]][1]}. ვითარების მთავარი ენა სწორედ ესაა.`);
    if(n>=5){const miss=Object.keys(cnt).filter(k=>!cnt[k]);
      if(miss.length&&miss.length<4)out.push(`აკლია: <b>${miss.map(k=>EL[k][0]).join(', ')}</b> — ${miss.map(k=>EL[k][1].split(',')[0]).join(', ')} ამჟამად ნაკლებად მონაწილეობს; ღირს ამ მხარის გაძლიერება.`);}
  }
  if(n>=3){
    if(maj/n>=.5)out.push('დიდი არკანი ჭარბობს — ეს ბედისწერის მნიშვნელობის ვითარებაა, ღრმა ცვლილებები და გაკვეთილები მიმდინარეობს.');
    else if(maj===0)out.push('დიდი არკანი არ არის — ვითარება ყოველდღიური დონისაა და მეტწილად შენს ხელშია.');
    if(rev/n>=.5)out.push('შებრუნებული ბარათები ჭარბობს — ენერგია შინაგანადაა მიმართული: შენელება, დაბლოკვა ან ფარული პროცესები.');
    if(courts>=2)out.push(`სასახლის ${courts} ბარათი — ვითარებაში ჩართულია სხვა ადამიანები ან შენი პიროვნების სხვადასხვა მხარე.`);
  }
  for(const [r,k] of Object.entries(ranks))if(k>=2)out.push(`${k}× ${RANK_KA[r]} — ${RANK_MSG[r]}.`);
  const q=quintessence(drawn);
  let html=`<div class="summary"><h4>ენერგიების ბალანსი</h4>${bars}${out.map(t=>`<div class="insight">${t}</div>`).join('')}`;
  if(q){const M=MAJORS[q.n];html+=`<div class="quint">კვინტესენცია: ${drawn.map(({c})=>c.major?c.n:(c.rank<=10?c.rank:0)).join(' + ')} = ${q.sum} → <b>${ROMAN[q.n]} ${M[0]}</b> — ${M[4]} <span style="color:var(--ink-dim)">(მთლიანი განლაგების ფარული რჩევა)</span></div>`;}
  if(sp.health)html+='<div class="health">⚠ ტარო არ ცვლის ექიმს. ჯანმრთელობის პრობლემისას მიმართე სპეციალისტს.</div>';
  return html+'</div>';
}

/* ════════════════════════════════════════════════════════════════
   UI
   ════════════════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
let cur=SPREADS[0],drawn=[],question='';
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
function shuffle(){const d=DECK.slice();for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]];}return d;}

function renderGroups(){
  const gs=[...new Set(SPREADS.map(s=>s.g))];
  $('groups').innerHTML=gs.map(g=>`<div><div class="grp-t">${g}</div><div class="chips">${
    SPREADS.filter(s=>s.g===g).map(s=>`<button class="chip" data-id="${s.id}"><b>${s.t}</b><span class="cd">${s.d}</span><small>${s.p.length}</small></button>`).join('')}</div></div>`).join('');
  $('groups').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{select(b.dataset.id);
    history.pushState({sp:b.dataset.id},'','?spread='+b.dataset.id);});
}
/* gallery ⇄ focus. The back button of the browser works too. */
function showGallery(){
  document.body.classList.remove('focus');cur=null;closeZoom();
  document.title='ტარო · MAGNUS';window.scrollTo({top:0});
}
function select(id){
  cur=SPREADS.find(s=>s.id===id);
  document.body.classList.add('focus');
  document.title=cur.t+' · ტარო';
  $('fb-grp').textContent=cur.g;$('fb-title').textContent=cur.t;$('fb-desc').textContent=cur.d;
  $('fb-n').innerHTML=`${cur.p.length}<small>ბარათი</small>`;
  window.scrollTo({top:0});
  $('ab-names').classList.toggle('show',!!cur.ab);
  drawn=[];$('table').innerHTML='';$('reading').classList.remove('show');$('actions').classList.remove('show');
  layoutEmpty();
}
function posLabel(i){
  let t=cur.p[i][0];
  if(cur.ab){const a=$('opt-a').value.trim(),b=$('opt-b').value.trim();
    if(a)t=t.replace(/^A:/,a+':');if(b)t=t.replace(/^B:/,b+':');}
  return t;
}
function gridSize(){return [Math.max(...cur.p.map(p=>p[2])),Math.max(...cur.p.map(p=>p[3]))];}
/* card width: as big as the width allows; spreads of ≤3 rows should also
   fit the screen height, so the whole spread is seen at once */
function sizeCards(){
  if(!cur)return;
  const [cols,rows]=gridSize(),t=$('table');
  const W=Math.min(t.parentElement.clientWidth||window.innerWidth,1460);
  const gap=W<640?8:12,lab=W<640?34:44;
  let cw=(W-(cols-1)*gap)/cols-(W<640?8:30);
  /* 1–2 rows: fit the screen height too, so the whole spread is in view;
     taller spreads scroll, with a smaller cap so they stay readable */
  if(rows<=2){const H=window.innerHeight-(W<640?120:220);cw=Math.min(cw,(H/rows-lab-gap)/1.72);}
  const cap=W<640?150:rows<=2?230:rows<=4?190:150;
  cw=Math.max(W<640?66:120,Math.min(cw,cap));
  t.style.setProperty('--cw',Math.floor(cw)+'px');
  t.style.columnGap=gap+'px';
}
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(sizeCards,120);});
function layoutEmpty(){
  const [cols,rows]=gridSize(),t=$('table');sizeCards();
  t.style.gridTemplateColumns=`repeat(${cols},calc(var(--cw) + 16px))`;
  t.style.gridTemplateRows=`repeat(${rows},auto)`;
  t.innerHTML=cur.p.map((p,i)=>`<div class="slot${p[4]?' cross':''}" style="grid-column:${p[2]};grid-row:${p[3]}">
     <div class="pn"><b>${i+1}</b>${posLabel(i)}</div>
     <div style="width:var(--cw);height:calc(var(--cw) * 1.72);border:1px dashed rgba(201,168,76,.18);border-radius:7px${p[4]?';transform:rotate(90deg)':''}"></div></div>`).join('');
}
function draw(){
  const deck=shuffle(),useRev=$('rev').checked;
  question=$('question').value.trim();
  drawn=cur.p.map((p,i)=>({c:deck[i],rev:useRev&&rnd(2)===1,up:false}));
  const [cols,rows]=gridSize(),t=$('table');sizeCards();
  t.style.gridTemplateColumns=`repeat(${cols},calc(var(--cw) + 16px))`;
  t.style.gridTemplateRows=`repeat(${rows},auto)`;
  t.innerHTML=cur.p.map((p,i)=>`<div class="slot${p[4]?' cross':''}" data-i="${i}" style="grid-column:${p[2]};grid-row:${p[3]}">
     <div class="pn"><b>${i+1}</b>${posLabel(i)}</div>
     <div class="card3d" data-i="${i}" style="animation-delay:${i*70}ms"><div class="inner">
       <div class="face back-f">${BACK}</div><div class="face front">${faceHTML(drawn[i].c,drawn[i].rev)}</div></div></div></div>`).join('');
  t.querySelectorAll('.card3d').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;drawn[i].up?openZoom(i):flip(i);});
  $('actions').classList.add('show');
  renderReading();
  setTimeout(()=>$('table').scrollIntoView({behavior:'smooth',block:'start'}),60);
}
/* ── zoom: one card large, with its full text; ← → walk the spread ── */
let zi=-1;
function openZoom(i){
  zi=i;const d=drawn[i],c=d.c,p=cur.p[i],Z=$('zoom');
  $('zoom-in').innerHTML=`<button class="zoom-x" type="button" aria-label="დახურვა">✕</button>
    <div class="zoom-card">${faceHTML(c,d.rev)}</div>
    <div><div class="pos">${i+1}. ${posLabel(i)} — ${p[1]}</div>
      <div class="nm">${c.major?ROMAN[c.n]+' ':''}${c.name}${d.rev?' <span class="rv" style="color:#e58c8c;font-size:12px">შებრუნებული</span>':''}</div>
      <div class="tags" style="font-size:11px;color:var(--ink-dim);margin-bottom:6px">${cardTags(c)}</div>
      ${richText(c,d.rev,cur)}
      <div class="zoom-nav"><button type="button" data-d="-1">← წინა</button><button type="button" data-d="1">შემდეგი →</button></div></div>`;
  Z.hidden=false;
  Z.querySelector('.zoom-x').onclick=closeZoom;
  Z.querySelectorAll('.zoom-nav button').forEach(b=>b.onclick=()=>step(+b.dataset.d));
}
function step(dir){
  for(let k=1;k<=drawn.length;k++){const j=(zi+dir*k+drawn.length*2)%drawn.length;
    if(drawn[j].up){openZoom(j);return;}}
}
function closeZoom(){const Z=$('zoom');if(Z)Z.hidden=true;zi=-1;}
function flip(i){
  if(!drawn[i]||drawn[i].up)return;drawn[i].up=true;
  $('table').querySelector(`.card3d[data-i="${i}"]`).classList.add('up');
  renderReading();
}
function flipAll(){drawn.forEach((_,i)=>setTimeout(()=>flip(i),i*120));}
function cardTags(c){
  return c.major?`დიდი არკანი ${ROMAN[c.n]} · ${c.corr}`:`${SUITS[c.suit].ka} · ${SUITS[c.suit].elka} · ${c.corr}`;
}
/* which extra line a spread asks for */
function ctxKey(sp){return sp.g==='სიყვარული'?'l':sp.g==='საქმე და ფინანსები'?'w':null;}
function richText(c,rev,sp){
  const t=c.tx;
  if(!t)return `<div class="mn">${rev?c.rv:c.up}</div>`;
  const k=ctxKey(sp),lab={l:'სიყვარულში',w:'საქმესა და ფინანსებში'};
  return `<div class="kw">${(rev?t.kr:t.k).split(',').map(x=>`<span>${x.trim()}</span>`).join('')}</div>
    <div class="mn">${rev?t.xr:t.x}</div>
    ${k&&t[k]?`<div class="ctx"><b>${lab[k]}:</b> ${t[k]}${rev?' <i>(შებრუნებული ბარათი ამას ასუსტებს ან აბრკოლებს)</i>':''}</div>`:''}
    ${t.a?`<div class="adv"><b>რჩევა:</b> ${t.a}</div>`:''}`;
}
function renderReading(){
  const R=$('reading');R.classList.add('show');
  const up=drawn.filter(d=>d.up).length;
  let h=`<h3>${cur.t}</h3>${question?`<div class="q">„${question.replace(/</g,'&lt;')}“</div>`:''}`;
  if(cur.yn&&up===drawn.length){
    const w=[1,2,1];let sc=0;drawn.forEach((d,i)=>sc+=ynOf(d.c,d.rev)*w[i]);
    const [cls,lab,txt]=sc>=2?['v-yes','კი','ბარათები დადებით პასუხს აძლევენ.']:sc<=-2?['v-no','არა','ბარათები უარყოფით პასუხს აძლევენ — ან ახლა არ არის ამის დრო.']
      :['v-maybe','შესაძლოა','პასუხი ჯერ არ არის გადაწყვეტილი — ბევრი რამ შენს ქმედებაზეა დამოკიდებული.'];
    h+=`<div class="verdict ${cls}"><b>${lab}</b>${txt} <span style="color:var(--ink-dim);font-size:12px">(ქულა ${sc>0?'+':''}${sc} · კი = +1, შესაძლოა = 0, არა = −1, ცენტრი ×2)</span></div>`;
  }
  drawn.forEach((d,i)=>{
    const p=cur.p[i];
    if(!d.up){h+=`<div class="ri pending"><div class="no">${i+1}</div><div><div class="pos">${posLabel(i)} — ${p[1]}</div><div class="nm">დახურულია — დააჭირე ბარათს</div></div></div>`;return;}
    const c=d.c,yn=cur.yn?` · ${['არა','შესაძლოა','კი'][ynOf(c,d.rev)+1]}`:'';
    h+=`<div class="ri" data-i="${i}"><div class="no">${i+1}</div><div><div class="pos">${posLabel(i)} — ${p[1]}</div>
      <div class="nm">${c.major?ROMAN[c.n]+' ':''}${c.name}${d.rev?'<span class="rv">შებრუნებული</span>':''}</div>
      <div class="tags">${cardTags(c)}${yn}</div>${richText(c,d.rev,cur)}</div></div>`;
  });
  if(up===drawn.length&&drawn.length)h+=analyse(cur,drawn);
  else if(drawn.length)h+=`<div class="note">გადაბრუნებულია ${up} / ${drawn.length} — ბალანსი გამოჩნდება ყველას გადაბრუნების შემდეგ.</div>`;
  R.innerHTML=h;
  R.querySelectorAll('.ri[data-i]').forEach(el=>{const i=+el.dataset.i,sl=$('table').querySelector(`.slot[data-i="${i}"]`);
    el.onmouseenter=()=>sl&&sl.classList.add('hl');el.onmouseleave=()=>sl&&sl.classList.remove('hl');
    el.onclick=()=>openZoom(i);});
}
function copyText(){
  const lines=[`ტარო — ${cur.t}`];if(question)lines.push(`კითხვა: ${question}`);
  drawn.forEach((d,i)=>{if(!d.up)return;const c=d.c;
    const t=c.tx,k=ctxKey(cur);
    lines.push(`${i+1}. ${posLabel(i)}: ${c.major?ROMAN[c.n]+' ':''}${c.name}${d.rev?' (შებრ.)':''}\n   ${t?(d.rev?t.xr:t.x):(d.rev?c.rv:c.up)}`+
      (t&&k&&t[k]?`\n   ${k==='l'?'სიყვარულში':'საქმეში'}: ${t[k]}`:'')+(t&&t.a?`\n   რჩევა: ${t.a}`:''));});
  const q=quintessence(drawn.filter(d=>d.up));if(q&&drawn.every(d=>d.up))lines.push(`კვინტესენცია: ${ROMAN[q.n]} ${MAJORS[q.n][0]}`);
  const txt=lines.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{$('copy').textContent='✔ დაკოპირდა';
    setTimeout(()=>$('copy').textContent='ტექსტის კოპირება',1500);}).catch(()=>prompt('დააკოპირე:',txt));
}

/* ── encyclopedia ── */
let encF='all';
function renderEnc(){
  const F=[['all','ყველა'],['major','დიდი არკანი'],['wands','კვერთხები'],['cups','თასები'],['swords','მახვილები'],['pentacles','პენტაკლები']];
  $('enc-f').innerHTML=F.map(([k,t])=>`<button class="chip${k===encF?' on':''}" data-f="${k}">${t}</button>`).join('');
  $('enc-f').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{encF=b.dataset.f;renderEnc();});
  const col={major:'var(--major)',fire:'var(--fire)',water:'var(--water)',air:'var(--air)',earth:'var(--earth)'};
  $('enc-g').innerHTML=DECK.filter(c=>encF==='all'||(encF==='major'?c.major:c.suit===encF)).map(c=>
    `<details class="enc-c" style="--elc:${col[c.el]}"><summary><span class="mini">${faceHTML(c,false)}</span><span>
       <b>${c.major?ROMAN[c.n]+' ':''}${c.name}</b><span class="t">${cardTags(c)} · კი/არა: ${{y:'კი',m:'შესაძლოა',n:'არა'}[c.yn]}</span>
       ${c.tx?`<span class="kwl">${c.tx.k}</span>`:''}</span></summary>
       <div class="enc-b">
        <div class="u">▲ ${c.tx?c.tx.x:c.up}</div><div class="r">▼ ${c.tx?c.tx.xr:c.rv}</div>
        ${c.tx?`<div class="ctx"><b>სიყვარულში:</b> ${c.tx.l}</div><div class="ctx"><b>საქმეში:</b> ${c.tx.w}</div><div class="adv"><b>რჩევა:</b> ${c.tx.a}</div>`:''}
       </div></details>`).join('');
}

$('draw').onclick=draw;$('flipall').onclick=flipAll;$('copy').onclick=copyText;
['opt-a','opt-b'].forEach(id=>$(id).addEventListener('input',()=>{if(drawn.length){
  document.querySelectorAll('.slot .pn').forEach((el,i)=>el.innerHTML=`<b>${i+1}</b>${posLabel(i)}`);renderReading();}else layoutEmpty();}));
const qs=new URLSearchParams(location.search).get('spread');
renderGroups();
if(SPREADS.some(s=>s.id===qs))select(qs);else showGallery();
$('fb-back').onclick=()=>{history.pushState({},'',location.pathname);showGallery();};
window.addEventListener('popstate',e=>{const id=new URLSearchParams(location.search).get('spread');
  SPREADS.some(s=>s.id===id)?select(id):showGallery();});
$('zoom').addEventListener('click',e=>{if(e.target.id==='zoom')closeZoom();});
document.addEventListener('keydown',e=>{if($('zoom').hidden)return;
  if(e.key==='Escape')closeZoom();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);});
renderEnc();
probeImages().then(e=>{if(!e)return;IMG.ext=e;renderEnc();
  const n=$('img-note');if(n)n.textContent='✔ გამოიყენება შენი სურათები (tarot/*.'+e+')';
  /* a reading already on the table gets its pictures too */
  document.querySelectorAll('#table .card3d').forEach(el=>{const i=+el.dataset.i,f=el.querySelector('.front');
    if(f&&drawn[i])f.innerHTML=faceHTML(drawn[i].c,drawn[i].rev);});});
window._tarot={DECK,SPREADS,quintessence,ynOf,analyse,IMG,imgName};
