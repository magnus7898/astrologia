<style>

.page{max-width:780px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:14px;position:relative}
.back{position:absolute;left:0;top:4px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--gold);opacity:.75;text-decoration:none;
  border:1px solid var(--border);border-radius:3px;padding:6px 11px}
.back:hover{opacity:1;border-color:var(--border-h)}

.sub{font-size:12px;color:var(--ink-dim);letter-spacing:1px;margin-top:2px}

.tabs{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.tg i{font-style:normal;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;width:84px;text-align:right;margin-right:4px}
@media(max-width:520px){.tg i{width:100%;text-align:center;margin:4px 0 0}}
.tabs button,.seg button{background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:16px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 14%,transparent)}
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.seg button{font-size:11.5px;padding:4px 11px}.seg button.on{border-color:var(--gold);color:var(--gold-lt)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.hud div{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center}
.hud b{display:block;font-family:'Cinzel',serif;font-size:20px;color:var(--gold-lt);font-weight:400;line-height:1.2}
.hud span{font-size:10px;color:var(--ink-dim);letter-spacing:.5px}
.stage{position:relative;min-height:440px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 14px;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.how{font-size:12.5px;color:var(--ink-mid);text-align:center;max-width:560px}
.how b{color:var(--gold-lt);font-weight:400}
.msg{text-align:center;font-size:13.5px;color:var(--ink-mid);min-height:22px;max-width:600px}
.msg b{color:var(--gold-lt);font-weight:400}.ok{color:var(--ok)!important}.bad{color:var(--bad)!important}
.btn{background:linear-gradient(135deg,#8a6a24,#c9a84c);color:#120c02;border:none;border-radius:6px;padding:10px 20px;font-family:'Cinzel',serif;
  font-size:12.5px;letter-spacing:2px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:none;color:var(--gold);border:1px solid var(--border-h);font-weight:400}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
canvas{display:block;width:100%;border-radius:8px;background:#07060f;border:1px solid var(--border)}
/* element guess */
.clues{width:min(100%,520px);display:flex;flex-direction:column;gap:6px}
.clue{display:flex;justify-content:space-between;gap:10px;background:var(--raised);border:1px solid var(--border);border-radius:7px;padding:7px 12px;font-size:13px;
  animation:pop .35s ease}
.clue span{color:var(--ink-dim)}.clue b{color:var(--gold-lt);font-weight:400;text-align:right}
.clue.lock{opacity:.35;animation:none}.clue.lock b{filter:blur(4px)}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,420px)}
.opt{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:10px 4px;cursor:pointer;color:var(--ink);font:inherit;text-align:center}
.opt:hover{border-color:var(--border-h)}.opt .s{display:block;font-family:'Cinzel',serif;font-size:22px;color:var(--gold-lt)}
.opt .n{font-size:10.5px;color:var(--ink-dim)}
.opt.ok{border-color:var(--ok);background:rgba(95,207,138,.12)}.opt.bad{border-color:var(--bad);background:rgba(226,104,92,.12)}
.opt.f{font-family:'Cinzel',serif;font-size:15px;padding:12px 6px}

.ion{background:var(--raised);border:1px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;min-width:120px}
.ion .f{font-family:'Cinzel',serif;font-size:26px;color:var(--gold-lt)}.ion .n{font-size:11px;color:var(--ink-dim)}
.stp{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px}

.stp b{font-family:'Cinzel',serif;font-size:20px;min-width:24px;color:var(--ink);font-weight:400}
.big{font-family:'Cinzel',serif;font-size:30px;color:var(--ink);letter-spacing:1px;min-height:44px;text-align:center}
.eq{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:6px 4px;width:100%}
.sp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 6px;border-radius:8px}
.sp .f{font-family:'Cinzel',serif;font-size:19px;color:var(--gold-lt);white-space:nowrap}
.sp .stp{margin:0;gap:3px}.sp .stp button{width:24px;height:24px;font-size:14px}

.sp input:focus{border-color:var(--border-h)}
.op{font-family:'Cinzel',serif;font-size:19px;color:var(--ink-dim);padding-top:6px}
.tally{border-collapse:collapse;font-size:12.5px}

.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(100%,430px)}
.pc{aspect-ratio:1;border-radius:8px;background:var(--raised);border:1px solid var(--border);font-family:'Cinzel',serif;font-size:clamp(15px,4.4vw,21px);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;user-select:none;transition:background .2s,border-color .2s}

.pc .fx{position:absolute;bottom:2px;left:0;right:0;font-size:8.5px;color:var(--bad);font-family:'Noto Serif Georgian',serif}
.bar{width:min(100%,430px);height:6px;border-radius:3px;background:var(--raised);overflow:hidden}.bar i{display:block;height:100%;background:var(--math);transition:width .25s linear}
.lab{font-size:11.5px;color:var(--ink-dim);text-align:center}.lab a{color:var(--gold);text-decoration:none}
</style>

  for(const k of fac){if(opts.length>=4)break;const v=ans*k;if(!set.has(fmt(v))){set.add(fmt(v));opts.push(v);}}
  PG.opts=shuf(opts);$('pq').textContent=q;$('opts').innerHTML=PG.opts.map((v,i)=>`<button class="opt f" data-i="${i}">${fmt(v)} ${u}</button>`).join('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pqAns(+b.dataset.i,b));}
function pqAns(i,b){if(PG.t<=0||PG.lock)return;const ok=PG.opts[i]===PG.cur.ans;PG.lock=true;
  if(ok){PG.streak++;PG.score+=1+(PG.streak>=5?1:0);b.classList.add('ok');$('msg').innerHTML=`<b class="ok">✓</b> ${PG.cur.f}`;}
  else{PG.streak=0;PG.t-=3;b.classList.add('bad');$('opts').querySelectorAll('.opt')[PG.opts.indexOf(PG.cur.ans)].classList.add('ok');$('msg').innerHTML=`<span class="bad">✗</span> ფორმულა: <b>${PG.cur.f}</b>`;}
  hud([PG.score,PG.streak]);setTimeout(()=>{PG.lock=false;if(PG.t>0)pqNext();},ok?450:1400);}
function pqEnd(){stopAll();const r=best('pq',PG.score);stage.innerHTML=`<div class="big">${PG.score} ქულა</div><div class="msg">${r.rec?'<b class="ok">ახალი რეკორდი!</b>':'რეკორდი: '+r.b}</div><button class="btn" id="again">თავიდან</button>`;$('again').onclick=startPq;hud([,,'0',r.b]);}

/* ══════════════ MATH 1 · the 24 game ══════════════ */
const F=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;return {n:n/g,d:d/g};};
const fop={'+':(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d),'−':(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d),'×':(a,b)=>F(a.n*b.n,a.d*b.d),'÷':(a,b)=>b.n?F(a.n*b.d,a.d*b.n):null};
const fstr=f=>f.d===1?String(f.n):`${f.n}<small>/${f.d}</small>`;
function solve24(nums){const items=nums.map(v=>({f:F(v),e:String(v)}));
  const rec=a=>{if(a.length===1)return a[0].f.n===24&&a[0].f.d===1?a[0].e:null;
    for(let i=0;i<a.length;i++)for(let j=0;j<a.length;j++){if(i===j)continue;const rest=a.filter((_,k)=>k!==i&&k!==j);
      for(const o of ['+','−','×','÷']){if((o==='+'||o==='×')&&i>j)continue;const r=fop[o](a[i].f,a[j].f);if(!r)continue;const s=rec([...rest,{f:r,e:`(${a[i].e} ${o} ${a[j].e})`}]);if(s)return s;}}return null;};
  const s=rec(items);return s?s.replace(/^\((.*)\)$/,'$1'):null;}
const MG={};
function startM24(){MG.score=0;MG.n=0;MG.t0=Date.now();MG.lvl=MG.lvl||'easy';stopAll();hud([0,'—','1',bestGet('m24')??'—'],['ამოხსნილი','დრო','რაუნდი','რეკორდი']);
  timer=setInterval(()=>hud([,Math.floor((Date.now()-MG.t0)/1000)+'წ']),500);m24Next();}
function m24Next(){
  if(MG.n>=10){stopAll();const t=Math.round((Date.now()-MG.t0)/1000),r=MG.score===10?best('m24',t,true):{b:bestGet('m24'),rec:false};
    stage.innerHTML=`<div class="big">${MG.score} / 10</div><div class="msg">დრო: ${t} წმ · ${r.rec?'<b class="ok">ახალი რეკორდი!</b>':r.b?'რეკორდი: '+r.b+' წმ':'რეკორდი ითვლება 10/10-ზე'}</div><button class="btn" id="again">თავიდან</button>`;$('again').onclick=startM24;return;}
  MG.n++;let nums,sol;const hi=MG.lvl==='easy'?9:13;do{nums=[ri(1,hi),ri(1,hi),ri(1,hi),ri(1,hi)];sol=solve24(nums);}while(!sol);MG.start=nums;MG.sol=sol;
  stage.innerHTML=`<p class="how">გამოიყენე ოთხივე რიცხვი და <b>+ − × ÷</b>, რომ მიიღო <b>24</b>. აირჩიე რიცხვი → მოქმედება → მეორე რიცხვი.</p>
   <div class="seg" id="lv"><button data-l="easy">1–9</button><button data-l="hard">1–13</button></div>
   <div class="cards24" id="c24"></div><div class="ops24" id="ops">${['+','−','×','÷'].map(o=>`<button data-o="${o}">${o}</button>`).join('')}</div>
   <div class="row"><button class="btn ghost" id="undo">↶ უკან</button><button class="btn ghost" id="reset">თავიდან</button><button class="btn ghost" id="give">პასუხი</button></div><div class="msg" id="msg"></div>`;
  $('lv').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.l===MG.lvl);b.onclick=()=>{MG.lvl=b.dataset.l;startM24();};});
  $('ops').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(MG.sel==null)return;MG.op=b.dataset.o;m24Draw();});
  $('undo').onclick=()=>{if(MG.hist.length){MG.st=MG.hist.pop();MG.sel=null;MG.op=null;m24Draw();}};
  $('reset').onclick=()=>{m24Reset();m24Draw();};
  $('give').onclick=()=>{if(MG.done)return;MG.done=true;$('msg').innerHTML=`ამოხსნა: <b>${MG.sol} = 24</b>`;setTimeout(m24Next,2600);};
  m24Reset();hud([MG.score,,MG.n+'/10']);m24Draw();}
function m24Reset(){MG.st=MG.start.map(v=>F(v));MG.hist=[];MG.sel=null;MG.op=null;MG.done=false;}
function m24Draw(){$('c24').innerHTML=MG.st.map((f,i)=>`<div class="c24${f===null?' gone':''}${MG.sel===i?' sel':''}${MG.done&&f&&f.n===24&&f.d===1?' win':''}" data-i="${i}">${f?fstr(f):''}</div>`).join('');
  $('ops').querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.o===MG.op));
  $('c24').querySelectorAll('.c24').forEach(el=>el.onclick=()=>{if(MG.done)return;const i=+el.dataset.i;if(MG.st[i]===null)return;
    if(MG.sel==null||MG.op==null||MG.sel===i){MG.sel=MG.sel===i?null:i;MG.op=null;m24Draw();return;}
    const r=fop[MG.op](MG.st[MG.sel],MG.st[i]);if(!r){$('msg').innerHTML='<span class="bad">ნულზე გაყოფა არ შეიძლება</span>';return;}
    MG.hist.push(MG.st.slice());const ns=MG.st.slice();ns[i]=r;ns[MG.sel]=null;MG.st=ns;MG.sel=i;MG.op=null;$('msg').textContent='';
    const left=MG.st.filter(Boolean);if(left.length===1){if(r.n===24&&r.d===1){MG.done=true;MG.score++;$('msg').innerHTML='<b class="ok">✓ 24!</b>';hud([MG.score]);m24Draw();setTimeout(m24Next,1100);return;}
      $('msg').innerHTML=`<span class="bad">${r.d===1?r.n:r.n+'/'+r.d} ≠ 24 — „უკან“ ან „თავიდან“</span>`;}
    m24Draw();});}

/* ══════════════ MATH 2 · prime hunter ══════════════ */
const isP=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
const fact=n=>{const f=[];for(let p=2;p*p<=n;p++)while(n%p===0){f.push(p);n/=p;}if(n>1)f.push(n);return f.join('·');};
const PH={};
function startPrime(){PH.score=0;PH.streak=0;PH.t=45;stopAll();PH.hi=60;hud([0,0,'45',bestGet('prime')??'—'],['ქულა','სერია','წამი','რეკორდი']);
  stage.innerHTML=`<p class="how">45 წამში დააჭირე რაც შეიძლება მეტ <b>მარტივ რიცხვს</b> (იყოფა მხოლოდ 1-ზე და თავის თავზე). შედგენილი −2. რიცხვები თანდათან იზრდება.</p>
   <div class="bar"><i id="pbar" style="width:100%"></i></div><div class="pg" id="pg"></div><div class="msg" id="msg"></div>`;
  PH.cells=Array.from({length:36},()=>phNum());phDraw();
  timer=setInterval(()=>{PH.t-=.25;$('pbar').style.width=Math.max(0,PH.t/45*100)+'%';hud([,,Math.ceil(Math.max(0,PH.t))]);if(PH.t<=0)phEnd();},250);}
function phNum(){const lo=Math.max(2,PH.hi-80);if(Math.random()<.42){let n;do n=ri(lo,PH.hi);while(!isP(n));return n;}let n;do n=ri(lo,PH.hi);while(isP(n)||n<4);return n;}
function phDraw(){$('pg').innerHTML=PH.cells.map((n,i)=>`<div class="pc" data-i="${i}">${n}</div>`).join('');
  $('pg').querySelectorAll('.pc').forEach(el=>el.onclick=()=>{if(PH.t<=0||el.dataset.busy)return;const i=+el.dataset.i,n=PH.cells[i];el.dataset.busy=1;
    if(isP(n)){PH.streak++;PH.score+=PH.streak>=8?2:1;PH.hi+=4;el.classList.add('ok');}
    else{PH.streak=0;PH.score=Math.max(0,PH.score-2);el.classList.add('bad');el.innerHTML=`${n}<span class="fx">${fact(n)}</span>`;}
    hud([PH.score,PH.streak]);setTimeout(()=>{PH.cells[i]=phNum();el.className='pc';el.textContent=PH.cells[i];delete el.dataset.busy;},isP(n)?260:900);});}
function phEnd(){stopAll();const r=best('prime',PH.score);stage.innerHTML=`<div class="big">${PH.score} ქულა</div><div class="msg">${r.rec?'<b class="ok">ახალი რეკორდი!</b>':'რეკორდი: '+r.b}<br>ბოლოს მიაღწიე ~${PH.hi}-მდე რიცხვებს.</div><button class="btn" id="again">თავიდან</button>`;$('again').onclick=startPrime;hud([,,'0',r.b]);}

/* ══════════════ MATH 3 · match the graph ══════════════ */
const nz=()=>pick([-3,-2,-1,1,2,3]),sg=(v,first)=>v<0?(first?'−':' − ')+Math.abs(v):(first?'':' + ')+v,co=(a,v)=>a===1?v:a===-1?'−'+v:a+v;
const FAM=[
 ()=>{const a=pick([-2,-1,-.5,.5,1,2,3]),b=ri(-3,3);return {f:x=>a*x+b,t:`y = ${co(a,'x')}${b?sg(b):''}`};},
 ()=>{const a=pick([-1,-.5,.5,1,2]),h=ri(-2,2),k=ri(-3,3);return {f:x=>a*(x-h)**2+k,t:`y = ${co(a,h?`(x${sg(-h)})²`:'x²')}${k?sg(k):''}`};},
 ()=>{const a=pick([1,2,3]),b=pick([.5,1,2]);return {f:x=>a*Math.sin(b*x),t:`y = ${a===1?'':a}sin(${b===1?'':b}x)`};},
 ()=>{const a=pick([1,2,3]),b=pick([.5,1,2]);return {f:x=>a*Math.cos(b*x),t:`y = ${a===1?'':a}cos(${b===1?'':b}x)`};},
 ()=>{const b=pick([2,3,.5]);return {f:x=>b**x,t:`y = ${b}ˣ`};},
 ()=>{const a=pick([1,-1,2]),k=ri(-2,2);return {f:x=>a*Math.abs(x)+k,t:`y = ${co(a,'|x|')}${k?sg(k):''}`};},
 ()=>{const a=pick([1,-1,2,4]);return {f:x=>x===0?NaN:a/x,t:`y = ${a<0?'−':''}${Math.abs(a)}/x`};},
 ()=>{const a=pick([1,2,-1]),h=ri(-3,1);return {f:x=>x-h<0?NaN:a*Math.sqrt(x-h),t:`y = ${co(a,h?`√(x${sg(-h)})`:'√x')}`};},
 ()=>{const a=pick([.25,.5,1,-.5]),b=ri(-3,3);return {f:x=>a*x**3+b,t:`y = ${co(a,'x³')}${b?sg(b):''}`};},
 ()=>{const k=pick([1,2,-1]);return {f:x=>x<=0?NaN:k*Math.log(x),t:`y = ${co(k,'ln x')}`};},
];
const GG={};
function startGraph(){GG.score=0;GG.streak=0;GG.n=0;hud([0,0,'1/12',bestGet('graph')??'—'],['ქულა','სერია','რაუნდი','რეკორდი']);
  stage.innerHTML=`<p class="how">რომელი ფორმულის გრაფიკია? (ბადის ბიჯი = 1)</p><div style="width:min(100%,460px)" id="gw"></div><div class="opts" id="opts" style="grid-template-columns:repeat(2,1fr);width:min(100%,460px)"></div><div class="msg" id="msg"></div>`;
  GG.c=cv(w=>Math.round(w*.72));$('gw').appendChild(GG.c);GG.c.fit();grNext();}
function sample(f){return Array.from({length:41},(_,i)=>f(-5+i*.25));}
function grNext(){if(GG.n>=12){const r=best('graph',GG.score);stage.innerHTML=`<div class="big">${GG.score} / 12</div><div class="msg">${r.rec?'<b class="ok">ახალი რეკორდი!</b>':'რეკორდი: '+r.b}</div><button class="btn" id="again">თავიდან</button>`;$('again').onclick=startGraph;hud([,,,r.b]);return;}
  GG.n++;GG.done=false;const fi=ri(0,FAM.length-1),ans=FAM[fi]();const opts=[ans],seen=new Set([ans.t]);
  const same=()=>FAM[fi](),other=()=>FAM[ri(0,FAM.length-1)]();let guard=0;
  while(opts.length<4&&guard++<200){const c=(opts.length<3&&GG.n>3)?same():other();if(seen.has(c.t))continue;
    const a=sample(ans.f),b=sample(c.f);if(a.every((v,i)=>(isNaN(v)&&isNaN(b[i]))||Math.abs(v-b[i])<1e-6))continue;seen.add(c.t);opts.push(c);}
  GG.ans=ans;GG.opts=shuf(opts);grDraw(ans.f,null);
  $('opts').innerHTML=GG.opts.map((o,i)=>`<button class="opt f" data-i="${i}">${o.t}</button>`).join('');$('msg').textContent='';
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(GG.done)return;GG.done=true;const o=GG.opts[+b.dataset.i],ok=o===GG.ans;
    if(ok){GG.score++;GG.streak++;b.classList.add('ok');$('msg').innerHTML='<b class="ok">✓ სწორია</b>';}
    else{GG.streak=0;b.classList.add('bad');$('opts').querySelectorAll('.opt')[GG.opts.indexOf(GG.ans)].classList.add('ok');grDraw(GG.ans.f,o.f);$('msg').innerHTML=`<span class="bad">✗</span> შენი არჩევანი — წყვეტილი ხაზი`;}
    hud([GG.score,GG.streak]);setTimeout(grNext,ok?900:2200);});hud([GG.score,GG.streak,GG.n+'/12']);}
function grDraw(f,g){const c=GG.c,x=c.getContext('2d'),W=c.W,H=c.H,sx=W/12,sy=H/10,X=v=>W/2+v*sx,Y=v=>H/2-v*sy;
  x.fillStyle='#07060f';x.fillRect(0,0,W,H);x.strokeStyle='rgba(201,168,76,.08)';for(let i=-6;i<=6;i++){x.beginPath();x.moveTo(X(i),0);x.lineTo(X(i),H);x.stroke();}for(let j=-5;j<=5;j++){x.beginPath();x.moveTo(0,Y(j));x.lineTo(W,Y(j));x.stroke();}
  x.strokeStyle='rgba(201,168,76,.45)';x.beginPath();x.moveTo(0,Y(0));x.lineTo(W,Y(0));x.moveTo(X(0),0);x.lineTo(X(0),H);x.stroke();
  x.fillStyle='rgba(179,166,143,.7)';x.font='9px Cinzel';x.textAlign='center';for(let i=-5;i<=5;i++)if(i)x.fillText(i,X(i),Y(0)+11);x.textAlign='right';for(let j=-4;j<=4;j++)if(j)x.fillText(j,X(0)-3,Y(j)+3);
  const plot=(fn,col,dash)=>{x.strokeStyle=col;x.lineWidth=2.2;x.setLineDash(dash||[]);x.beginPath();let pen=false,py=null;
    for(let px=0;px<=W;px+=1){const v=fn((px-W/2)/sx);if(!isFinite(v)||Math.abs(v)>40||(py!==null&&Math.abs(v-py)>8)){pen=false;py=isFinite(v)?v:null;continue;}const yy=Y(v);pen?x.lineTo(px,yy):x.moveTo(px,yy);pen=true;py=v;}
    x.stroke();x.setLineDash([]);x.lineWidth=1;};
  plot(f,'#a585ef');if(g)plot(g,'#e2685c',[6,5]);}

/* ══════════════ tabs ══════════════ */
const TABS=[
 {g:'ქიმია',c:'var(--chem)',k:'elem',n:'გამოიცანი ელემენტი',run:startElem},{g:'ქიმია',c:'var(--chem)',k:'ion',n:'იონებიდან ფორმულა',run:startIon},{g:'ქიმია',c:'var(--chem)',k:'bal',n:'გაათანაბრე რეაქცია',run:startBal},
 {g:'ფიზიკა',c:'var(--phys)',k:'cannon',n:'ბალისტიკა პლანეტებზე',run:startCannon},{g:'ფიზიკა',c:'var(--phys)',k:'orbit',n:'ორბიტაზე გაყვანა',run:startOrbit},{g:'ფიზიკა',c:'var(--phys)',k:'pq',n:'ფორმულების სპრინტი',run:startPq},
 {g:'მათემატიკა',c:'var(--math)',k:'m24',n:'თამაში 24',run:startM24},{g:'მათემატიკა',c:'var(--math)',k:'prime',n:'მარტივი რიცხვების ნადირობა',run:startPrime},{g:'მათემატიკა',c:'var(--math)',k:'graph',n:'გრაფიკი და ფორმულა',run:startGraph},
];
function go(k){const T=TABS.find(t=>t.k===k)||TABS[0];stopAll();CG.fly=OG.fly=false;
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===T.k));
  try{history.replaceState(null,'','?t='+T.k);}catch(e){}T.run();}
$('tabs').innerHTML=['ქიმია','ფიზიკა','მათემატიკა'].map(g=>`<div class="tg"><i style="color:${TABS.find(t=>t.g===g).c}">${g}</i>${TABS.filter(t=>t.g===g).map(t=>`<button data-k="${t.k}" style="--c:${t.c}">${t.n}</button>`).join('')}</div>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.k));
if(/index\.html|\/$/.test(document.referrer)&&!/games\.html/.test(document.referrer)){$('back').href='index.html?g=science';$('back').textContent='← მეცნიერებები';}
window.addEventListener('resize',()=>{[CG.c,OG.c,GG.c].forEach(c=>{if(c&&c.isConnected)c.fit();});if(CG.c&&CG.c.isConnected&&!CG.fly)cDraw();if(OG.c&&OG.c.isConnected&&!OG.fly)oDraw();if(GG.c&&GG.c.isConnected&&GG.ans)grDraw(GG.ans.f,null);});
go(new URLSearchParams(location.search).get('t')||'elem');
</script>
