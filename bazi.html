<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ბაძი · ოთხი სვეტი</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Noto+Sans+Georgian:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<style>
:root{--bg:#06050f;--surface:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.07);--gold:#c8a96e;--gold-dim:rgba(200,169,110,0.3);--text:#e8e2d5;--muted:rgba(232,226,213,0.42);--vio:#9b7fe8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Georgian',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 15% 20%,rgba(60,35,120,.28) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 85% 75%,rgba(20,55,80,.22) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 55% 45%,rgba(70,20,50,.15) 0%,transparent 55%)}
.page{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:56px 20px 100px}
.page-header{text-align:center;margin-bottom:40px}
.eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin-bottom:14px;opacity:.8}
.page-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(34px,7vw,54px);line-height:1.05}
.page-title em{font-style:italic;color:rgba(232,226,213,.5)}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
.ornament-line{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.ornament-line.r{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.ornament-dot{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);opacity:.6}
.lead{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.85;max-width:620px;margin:0 auto 26px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px}
.h{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.88;margin-bottom:14px}
.note{font-size:11.5px;color:var(--muted);line-height:1.8}
.note b{color:rgba(200,169,110,.9);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.in,.sel{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans Georgian',sans-serif;font-size:13px;padding:9px 11px;outline:none}
.in:focus,.sel:focus{border-color:rgba(200,169,110,.4)}
.sel option{background:#14121f}
.in.date{font-family:'Cinzel',serif;letter-spacing:2px;width:160px;text-align:center;font-size:15px}
.in.time{font-family:'Cinzel',serif;letter-spacing:2px;width:96px;text-align:center;font-size:15px}
.btn{padding:10px 24px;background:linear-gradient(135deg,rgba(155,127,232,.2),rgba(120,100,200,.1));border:1px solid rgba(155,127,232,.3);border-radius:8px;color:var(--text);font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .25s}
.btn:hover{border-color:rgba(155,127,232,.6);box-shadow:0 0 22px rgba(155,127,232,.2)}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.pill{padding:8px 18px;border-radius:20px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.02);transition:all .25s;user-select:none}
.pill:hover{color:var(--text)}
.pill.active{color:var(--gold);border-color:rgba(200,169,110,.5);background:rgba(200,169,110,.07)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:'Cinzel',serif;font-weight:400;font-size:9px;letter-spacing:1.5px;color:var(--muted);padding:7px 5px;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.035);vertical-align:top}
.tbl tr.now td{background:rgba(200,169,110,.07)}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv>div{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.kv .k{font-size:9.5px;letter-spacing:1.5px;color:var(--muted);font-family:'Cinzel',serif;text-transform:uppercase}
.kv .v{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);line-height:1.25}
.kv .t{font-size:11.5px;color:rgba(232,226,213,.62);line-height:1.55}
.txt{font-size:13.5px;font-weight:300;line-height:1.85;color:rgba(232,226,213,.78)}
.txt b{color:var(--text);font-weight:500}
.big{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:46px;line-height:1.1;color:var(--gold);text-align:center}
.sub{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.5px}
.hidden{display:none!important}
.err{color:#e87f7f;font-size:12px;text-align:center;margin-top:10px}
@media(max-width:600px){.page{padding:40px 14px 80px}.in.date{width:140px}}

.pillars{display:grid;gap:10px}
.pl{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center;overflow:hidden}
.pl.dm{border-color:rgba(200,169,110,.55);box-shadow:0 0 22px rgba(200,169,110,.12)}
.pl .ph{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.pl .ss{font-size:10.5px;color:rgba(232,226,213,.6);min-height:16px;margin-top:6px}
.pl .ch{font-family:'Noto Serif SC',serif;font-size:40px;line-height:1.15}
.pl .kn{font-size:11px;color:rgba(232,226,213,.7)}
.pl .hid{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pl .hid span{font-size:10px;border:1px solid var(--border);border-radius:6px;padding:2px 5px}
.pl .ny,.pl .st{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4}
.pl .st{color:#b8a4f0}
.pl .ksh{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.pl .ksh span{font-size:9px;border-radius:5px;padding:1px 4px;background:rgba(200,169,110,.12);color:#e8d29a}
.elbar{display:flex;align-items:center;gap:10px;margin:6px 0}
.elbar .n{width:92px;font-size:12.5px}
.elbar .b{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.elbar .b i{display:block;height:100%;border-radius:5px}
.elbar .v{width:46px;text-align:right;font-size:12px;color:var(--muted)}
.lucks{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.lk{min-width:78px;border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;font-size:10.5px;color:var(--muted);cursor:pointer}
.lk .c{font-family:'Noto Serif SC',serif;font-size:22px;line-height:1.3}
.lk.now{border-color:rgba(200,169,110,.6);background:rgba(200,169,110,.07)}
.lk.sel{outline:1px solid var(--vio)}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:center}
.form2 label{font-size:10px;color:var(--muted);letter-spacing:1px;display:block;margin-bottom:3px;font-family:'Cinzel',serif}
.form2 .in,.form2 .sel{width:100%}
.rel{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}.rel:last-child{border-bottom:0}
.tag{display:inline-block;font-size:10.5px;border-radius:8px;padding:1px 7px;margin:2px 3px 2px 0;border:1px solid}
.wheel svg{width:100%;max-width:420px;display:block;margin:0 auto}
.cond{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.cond .tg{font-size:10px;color:var(--muted);font-family:'Cinzel',serif;width:66px;text-align:right}
.hm td.c{text-align:center}
.lift{display:block;font-size:9.5px}.up{color:#7fcf7f}.dn{color:#e87f7f}
.progb{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-top:10px}.progb i{display:block;height:100%;background:var(--gold);width:0}
@media(max-width:600px){.pl .ch{font-size:30px}.pillars{gap:5px}.pl{padding:10px 2px}.pl .hid span{font-size:9px;padding:1px 3px}.pl .kn,.pl .ss,.pl .ny,.pl .st{font-size:9.5px}.cond .tg{width:auto}}
</style>
</head>
<body>
<div class="page">
<header class="page-header">
  <div class="eyebrow">ჩინური მეტაფიზიკა · 八字 · 四柱命理</div>
  <h1 class="page-title">ბაძი <em>· ბედის ოთხი სვეტი</em></h1>
  <div class="ornament"><div class="ornament-line"></div><div class="ornament-dot"></div><div class="ornament-line r"></div></div>
</header>
<div class="pills" id="tabs">
  <div class="pill active" data-v="chart">რუკა</div><div class="pill" data-v="inter">ურთიერთქმედებები</div><div class="pill" data-v="stars">ვარსკვლავები</div>
  <div class="pill" data-v="luck">იღბალი · წლები</div><div class="pill" data-v="read">ინტერპრეტაცია</div><div class="pill" data-v="compat">შეთავსება</div><div class="pill" data-v="stats">სტატისტიკა</div>
</div>
<div class="card" id="form">
  <div class="form2">
    <div><label>თარიღი</label><input class="in date" id="d1" placeholder="DD/MM/YYYY" maxlength="10"></div>
    <div><label>დრო (არასავალდ.)</label><input class="in time" id="t1" placeholder="HH:MM" maxlength="5"></div>
    <div><label>სქესი</label><select class="sel" id="s1"><option value="1">მამრობითი</option><option value="0">მდედრობითი</option></select></div>
    <div><label>UTC±</label><input class="in" id="tz1" value="4" style="text-align:center"></div>
    <div><label>გრძედი °E (ჭეშმარ. მზის დრო)</label><input class="in" id="lon1" placeholder="მაგ. 44.8" style="text-align:center"></div>
    <div><label>დღის ცვლა</label><select class="sel" id="sect"><option value="1">23:00 (ადრეული ვირთხა)</option><option value="2">00:00 (შუაღამე)</option></select></div>
  </div>
  <div id="pform" class="hidden"><div class="note" style="margin:14px 0 6px;text-align:center">პარტნიორი</div>
  <div class="form2">
    <div><label>თარიღი</label><input class="in date" id="d2" placeholder="DD/MM/YYYY" maxlength="10"></div>
    <div><label>დრო</label><input class="in time" id="t2" placeholder="HH:MM" maxlength="5"></div>
    <div><label>სქესი</label><select class="sel" id="s2"><option value="0">მდედრობითი</option><option value="1">მამრობითი</option></select></div>
  </div></div>
  <div class="row" style="margin-top:16px"><button class="btn" id="go">გამოთვლა</button></div>
  <div class="err" id="err"></div>
</div>
<div id="out"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* calendar convention (MAGNUS): Julian before 15.10.1582, Gregorian after */
const isLeap=y=>y<1582?y%4===0:(y%4===0&&y%100!==0)||y%400===0;
const dimOf=(y,m)=>[31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];
/* Gregorian (proleptic) → Julian Day Number */
function jdn(y,m,d){if(y*10000+m*100+d<15821015){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-32083;}const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function parseDate(v,ymin,ymax){
  v=(v||'').trim();const m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{1,4})$/);if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3];if(y<(ymin||1)||y>(ymax||9999)||mo<1||mo>12||d<1||d>dimOf(y,mo))return null;
  return{d,m:mo,y,dd:String(d).padStart(2,'0'),mm:String(mo).padStart(2,'0'),yyyy:String(y).padStart(4,'0')};
}
function parseTime(v){v=(v||'').trim();if(!v)return null;const m=v.match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return undefined;const h=+m[1],mi=+m[2];if(h>23||mi>59)return undefined;return{h,mi};}
function maskDate(inp){inp.addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);if(v.length>5)v=v.slice(0,5)+'/'+v.slice(5,9);e.target.value=v;});}
function maskTime(inp){inp.addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2)+':'+v.slice(2,4);e.target.value=v;});}
const fmtD=p=>p.dd+'/'+p.mm+'/'+p.yyyy;
const root9=n=>{n=Math.abs(n);while(n>9)n=String(n).split('').reduce((a,b)=>a+ +b,0);return n;};
const dsum=n=>String(Math.abs(n)).split('').reduce((a,b)=>a+ +b,0);

/* ── Chinese calendar data (Georgian) ── */
const GAN='甲乙丙丁戊己庚辛壬癸',ZHI='子丑寅卯辰巳午未申酉戌亥';
const GAN_KA=['ძია','ი','ბინ','დინ','ვუ','ძი','გენ','სინ','ჟენ','გუი'];
const ZHI_KA=['ძი','ჩოუ','ინ','მაო','ჩენ','ს','ვუ','ვეი','შენ','იოუ','სიუ','ხაი'];
const ANIMAL=['ვირთხა','ხარი','ვეფხვი','კურდღელი','დრაკონი','გველი','ცხენი','თხა','მაიმუნი','მამალი','ძაღლი','ღორი'];
const ANIMAL_EMO=['🐀','🐂','🐅','🐇','🐉','🐍','🐎','🐐','🐒','🐓','🐕','🐖'];
const EL=['ხე','ცეცხლი','მიწა','ლითონი','წყალი'];
const EL_COL=['#7fcf8f','#e86b6b','#d9b36a','#d8dde6','#6fa8e8'];
const EL_ICO=['🌳','🔥','⛰️','⚙️','💧'];
const ganEl=i=>Math.floor(i/2), ganYang=i=>i%2===0;
const ZHI_EL=[4,2,0,0,2,1,1,2,3,3,2,4];
const gi=c=>GAN.indexOf(c), zi=c=>ZHI.indexOf(c);
const elOfChar=c=>{const g=gi(c);if(g>=0)return ganEl(g);const z=zi(c);return z>=0?ZHI_EL[z]:-1;};
/* generating: wood→fire→earth→metal→water→wood ; controlling: wood→earth→water→fire→metal→wood */
const gen=e=>(e+1)%5, ctl=e=>(e+2)%5;
function elRel(a,b){/* relation of b to a */ if(a===b)return'same';if(gen(b)===a)return'mother';if(gen(a)===b)return'child';if(ctl(a)===b)return'wealth';return'enemy';}
const SHISHEN={'比肩':['თანასწორი','მეგობრები, თანატოლები, დამოუკიდებლობა'],'劫财':['სიმდიდრის მძარცველი','კონკურენცია, რისკი, გაბედულება'],
 '食神':['გემრიელი ღმერთი','შემოქმედება, სიამოვნება, ნიჭის რბილი გამოხატვა'],'伤官':['დამაზიანებელი ოფიცერი','მეამბოხე ნიჭი, ორიგინალობა, კრიტიკა'],
 '偏财':['არაპირდაპირი სიმდიდრე','მოულოდნელი შემოსავალი, ბიზნესი, გულუხვობა'],'正财':['პირდაპირი სიმდიდრე','სტაბილური შემოსავალი, ქონება, პრაქტიკულობა'],
 '七杀':['შვიდი მკვლელი','ზეწოლა, ძალაუფლება, გამოწვევა, მეომარი'],'正官':['პირდაპირი ოფიცერი','წესრიგი, სტატუსი, პასუხისმგებლობა, კანონი'],
 '偏印':['არაპირდაპირი რესურსი','ინტუიცია, უჩვეულო ცოდნა, მისტიკა'],'正印':['პირდაპირი რესურსი','მფარველობა, განათლება, დედა, მხარდაჭერა'],'日主':['დღის ოსტატი','შენ თვითონ']};
const NAYIN={'海中金':'ზღვის სიღრმის ოქრო','炉中火':'ქურის ცეცხლი','大林木':'დიდი ტყის ხე','路旁土':'გზისპირა მიწა','剑锋金':'ხმლის პირის ლითონი','山头火':'მთის მწვერვალის ცეცხლი','涧下水':'ხევის წყალი','城头土':'ციხე-კედლის მიწა','白蜡金':'თეთრი ცვილის ლითონი','杨柳木':'ტირიფის ხე','泉中水':'წყაროს წყალი','屋上土':'სახურავის მიწა','霹雳火':'ელვის ცეცხლი','松柏木':'ფიჭვის ხე','长流水':'დიდი მდინარე','沙中金':'ქვიშის ოქრო','砂中金':'ქვიშის ოქრო','山下火':'მთის ძირის ცეცხლი','平地木':'ველის ხე','壁上土':'კედლის მიწა','金箔金':'ოქროს ფურცელი','覆灯火':'ლამპრის ცეცხლი','天河水':'ციური მდინარე','大驿土':'დიდი გზის მიწა','钗钏金':'სამკაულის ოქრო','桑柘木':'თუთის ხე','大溪水':'დიდი ნაკადულის წყალი','沙中土':'ქვიშის მიწა','天上火':'ციური ცეცხლი','石榴木':'ბროწეულის ხე','大海水':'დიდი ზღვის წყალი'};
const nayinEl=s=>{const c=s.slice(-1);return {'金':3,'火':1,'木':0,'土':2,'水':4}[c];};
const HARM=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]], CLASH=[[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];

function shishen(dm,g){const a=ganEl(dm),b=ganEl(g),sp=ganYang(dm)===ganYang(g);
  if(a===b)return sp?'比肩':'劫财';if(gen(a)===b)return sp?'食神':'伤官';if(ctl(a)===b)return sp?'偏财':'正财';if(ctl(b)===a)return sp?'七杀':'正官';return sp?'偏印':'正印';}
const GZ=(g,z)=>`<span style="color:${EL_COL[ganEl(g)]}">${GAN[g]}</span><span style="color:${EL_COL[ZHI_EL[z]]}">${ZHI[z]}</span>`;

function chart(P,T,sex){
  const tz=parseFloat($('tz1').value)||0,lonS=$('lon1').value.trim(),lon=lonS===''?null:parseFloat(lonS),sect=+$('sect').value;
  const h=T?T.h:12,mi=T?T.mi:0;
  const bj=addMin(P.y,P.m,P.d,h,mi,-tz*60+480);
  let loc={y:P.y,m:P.m,d:P.d,h,mi};
  if(T&&lon!==null&&!isNaN(lon))loc=addMin(P.y,P.m,P.d,h,mi,-tz*60+lon*4+eot(P.y,P.m,P.d));
  const eB=Solar.fromYmdHms(bj.y,bj.m,bj.d,bj.h,bj.mi,0).getLunar().getEightChar();eB.setSect(sect);
  const eL=Solar.fromYmdHms(loc.y,loc.m,loc.d,loc.h,loc.mi,0).getLunar().getEightChar();eL.setSect(sect);
  const raw=[['წელი',eB.getYearGan(),eB.getYearZhi()],['თვე',eB.getMonthGan(),eB.getMonthZhi()],['დღე',eL.getDayGan(),eL.getDayZhi()]];
  if(T)raw.push(['საათი',eL.getTimeGan(),eL.getTimeZhi()]);
  const pil=raw.map(([k,g,z])=>({k,g:gi(g),z:zi(z)}));
  let yun=null;try{yun=eB.getYun(sex,sect);}catch(e){}
  return analyse({P,T,sex,pil,yun,loc,lon,tz});
}
function analyse(c){
  const pil=c.pil,dm=pil[2].g,dmE=ganEl(dm);
  /* element weights: stems 1, hidden 1/.5/.3, month branch ×2 */
  const W=[0,0,0,0,0];
  pil.forEach((p,i)=>{if(i!==2)W[ganEl(p.g)]+=1;else W[ganEl(p.g)]+=1;HIDE[p.z].forEach((h,j)=>W[ganEl(gi(h))]+=[1,.5,.3][j]*(i===1?2:1));});
  const tot=W.reduce((a,b)=>a+b,0);
  const sup=W[dmE]+W[(dmE+4)%5]-1; /* exclude the day master itself */
  const ratio=sup/(tot-1);
  const deLing=[dmE,(dmE+4)%5].includes(ZHI_EL[pil[1].z]);
  const strength=ratio>=0.6?'ძალიან ძლიერი':ratio>=0.48?'ძლიერი':ratio>=0.36?'დაბალანსებული':ratio>=0.2?'სუსტი':'ძალიან სუსტი (შესაძლო „მიმყოლი“ სტრუქტურა)';
  const strong=ratio>=0.48;
  const fav=strong?[gen(dmE),ctl(dmE),(dmE+3)%5]:[(dmE+4)%5,dmE];
  const unfav=[0,1,2,3,4].filter(e=>!fav.includes(e));
  const season=SEASON(pil[1].z);
  const climate=[5,6,7].includes(pil[1].z)?4:[11,0,1].includes(pil[1].z)?1:-1;
  /* structure: month branch main qi ten god (transparent hidden stem preferred) */
  const mh=HIDE[pil[1].z].map(gi);const stems=pil.filter((p,i)=>i!==2).map(p=>p.g);
  let sg=mh.find(x=>stems.includes(x));if(sg==null)sg=mh[0];
  let struct=shishen(dm,sg);if(struct==='比肩')struct='建禄';if(struct==='劫财')struct='羊刃';
  return Object.assign(c,{dm,dmE,W,tot,ratio,strength,strong,fav,unfav,deLing,season,climate,struct});
}
function stars(c){
  const pil=c.pil,dm=c.dm,yb=pil[0].z,db=pil[2].z,res=pil.map(()=>[]);
  const add=(i,k)=>{if(!res[i].includes(k))res[i].push(k);};
  pil.forEach((p,i)=>{
    if(NOBLE[dm].includes(p.z)||NOBLE[pil[0].g].includes(p.z))add(i,'noble');
    if(WENCH[dm]===p.z)add(i,'wen');if(LU[dm]===p.z)add(i,'lu');if(YANGREN[dm]===p.z&&dm%2===0)add(i,'yr');
    for(const base of [yb,db]){const t=trineOf(base);if(t<0)continue;if(PEACH[t]===p.z)add(i,'peach');if(HORSE[t]===p.z)add(i,'horse');if(CANOPY[t]===p.z)add(i,'canopy');if(GENERAL[t]===p.z&&i!==2)add(i,'general');}
    if((((3-yb)%12)+12)%12===p.z)add(i,'hong');if((((9-yb)%12)+12)%12===p.z)add(i,'xi');
  });
  const di=gz60(pil[2].g,pil[2].z),xs=di-di%10,vb=[(xs+10)%12,(xs+11)%12];
  pil.forEach((p,i)=>{if(i!==2&&vb.includes(p.z))add(i,'void');});
  if(['庚辰','庚戌','壬辰','戊戌'].includes(GAN[pil[2].g]+ZHI[pil[2].z]))add(2,'kuigang');
  return{res,vb};
}
function interactions(A,B,labelsA,labelsB){
  /* A,B arrays of {g,z}; if B null → within A */
  const out=[];const same=!B;B=B||A;labelsB=labelsB||labelsA;
  for(let i=0;i<A.length;i++)for(let j=same?i+1:0;j<B.length;j++){
    const a=A[i],b=B[j],la=labelsA[i],lb=labelsB[j];
    const gk=pkey(a.g,b.g),zk=pkey(a.z,b.z);
    if(GANHE[gk]!=null)out.push(['ok',`${la} ${GAN[a.g]} + ${lb} ${GAN[b.g]}`,`ღეროების შერწყმა (合) → ${EL[GANHE[gk]]}`,'კავშირი, მიზიდულობა; ორი ენერგია ერთ მიზანს ემსახურება.']);
    if(pairIn(GANCHONG,a.g,b.g))out.push(['bad',`${la} ${GAN[a.g]} ↔ ${lb} ${GAN[b.g]}`,'ღეროების შეჯახება (冲)','აზრთა სხვადასხვაობა, გარე დაპირისპირება.']);
    if(LIUHE[zk]!=null)out.push(['ok',`${la} ${ZHI[a.z]} + ${lb} ${ZHI[b.z]}`,`ექვსი ჰარმონია (六合) → ${EL[LIUHE[zk]]}`,'ფარული თანხმობა, დახმარება, კავშირი.']);
    if(pairIn(CLASH,a.z,b.z))out.push(['bad',`${la} ${ZHI[a.z]} ↔ ${lb} ${ZHI[b.z]}`,'შეჯახება (冲)','ცვლილება, მოძრაობა, კონფლიქტი, განშორება ან გადაადგილება.']);
    if(pairIn(HAI,a.z,b.z))out.push(['warn',`${la} ${ZHI[a.z]} × ${lb} ${ZHI[b.z]}`,'ზიანი (害)','ფარული უკმაყოფილება, ნდობის ნაკლებობა.']);
    if(pairIn(PO,a.z,b.z))out.push(['warn',`${la} ${ZHI[a.z]} × ${lb} ${ZHI[b.z]}`,'ნგრევა (破)','შეფერხება, დაწყებულის რღვევა.']);
    if(pairIn([[0,3]],a.z,b.z))out.push(['warn',`${la} ${ZHI[a.z]} × ${lb} ${ZHI[b.z]}`,'უზრდელობის დასჯა (子卯刑)','უხეშობა, ურთიერთობების დაძაბვა.']);
    if(a.z===b.z&&SELFX.includes(a.z))out.push(['warn',`${la} ${ZHI[a.z]} = ${lb} ${ZHI[b.z]}`,'თვითდასჯა (自刑)','საკუთარ თავთან ბრძოლა, ზედმეტი თვითკრიტიკა.']);
  }
  /* trios within the combined set */
  const all=same?A.map((x,i)=>[x.z,labelsA[i],1]):[...A.map((x,i)=>[x.z,labelsA[i],1]),...B.map((x,i)=>[x.z,labelsB[i],0])];
  const has=z=>all.filter(x=>x[0]===z).sort((u,v)=>v[2]-u[2]);
  const usesA=p=>same||p.some(x=>x.length&&x[0][2]===1);
  for(const t of SANHE){const p=t.slice(0,3).map(has);const n=p.filter(x=>x.length).length;if(!usesA(p))continue;
    if(n===3)out.push(['ok',p.map(x=>x[0][1]+' '+ZHI[x[0][0]]).join(' + '),`სამი ჰარმონია (三合) → ${EL[t[3]]}`,'ძლიერი ალიანსი — ელემენტი მძლავრად ძლიერდება.']);
    else if(n===2&&p[1].length)out.push(['ok',p.filter(x=>x.length).map(x=>x[0][1]+' '+ZHI[x[0][0]]).join(' + '),`ნახევარი სამი ჰარმონია → ${EL[t[3]]}`,'ნაწილობრივი ალიანსი.']);}
  for(const t of SANHUI){const p=t.slice(0,3).map(has);if(p.every(x=>x.length)&&usesA(p))out.push(['ok',p.map(x=>x[0][1]+' '+ZHI[x[0][0]]).join(' + '),`მიმართულების ერთობა (三会) → ${EL[t[3]]}`,'სეზონის სრული ძალა — ძალიან ძლიერი ელემენტი.']);}
  for(const t of XING3){const p=t.slice(0,3).map(has);const n=p.filter(x=>x.length).length;if(n>=2&&usesA(p))out.push(['bad',p.filter(x=>x.length).map(x=>x[0][1]+' '+ZHI[x[0][0]]).join(' + '),t[3]+(n===3?'':' (ნაწილობრივი)'),'დაძაბულობა, სამართლებრივი/ჯანმრთელობის გამოწვევები, ურთიერთობის სიმძიმე.']);}
  return out;
}
const RELCOL={ok:'#7fcf8f',bad:'#e86b6b',warn:'#e8c95a'};
function pillarHTML(c,ST){
  const order=c.pil.map((p,i)=>[p,i]).reverse();
  return `<div class="pillars" style="grid-template-columns:repeat(${order.length},minmax(0,1fr))">`+order.map(([p,i])=>{
    const isDM=i===2,ss=isDM?'日主':shishen(c.dm,p.g),st=stageOf(c.dm,p.z);
    return `<div class="pl${isDM?' dm':''}"><div class="ph">${p.k}</div><div class="ss">${SHISHEN[ss][0]}</div>
      <div class="ch" style="color:${EL_COL[ganEl(p.g)]}">${GAN[p.g]}</div><div class="kn">${GAN_KA[p.g]} · ${ganYang(p.g)?'+':'−'}${EL[ganEl(p.g)]}</div>
      <div class="ch" style="color:${EL_COL[ZHI_EL[p.z]]};margin-top:6px">${ZHI[p.z]}</div><div class="kn">${ANIMAL_EMO[p.z]} ${ANIMAL[p.z]}</div>
      <div class="hid">${HIDE[p.z].map(h=>{const g=gi(h);return `<span style="color:${EL_COL[ganEl(g)]}">${h} ${SHISHEN[shishen(c.dm,g)][0].split(' ')[0]}</span>`;}).join('')}</div>
      <div class="st">${STAGE[st]} ${STAGE_KA[st]}</div>
      <div class="ny">${NAYIN[nayinOf(p.g,p.z)]}</div>
      ${ST?`<div class="ksh">${ST.res[i].map(k=>`<span title="${SS_STAR[k][2]}">${SS_STAR[k][1]}</span>`).join('')}</div>`:''}</div>`;}).join('')+`</div>`;
}
function run(){
  $('err').textContent='';
  if(typeof Solar==='undefined'){$('err').textContent='კალენდრის ბიბლიოთეკა ვერ ჩაიტვირთა — შეამოწმე ინტერნეტი.';return;}
  const P=parseDate($('d1').value),T=parseTime($('t1').value);
  if(!P){$('err').textContent='შეიყვანე თარიღი ფორმატით DD/MM/YYYY.';return;}
  if(T===undefined){$('err').textContent='დრო ფორმატით HH:MM.';return;}
  C=chart(P,T,+$('s1').value);C2=null;
  if(TAB==='compat'){const Q=parseDate($('d2').value),T2=parseTime($('t2').value);
    if(!Q||T2===undefined){$('err').textContent='პარტნიორის თარიღი/დრო არასწორია.';}else C2=chart(Q,T2,+$('s2').value);}
  LUCKSEL=null;render();
}
function render(){
  if(TAB==='stats'){statsUI();return;}
  if(!C){$('out').innerHTML='';return;}
  const f={chart:viewChart,inter:viewInter,stars:viewStars,luck:viewLuck,read:viewRead,compat:viewCompat}[TAB];
  $('out').innerHTML=f(C)+`<div class="card note">გამოთვლა: <b>lunar-javascript</b> (6tail, MIT) — ჯიეჩი ასტრონომიულად. წელი/თვე — დაბადების ზუსტ მომენტზე (UTC+8 გადაყვანით), დღე/საათი — ადგილობრივი ან ჭეშმარიტი მზის დროით. 1582 წლამდე თარიღები — იულიუსის კალენდრით.</div>`;
  bindLuck();
}

  score+=sp[2]==='#7fcf8f'?10:sp[2]==='#e86b6b'?-12:0;
  const yr=branchRel(a.pil[0].z,b.pil[0].z);R.push([yr[2]==='#e86b6b'?'bad':'ok',`წლის ნიშნები · ${ANIMAL[a.pil[0].z]} ↔ ${ANIMAL[b.pil[0].z]}`,yr[0]+' — '+yr[1]]);
  score+=yr[2]==='#7fcf8f'?6:yr[2]==='#e86b6b'?-6:0;
  const giveB=a.fav.filter(e=>b.W[e]/b.tot>=0.22),giveA=b.fav.filter(e=>a.W[e]/a.tot>=0.22);
  score+=giveB.length*5+giveA.length*5;
  R.push([giveB.length&&giveA.length?'ok':'warn','ხელსაყრელი ელემენტების გაცვლა',`${giveB.length?`პარტნიორი გაძლევს შენთვის საჭირო ელემენტს: <b>${giveB.map(e=>EL[e]).join(', ')}</b>. `:'პარტნიორის რუკაში შენი ხელსაყრელი ელემენტები სუსტია. '}${giveA.length?`შენ აძლევ: <b>${giveA.map(e=>EL[e]).join(', ')}</b>.`:'შენს რუკაში მისი ხელსაყრელი ელემენტები სუსტია.'}`]);
  /* spouse star */
  const spouseStars=a.sex?['正财','偏财']:['正官','七杀'];
  const bAsSpouse=spouseStars.includes(shishen(a.dm,b.dm));
  if(bAsSpouse){score+=6;R.push(['ok','მეუღლის ვარსკვლავი',`პარტნიორის დღის ოსტატი შენთვის არის „${SHISHEN[shishen(a.dm,b.dm)][0]}“ — ტრადიციულად მეუღლის ვარსკვლავი.`]);}
  const pa=stars(a).res.flat(),pb=stars(b).res.flat();if(pa.includes('peach')&&pb.includes('peach'))R.push(['ok','ორივეს აქვს ატმის ყვავილი','ძლიერი რომანტიკული მიზიდულობა.']);
  const X=interactions(a.pil,b.pil,a.pil.map(p=>'შენი '+p.k),b.pil.map(p=>'მისი '+p.k));
  score+=X.filter(r=>r[0]==='ok').length*2-X.filter(r=>r[0]==='bad').length*3;
  score=Math.max(5,Math.min(98,Math.round(score)));
  const col=score>=75?'#7fcf8f':score>=55?'#c8a96e':'#e86b6b';
  return `<div class="card"><div class="note" style="text-align:center;margin-bottom:6px">შენ</div>${pillarHTML(a)}<div class="note" style="text-align:center;margin:12px 0 6px">პარტნიორი</div>${pillarHTML(b)}</div>
   <div class="card" style="text-align:center"><div class="big" style="color:${col}">${score}%</div><div class="sub">${score>=75?'ძალიან ხელსაყრელი':score>=55?'კარგი, მუშაობით':'რთული, მაგრამ გამზრდელი'}</div></div>
   <div class="card"><div class="h">ძირითადი ფაქტორები</div>${R.map(r=>`<div class="rel"><b style="color:${RELCOL[r[0]]}">${r[1]}</b><div class="txt">${r[2]}</div></div>`).join('')}</div>
   <div class="card"><div class="h">სვეტებს შორის ურთიერთქმედება (${X.length})</div>${X.map(r=>`<div class="rel"><b style="color:${RELCOL[r[0]]}">${r[2]}</b> · <span class="note">${r[1]}</span></div>`).join('')||'<div class="txt">პირდაპირი ურთიერთქმედება არ არის.</div>'}</div>`;
}

/* ════════ STATISTICS (fast engine, random sampling) ════════ */
let SC=[];
const SC_TYPES=[['dm','დღის ოსტატი',GAN.split('').map((c,i)=>[i,c+' '+GAN_KA[i]+' ('+(ganYang(i)?'+':'−')+EL[ganEl(i)]+')'])],
 ['ya','წლის ცხოველი',ZHI.split('').map((c,i)=>[i,ANIMAL[i]])],['mz','თვის შტო',ZHI.split('').map((c,i)=>[i,c+' '+ANIMAL[i]])],
 ['lack','აკლია ელემენტი',EL.map((e,i)=>[i,e])],['top','წამყვანი ელემენტი',EL.map((e,i)=>[i,e])],
 ['str','დღის ოსტატის ძალა',[[0,'სუსტი'],[1,'დაბალანსებული'],[2,'ძლიერი']]],['clash','რუკაში შეჯახება',[[1,'არის'],[0,'არ არის']]],
 ['struct','სტრუქტურა',['正官','七杀','正财','偏财','正印','偏印','食神','伤官','建禄','羊刃'].map(k=>[k,k+' '+(SHISHEN[k]?SHISHEN[k][0]:k==='建禄'?'კეთილდღეობა':'ვერძის დანა')])]];
function fastFeat(ix){
  const pil=ix.map(i=>({g:i%10,z:i%12}));const c=analyse({pil});
  const lack=c.W.map((w,i)=>w/c.tot<0.04?1:0);const top=c.W.indexOf(Math.max(...c.W));
  let clash=0;for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)if(pairIn(CLASH,pil[i].z,pil[j].z))clash=1;
  return{dm:c.dm,ya:pil[0].z,mz:pil[1].z,lack,top,str:c.ratio>=0.48?2:c.ratio>=0.36?1:0,clash,struct:c.struct,W:c.W.map(w=>w/c.tot)};
}
const featVal=(f,t,v)=>t==='lack'?f.lack[v]===1:String(f[t])===String(v);
function statsUI(){
  if(!$('st-run')){$('out').innerHTML=`<div class="card"><div class="h" style="text-align:center">სტატისტიკა · შემთხვევითი ნიმუში</div>
    <div class="row" style="margin-bottom:10px"><span class="note">წლები</span><input class="in" id="st-y0" value="1" style="width:80px;text-align:center"><span class="note">—</span><input class="in" id="st-y1" value="9999" style="width:80px;text-align:center">
    <select class="sel" id="st-n"><option value="50000">50 000 მომენტი</option><option value="200000" selected>200 000</option><option value="500000">500 000</option></select></div>
    <div id="st-conds"></div><div class="row"><span class="btn" id="st-add" style="padding:6px 12px;font-size:9.5px">+ პირობა</span><span class="btn" id="st-run">გამოთვლა</span></div>
    <div class="progb" id="st-pb" style="display:none"><i></i></div>
    <div class="note" style="text-align:center;margin-top:10px">ყოველი მომენტი — შემთხვევითი თარიღი და საათი არჩეულ დიაპაზონში. პირველი პირობა მთავარია, დანარჩენი „და“-თი ემატება. პირობის სტრიქონი აჩვენებს <span style="color:#7fcfe8">რეალურ % მთელ ნიმუშში</span>; დანარჩენი — % პირობის შიგნით და ↑↓ ცვლილება.</div></div><div id="st-out"></div>`;
    $('st-add').onclick=()=>{SC.push({t:'dm',v:0});drawSC();};$('st-run').onclick=runStats;drawSC();}
}
function drawSC(){$('st-conds').innerHTML=SC.map((c,i)=>`<div class="cond"><span class="tg">${i?'და':'მთავარი'}</span><select class="sel" data-i="${i}" data-f="t">${SC_TYPES.map(t=>`<option value="${t[0]}"${t[0]===c.t?' selected':''}>${t[1]}</option>`).join('')}</select>
  <select class="sel" data-i="${i}" data-f="v">${SC_TYPES.find(t=>t[0]===c.t)[2].map(o=>`<option value="${o[0]}"${String(o[0])===String(c.v)?' selected':''}>${o[1]}</option>`).join('')}</select><span class="note" style="cursor:pointer;font-size:16px" data-x="${i}">×</span></div>`).join('');
  $('st-conds').querySelectorAll('select').forEach(s=>s.onchange=()=>{const c=SC[+s.dataset.i];if(s.dataset.f==='t'){c.t=s.value;c.v=SC_TYPES.find(t=>t[0]===c.t)[2][0][0];drawSC();}else c.v=s.value;});
  $('st-conds').querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{SC.splice(+x.dataset.x,1);drawSC();});}
function runStats(){
  let y0=Math.max(1,Math.round(+$('st-y0').value)||1),y1=Math.min(9999,Math.round(+$('st-y1').value)||9999);if(y0>y1)[y0,y1]=[y1,y0];
  const N=+$('st-n').value,conds=SC.map(c=>({...c}));
  const B={},Cn={};SC_TYPES.forEach(t=>{B[t[0]]={};Cn[t[0]]={};});let n=0,nc=0;const Wb=[0,0,0,0,0],Wc=[0,0,0,0,0];
  const rnd=Math.random,pb=$('st-pb');pb.style.display='block';let done=0;const CH=10000;
  (function step(){
    for(let k=0;k<CH&&done<N;k++,done++){
      const y=y0+Math.floor(rnd()*(y1-y0+1)),m=1+Math.floor(rnd()*12),d=1+Math.floor(rnd()*dimOf(y,m)),h=Math.floor(rnd()*24),mi=Math.floor(rnd()*60);
      const f=fastFeat(BZF.pillars(y,m,d,h,mi,1));n++;
      for(const t of SC_TYPES){const k2=t[0];if(k2==='lack'){f.lack.forEach((v,i)=>{if(v)B.lack[i]=(B.lack[i]||0)+1;});}else B[k2][f[k2]]=(B[k2][f[k2]]||0)+1;}
      f.W.forEach((w,i)=>Wb[i]+=w);
      if(conds.every(c=>featVal(f,c.t,c.v))){nc++;for(const t of SC_TYPES){const k2=t[0];if(k2==='lack'){f.lack.forEach((v,i)=>{if(v)Cn.lack[i]=(Cn.lack[i]||0)+1;});}else Cn[k2][f[k2]]=(Cn[k2][f[k2]]||0)+1;}f.W.forEach((w,i)=>Wc[i]+=w);}
    }
    pb.firstChild.style.width=(done/N*100)+'%';
    if(done<N){setTimeout(step,0);return;}
    pb.style.display='none';showStats({n,nc,B,Cn,Wb,Wc,conds,y0,y1});
  })();
}
function showStats(S){
  const has=S.conds.length>0,NN=has?S.nc:S.n,CC=has?S.Cn:S.B;
  const lift=(c,b)=>{if(!has||!b)return '';const r=c/b;if(Math.abs(r-1)<0.08)return '<span class="lift" style="opacity:.4">≈</span>';return r>1?`<span class="lift up">↑${r.toFixed(1)}×</span>`:`<span class="lift dn">↓${r.toFixed(2)}×</span>`;};
  const fp=p=>p>=10?p.toFixed(1):p>=1?p.toFixed(2):p>0?p.toFixed(3):'0';
  let h=`<div class="card"><div class="kv"><div><div class="k">დიაპაზონი</div><div class="v" style="font-size:22px">${S.y0}–${S.y1}</div></div><div><div class="k">ნიმუში</div><div class="v" style="font-size:22px">${S.n.toLocaleString('en-US')}</div></div>
    ${has?`<div><div class="k">პირობას აკმაყოფილებს</div><div class="v" style="font-size:22px">${fp(S.nc/S.n*100)}%</div><div class="t">${S.conds.map(c=>{const t=SC_TYPES.find(x=>x[0]===c.t);return t[1]+': '+t[2].find(o=>String(o[0])===String(c.v))[1];}).join(' · ')}</div></div>`:''}</div></div>`;
  if(has&&!S.nc){$('st-out').innerHTML=h+'<div class="card txt">ამ პირობებით შემთხვევა არ მოიძებნა.</div>';return;}
  for(const t of SC_TYPES){const condRow=has&&S.conds.some(c=>c.t===t[0]);
    const rows=t[2].map(o=>{const k=o[0];const b=(S.B[t[0]][k]||0)/S.n*100,c=(CC[t[0]][k]||0)/NN*100;
      const sel=condRow&&S.conds.some(cc=>cc.t===t[0]&&String(cc.v)===String(k));
      const v=condRow?b:c;return {o,v,b,c,sel};});
    const mx=Math.max(...rows.map(r=>r.v));
    h+=`<div class="card"><div class="h">${t[1]}${condRow?' <span style="color:#7fcfe8">· პირობა — მთელი ნიმუში</span>':''}</div>`+rows.map(r=>`<div class="elbar"><span class="n" style="width:170px;${r.sel?'color:#7fcfe8':''}">${r.o[1]}</span><div class="b"><i style="width:${mx?r.v/mx*100:0}%;background:${condRow?(r.sel?'#7fcfe8':'rgba(232,226,213,.25)'):'var(--gold)'}"></i></div><span class="v" style="width:74px">${fp(r.v)}%${condRow?'':lift(r.c,r.b)}</span></div>`).join('')+`</div>`;}
  const Wv=(has?S.Wc:S.Wb).map(w=>w/NN*100);
  h+=`<div class="card"><div class="h">ელემენტების საშუალო წილი</div>${Wv.map((w,i)=>`<div class="elbar"><span class="n" style="color:${EL_COL[i]}">${EL[i]}</span><div class="b"><i style="width:${w/Math.max(...Wv)*100}%;background:${EL_COL[i]}"></i></div><span class="v" style="width:74px">${w.toFixed(1)}%${lift(w,S.Wb[i]/S.n*100)}</span></div>`).join('')}</div>
   <div class="card note">სწრაფი ძრავა: დღის სვეტი — იულიუსის დღის რიცხვით, თვე/წელი — მზის გრძედით (მეუსი + ΔT), შედარებულია lunar-javascript-თან: 1–9999 წლებში თვის სვეტის დამთხვევა ≥99.7%, დანარჩენი — 100%. „აკლია“ = ელემენტის წილი &lt;4%; ძალა: სუსტი &lt;36%, ძლიერი ≥48% მხარდაჭერა.</div>`;
  $('st-out').innerHTML=h;
}
</script>
