<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>მარსული ასტროლოგია</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@300;400;600&family=IM+Fell+English:ital@0;1&family=Noto+Sans+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0503;--rust:#c2542a;--rust-l:#f08050;--dust:#e8b07a;--gold:#e0a850;
  --txt:#f0ddc8;--dim:rgba(200,160,130,0.55);--earth:#5b9ec4}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--txt);font-family:'Noto Sans Georgian',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 80px;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1px 1px at 12% 18%,rgba(255,235,215,.5) 0,transparent 100%),
  radial-gradient(1px 1px at 31% 42%,rgba(255,235,215,.3) 0,transparent 100%),
  radial-gradient(1px 1px at 58% 11%,rgba(255,235,215,.4) 0,transparent 100%),
  radial-gradient(1px 1px at 79% 33%,rgba(255,235,215,.45) 0,transparent 100%),
  radial-gradient(1px 1px at 44% 77%,rgba(255,235,215,.3) 0,transparent 100%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(ellipse 700px 420px at 25% 15%,rgba(194,84,42,.10) 0,transparent 70%),
  radial-gradient(ellipse 520px 520px at 82% 72%,rgba(122,47,20,.12) 0,transparent 70%)}
.hero{position:relative;z-index:1;text-align:center;padding:36px 24px 16px;width:100%}
.globe{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#f0a070 0%,#c2542a 45%,#6a2410 78%,#2a0e05 100%);
  box-shadow:0 0 28px rgba(194,84,42,.45),inset -5px -5px 12px rgba(0,0,0,.6)}
.hero-eyebrow{font-size:9px;letter-spacing:7px;text-transform:uppercase;color:var(--rust-l);opacity:.6;margin-bottom:9px;font-family:'Cinzel',serif}
.hero-title{font-family:'Cinzel Decorative',serif;font-size:clamp(19px,4vw,34px);letter-spacing:3px;
  background:linear-gradient(160deg,#ffd9b0 0%,var(--rust-l) 35%,#8a3818 62%,#f0c090 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:var(--dim);margin-top:7px}
.panel{position:relative;z-index:1;width:100%;max-width:860px;padding:0 16px;margin-top:18px}
.card{background:rgba(20,8,4,.75);border:1px solid rgba(194,84,42,.28);border-radius:14px;padding:18px;margin-bottom:14px}
.card-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--rust-l);opacity:.8;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid rgba(194,84,42,.18)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:96px}
label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--rust-l);opacity:.7;font-family:'Cinzel',serif}
input,select{background:rgba(14,6,3,.7);border:1px solid rgba(194,84,42,.35);border-radius:8px;
  color:var(--txt);padding:9px 12px;font-size:13px;font-family:'Noto Sans Georgian',sans-serif;width:100%}
input:focus,select:focus{outline:none;border-color:var(--rust-l);box-shadow:0 0 0 3px rgba(194,84,42,.15)}
.btn{background:linear-gradient(135deg,#a03a18,#f08050);color:#160804;border:none;border-radius:9px;
  padding:11px 22px;font-size:12px;cursor:pointer;letter-spacing:2px;font-family:'Cinzel',serif;font-weight:600;width:100%;margin-top:10px}
.btn:hover{filter:brightness(1.15)}
svg#wheel{width:100%;height:auto;display:block;overflow:visible}
.sec{font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:var(--rust-l);text-transform:uppercase;
  text-align:center;margin:22px 0 12px;display:flex;align-items:center;gap:12px}
.sec::before,.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(194,84,42,.35),transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:rgba(200,160,130,.5);padding:6px 10px;text-align:left;font-weight:400;font-size:9px;
  text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(194,84,42,.22)}
td{padding:5px 10px;border-bottom:1px solid rgba(30,14,6,.9);font-size:12px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(60,26,10,.4)}
.deg{font-family:'Cinzel',serif;font-size:11px;color:#e8ceb0;white-space:nowrap}
.badge{display:inline-block;background:rgba(60,24,10,.7);border:1px solid rgba(194,84,42,.4);
  border-radius:4px;padding:1px 6px;font-size:10px;color:var(--dust);font-family:'Cinzel',serif}
.retro{color:#f87171;font-size:9px}
.note{font-size:10px;color:rgba(200,160,130,.45);line-height:1.7;margin-top:10px}
.hl{background:rgba(91,158,196,.12);border-left:3px solid var(--earth);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:12px;line-height:1.9}
</style>
</head>
<body>

<div class="hero">
  <div class="globe"></div>
  <div class="hero-eyebrow">არეოცენტრული ზოდიაქო</div>
  <h1 class="hero-title">მარსული ასტროლოგია</h1>
  <p class="hero-sub">Areocentric Chart · Olympus Mons · 18.65°N 226.2°E</p>
</div>

<div class="panel">
  <div class="card">
    <div class="card-title">🚀 მომენტი (დედამიწის UTC)</div>
    <div class="row">
      <div class="field"><label>დღე</label><input type="number" id="i-day" value="1" min="1" max="31"></div>
      <div class="field"><label>თვე</label><input type="number" id="i-month" value="1" min="1" max="12"></div>
      <div class="field"><label>წელი</label><input type="number" id="i-year" value="1990"></div>
      <div class="field"><label>საათი</label><input type="number" id="i-hour" value="12" min="0" max="23"></div>
      <div class="field"><label>წუთი</label><input type="number" id="i-min" value="0" min="0" max="59"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field" style="min-width:200px"><label>ადგილი მარსზე</label>
        <select id="i-place">
          <option value="18.65,226.2" selected>🌋 ოლიმპუს მონსი</option>
          <option value="-13.9,301.4">🏔 ვალის მარინერისი</option>
          <option value="-4.59,137.44">🤖 გეილის კრატერი (Curiosity)</option>
          <option value="18.44,77.45">🚁 ჯეზერო (Perseverance)</option>
          <option value="0,0">📍 Airy-0 (ნულოვანი მერიდიანი)</option>
          <option value="-42.4,70.5">🕳 ჰელასის აუზი</option>
          <option value="25.02,147.21">🌋 ელისიუმ მონსი</option>
        </select></div>
      <div class="field"><label>სახელი</label><input id="i-name" placeholder="სახელი"></div>
    </div>
    <button class="btn" onclick="gen()">✦ მარსული რუქის გენერაცია ✦</button>
    <button class="btn" onclick="setNow();gen()" style="background:none;border:1px solid rgba(240,128,80,.45);color:var(--rust-l)">🕐 ახლა</button>
  </div>

  <div id="out" style="display:none">
    <div class="sec" id="lbl"></div>
    <svg id="wheel" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="earthbox"></div>
    <div class="sec">სხეულები</div>
    <div class="grid2">
      <div class="card" style="padding:0;overflow:hidden">
        <div class="card-title" style="padding:9px 14px;margin:0;border-bottom:1px solid rgba(194,84,42,.2)">🪐 არეოცენტრული</div>
        <table><thead><tr><th></th><th>სხეული</th><th>გრადუსი</th><th>ნიშანი</th><th>სახ.</th><th>℞</th></tr></thead>
        <tbody id="ptb"></tbody></table>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="card-title" style="padding:9px 14px;margin:0;border-bottom:1px solid rgba(194,84,42,.2)">🏠 სახლები</div>
        <table><thead><tr><th>სახლი</th><th>ნიშანი</th><th>გრადუსი</th></tr></thead>
        <tbody id="htb"></tbody></table>
      </div>
    </div>
    <div class="sec">ასპექტები</div>
    <div class="card" style="padding:0 0 8px;overflow:hidden">
      <div class="card-title" id="atitle" style="padding:9px 14px;margin:0;border-bottom:1px solid rgba(194,84,42,.2)">⚡ ასპექტები</div>
      <table><thead><tr><th>სხეული 1</th><th>ასპ.</th><th>სხეული 2</th><th>ტიპი</th><th>ორბი</th></tr></thead>
      <tbody id="atb"></tbody></table>
    </div>
    <div class="card">
      <div class="card-title">🕐 მარსული დრო</div>
      <div id="mtime" style="font-size:12px;line-height:2"></div>
    </div>
  </div>
</div>

<script>
/* ═══ AREOCENTRIC ASTROLOGY ENGINE ════════════════════════════
   Heliocentric positions from JPL Keplerian elements (1800–2050,
   accuracy ~arcmin), then vector-subtract Mars → areocentric.
   Horizon/meridian from Mars's IAU pole + rotation W at
   Olympus Mons. Everything client-side.
   ════════════════════════════════════════════════════════════ */
const D2R=Math.PI/180,R2D=180/Math.PI,EPS=23.4392911*D2R;
const norm=x=>((x%360)+360)%360;
const SIGN_KA=['ვერძი','კურო','ტყუპები','კირჩხიბი','ლომი','ქალწული','სასწორი','მორიელი','მშვილდოსანი','თხის რქა','მერწყული','თევზები'];
const ZSYM=['♈︎','♉︎','♊︎','♋︎','♌︎','♍︎','♎︎','♏︎','♐︎','♑︎','♒︎','♓︎'];
const ZCOL=['#e05252','#8aab6e','#89b4d4','#5b8ec4','#d4602e','#7a9e6a','#7fb8d8','#4a7ab0','#c84a32','#6b9062','#90c0dc','#6688c0'];

/* a, e, I, L, varpi, Omega + per-century rates */
const KEP={
 'მზე':null,
 'მერკური':[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593,
            0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081],
 'ვენერა':[0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255,
           0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418],
 'დედამიწა':[1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0.0,
             0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0.0],
 'მარსი':[1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891,
          0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343],
 'იუპიტერი':[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909,
             -0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106],
 'სატურნი':[9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448,
            -0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794],
 'ურანი':[19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503,
          -0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589],
 'ნეპტუნი':[30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574,
            0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.00508664],
 'პლუტონი':[39.48211675,0.24882730,17.14001206,238.92903833,224.06891629,110.30393684,
            -0.00031596,0.00005170,0.00004818,145.20780515,-0.04062942,-0.01183482]
};
const PI_={
 'მზე':{sym:'☉',color:'#f9c646'},'დედამიწა':{sym:'⊕',color:'#5b9ec4'},
 'მერკური':{sym:'☿',color:'#a0c8d0'},'ვენერა':{sym:'♀',color:'#e87878'},
 'იუპიტერი':{sym:'♃',color:'#e89040'},'სატურნი':{sym:'♄',color:'#c8c840'},
 'ურანი':{sym:'♅',color:'#50c8d8'},'ნეპტუნი':{sym:'♆',color:'#6070d8'},
 'პლუტონი':{sym:'⯓',color:'#c050a0'},'ფობოსი':{sym:'Φ',color:'#c8a890'},
 'დეიმოსი':{sym:'Δ',color:'#a89078'},'AC':{sym:'AC',color:'#f0a850'},'MC':{sym:'MC',color:'#f0a850'}
};
const ORDER=['მზე','დედამიწა','მერკური','ვენერა','იუპიტერი','სატურნი','ურანი','ნეპტუნი','პლუტონი','ფობოსი','დეიმოსი','AC','MC'];

const jd=dt=>dt.getTime()/86400000+2440587.5;
function helio(k,T){
  const e0=KEP[k];
  const a=e0[0]+e0[6]*T, e=e0[1]+e0[7]*T, I=(e0[2]+e0[8]*T)*D2R,
        L=e0[3]+e0[9]*T, vp=e0[4]+e0[10]*T, Om=(e0[5]+e0[11]*T)*D2R;
  let M=norm(L-vp)*D2R; if(M>Math.PI)M-=2*Math.PI;
  let E=M; for(let i=0;i<8;i++)E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const w=(vp*D2R)-Om, cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(Om),sO=Math.sin(Om),ci=Math.cos(I),si=Math.sin(I);
  return[(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp,
         (cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp,
         (sw*si)*xp+(cw*si)*yp];
}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const lonOf=v=>norm(Math.atan2(v[1],v[0])*R2D);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const unit=v=>{const n=Math.hypot(...v);return[v[0]/n,v[1]/n,v[2]/n];};

/* areocentric longitudes at a given JD */
function areo(J){
  const T=(J-2451545.0)/36525;
  const mars=helio('მარსი',T), out={};
  out['მზე']=lonOf([-mars[0],-mars[1],-mars[2]]);
  for(const k of ['მერკური','ვენერა','დედამიწა','იუპიტერი','სატურნი','ურანი','ნეპტუნი','პლუტონი'])
    out[k]=lonOf(sub(helio(k,T),mars));
  return out;
}
/* Mars pole (IAU) in ecliptic frame + body→ecliptic rotation */
function marsFrame(J){
  const T=(J-2451545.0)/36525, d=J-2451545.0;
  const a0=(317.68143-0.1061*T)*D2R, d0=(52.88650-0.0609*T)*D2R, W=norm(176.630+350.89198226*d)*D2R;
  const eq2ec=v=>[v[0],v[1]*Math.cos(EPS)+v[2]*Math.sin(EPS),-v[1]*Math.sin(EPS)+v[2]*Math.cos(EPS)];
  const pole=eq2ec([Math.cos(d0)*Math.cos(a0),Math.cos(d0)*Math.sin(a0),Math.sin(d0)]);
  const bf2eq=v=>{ // Rz(a0+90)·Rx(90-d0)·Rz(W)
    const z1=a0+Math.PI/2, x1=Math.PI/2-d0;
    let p=[v[0]*Math.cos(W)-v[1]*Math.sin(W), v[0]*Math.sin(W)+v[1]*Math.cos(W), v[2]];
    p=[p[0], p[1]*Math.cos(x1)-p[2]*Math.sin(x1), p[1]*Math.sin(x1)+p[2]*Math.cos(x1)];
    return[p[0]*Math.cos(z1)-p[1]*Math.sin(z1), p[0]*Math.sin(z1)+p[1]*Math.cos(z1), p[2]];
  };
  return{pole,bf2ec:v=>eq2ec(bf2eq(v))};
}
/* ASC & MC at (lat,lonEast) on Mars */
function angles(J,lat,lonE){
  const{pole,bf2ec}=marsFrame(J);
  const f=lat*D2R,l=lonE*D2R;
  const Z=unit(bf2ec([Math.cos(f)*Math.cos(l),Math.cos(f)*Math.sin(l),Math.sin(f)]));
  const E=unit(cross(pole,Z));            // local east
  const k=[0,0,1];
  let mc=unit(cross(E,k));                // meridian ∩ ecliptic
  if(dot(mc,Z)<0)mc=[-mc[0],-mc[1],-mc[2]];
  let asc=unit(cross(Z,k));               // horizon ∩ ecliptic
  if(dot(asc,E)<0)asc=[-asc[0],-asc[1],-asc[2]];
  return{asc:lonOf(asc),mc:lonOf(mc),tilt:Math.acos(dot(pole,k))*R2D};
}
/* schematic moons: mean motion in Mars's equator plane */
function moons(J){
  const d=J-2451545.0,{bf2ec}=marsFrame(J);
  const mk=(L,inc)=>{const t=norm(L)*D2R,i=inc*D2R;
    return lonOf(bf2ec([Math.cos(t),Math.sin(t)*Math.cos(i),Math.sin(t)*Math.sin(i)]));};
  return{'ფობოსი':mk(232.41+1128.8445850*d,1.093),'დეიმოსი':mk(28.96+285.1618970*d,1.791)};
}

const ASP=[{n:'შეერთება',a:[0],o:10,s:'☌',c:'#f9c646'},{n:'ოპოზიცია',a:[180],o:10,s:'☍',c:'#f08050'},
 {n:'ტრინი',a:[120,240],o:8,s:'△',c:'#a078f0'},{n:'კვადრატი',a:[90,270],o:8,s:'□',c:'#e84040'},
 {n:'სექსტილი',a:[60,300],o:6,s:'⚹',c:'#30c890'}];

/* ═══ RENDER ═══ */
const CX=350,CY=350,R1=268,R2=200,R3=132,R4=100;
const NS='http://www.w3.org/2000/svg';
const el=(t,at,p)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e;};
const txt=(p,s,x,y,at={})=>{const t=el('text',{'text-anchor':'middle','dominant-baseline':'central',x,y,...at},p);t.textContent=s;return t;};
const e2s=(ec,asc)=>(-(ec-asc))*D2R+Math.PI;
const fmtD=d=>{const s=((d%30)+30)%30,x=Math.floor(s);return x+'°'+String(Math.floor((s-x)*60)).padStart(2,'0')+"'";};

function drawWheel(P,asc,mc,houses,asps){
  const svg=document.getElementById('wheel');svg.innerHTML='';
  const defs=el('defs',{},svg);
  const g=el('radialGradient',{id:'bg',cx:'50%',cy:'50%',r:'50%'},defs);
  el('stop',{offset:'0%','stop-color':'#2a1008'},g);el('stop',{offset:'100%','stop-color':'#0a0503'},g);
  el('rect',{width:700,height:700,fill:'url(#bg)'},svg);
  for(let i=0;i<12;i++){
    const p=(d,r)=>{const a=e2s(d,asc);return`${CX+Math.cos(a)*r},${CY+Math.sin(a)*r}`;};
    el('path',{d:`M${p(i*30,R1)} A${R1},${R1} 0 0,0 ${p((i+1)*30,R1)} L${p((i+1)*30,R2)} A${R2},${R2} 0 0,1 ${p(i*30,R2)} Z`,
      fill:i%2?'rgba(40,16,8,.85)':'rgba(28,11,5,.85)',stroke:'rgba(194,84,42,.25)','stroke-width':.6},svg);
    const a=e2s(i*30+15,asc);
    txt(svg,ZSYM[i],CX+Math.cos(a)*(R1+R2)/2,CY+Math.sin(a)*(R1+R2)/2,{fill:ZCOL[i],'font-size':19,'font-family':'serif'});
  }
  for(let d=0;d<360;d++){const a=e2s(d,asc),L=d%30===0?16:d%10===0?10:4;
    el('line',{x1:CX+Math.cos(a)*R1,y1:CY+Math.sin(a)*R1,x2:CX+Math.cos(a)*(R1-L),y2:CY+Math.sin(a)*(R1-L),
      stroke:d%30===0?'rgba(255,210,180,.9)':d%10===0?'rgba(240,128,80,.6)':'rgba(140,60,30,.5)',
      'stroke-width':d%30===0?1.6:d%10===0?1:.5},svg);}
  const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  houses.forEach((h,i)=>{
    const a=e2s(h,asc),ang=[0,3,6,9].includes(i);
    el('line',{x1:CX+Math.cos(a)*R4,y1:CY+Math.sin(a)*R4,x2:CX+Math.cos(a)*R2,y2:CY+Math.sin(a)*R2,
      stroke:ang?'rgba(240,168,80,.85)':'rgba(160,70,35,.45)','stroke-width':ang?1.8:.7},svg);
    const m=e2s(h+15,asc);
    txt(svg,ROM[i],CX+Math.cos(m)*(R2+R3)/2,CY+Math.sin(m)*(R2+R3)/2,{fill:'rgba(232,176,122,.55)','font-size':10,'font-family':'Cinzel,serif'});
  });
  el('circle',{cx:CX,cy:CY,r:R2,fill:'none',stroke:'rgba(194,84,42,.6)','stroke-width':1.2},svg);
  el('circle',{cx:CX,cy:CY,r:R1,fill:'none',stroke:'rgba(240,128,80,.75)','stroke-width':1.6},svg);
  el('circle',{cx:CX,cy:CY,r:R4,fill:'rgba(10,5,3,.95)',stroke:'rgba(120,50,25,.6)','stroke-width':1},svg);
  for(const a of asps){
    const a1=e2s(P[a.p1].lon,asc),a2=e2s(P[a.p2].lon,asc);
    el('line',{x1:CX+Math.cos(a1)*R4,y1:CY+Math.sin(a1)*R4,x2:CX+Math.cos(a2)*R4,y2:CY+Math.sin(a2)*R4,
      stroke:a.color,'stroke-width':1,opacity:.5},svg);
  }
  const names=Object.keys(P),disp={};
  names.forEach(n=>disp[n]=e2s(P[n].lon,asc));
  for(let it=0;it<300;it++){let mv=false;
    for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){
      let d=disp[names[j]]-disp[names[i]];
      while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
      if(Math.abs(d)<22/(R1+28)&&Math.abs(d)>1e-4){const p=(22/(R1+28)-Math.abs(d))/2,s=d>0?1:-1;
        disp[names[i]]-=p*s;disp[names[j]]+=p*s;mv=true;}}
    if(!mv)break;}
  for(const n of names){
    const info=PI_[n]||{sym:'?',color:'#fff'},tA=e2s(P[n].lon,asc);
    el('line',{x1:CX+Math.cos(tA)*(R1+1),y1:CY+Math.sin(tA)*(R1+1),x2:CX+Math.cos(tA)*(R1+9),y2:CY+Math.sin(tA)*(R1+9),
      stroke:info.color,'stroke-width':1.4},svg);
    const gx=CX+Math.cos(disp[n])*(R1+28),gy=CY+Math.sin(disp[n])*(R1+28);
    txt(svg,info.sym,gx,gy,{fill:info.color,'font-size':n==='დედამიწა'?20:17,'font-family':'serif'});
    if(P[n].retro)txt(svg,'℞',gx+10,gy-8,{fill:'#f87171','font-size':7,'font-family':'serif'});
  }
  [['AC',asc],['MC',mc]].forEach(([lbl,v])=>{
    const a=e2s(v,asc);
    el('line',{x1:CX+Math.cos(a)*R1,y1:CY+Math.sin(a)*R1,x2:CX+Math.cos(a)*(R1+22),y2:CY+Math.sin(a)*(R1+22),
      stroke:'#f0a850','stroke-width':2.2},svg);
    txt(svg,lbl,CX+Math.cos(a)*(R1+40),CY+Math.sin(a)*(R1+40),{fill:'#f0a850','font-size':11,'font-weight':'bold','font-family':'Cinzel,serif'});
  });
}

function gen(){
  const y=+i_year.value,m=+i_month.value,d=+i_day.value,h=+i_hour.value,mi=+i_min.value;
  const dt=new Date(Date.UTC(y,m-1,d,h,mi,0));
  if(isNaN(dt)){alert('არასწორი თარიღი');return;}
  const J=jd(dt);
  const[lat,lonE]=i_place.value.split(',').map(Number);
  const A=areo(J),A2=areo(J+1),Mo=moons(J),Mo2=moons(J+0.02);
  const{asc,mc,tilt}=angles(J,lat,lonE);
  const P={};
  for(const k in A){let dl=A2[k]-A[k];if(dl>180)dl-=360;if(dl<-180)dl+=360;
    P[k]={lon:A[k],retro:dl<0};}
  for(const k in Mo){let dl=Mo2[k]-Mo[k];if(dl>180)dl-=360;if(dl<-180)dl+=360;
    P[k]={lon:Mo[k],retro:dl<0,approx:true};}
  const houses=[];for(let i=0;i<12;i++)houses.push(norm(asc+i*30));
  const hOf=L=>Math.floor(norm(L-asc)/30)+1;

  const asps=[];const ks=Object.keys(P);
  for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){
    const raw=norm(P[ks[j]].lon-P[ks[i]].lon);let best=null,bo=999;
    for(const a of ASP)for(const t of a.a){let df=Math.abs(raw-t);if(df>180)df=360-df;
      if(df<=a.o&&df<bo){bo=df;best=a;}}
    if(best)asps.push({p1:ks[i],p2:ks[j],type:best.n,sym:best.s,color:best.c,orb:Math.round(bo*100)/100});
  }
  asps.sort((a,b)=>a.orb-b.orb);

  drawWheel(P,asc,mc,houses,asps);
  document.getElementById('out').style.display='block';
  const nm=i_name.value?i_name.value+' — ':'';
  const pl=i_place.options[i_place.selectedIndex].text;
  document.getElementById('lbl').textContent=nm+'მარსული რუქა · '+pl;

  document.getElementById('ptb').innerHTML=ORDER.filter(n=>P[n]||n==='AC'||n==='MC').map(n=>{
    const v=n==='AC'?{lon:asc}:n==='MC'?{lon:mc}:P[n];
    const si=Math.floor(v.lon/30)%12,inf=PI_[n];
    return `<tr><td><span style="color:${inf.color};font-family:serif;font-size:16px">${inf.sym}</span></td>
      <td style="color:${inf.color};font-size:11px">${n}${v.approx?' <span style="opacity:.5">≈</span>':''}</td>
      <td class="deg">${fmtD(v.lon)}</td>
      <td><span style="color:${ZCOL[si]};font-family:serif;font-size:13px">${ZSYM[si]}</span>
        <span style="font-size:10px;color:${ZCOL[si]}">${SIGN_KA[si]}</span></td>
      <td><span class="badge">H${hOf(v.lon)}</span></td>
      <td>${v.retro?'<span class="retro">℞</span>':''}</td></tr>`;}).join('');

  document.getElementById('htb').innerHTML=houses.map((hh,i)=>{
    const si=Math.floor(hh/30)%12,ang={0:'AC',3:'IC',6:'DC',9:'MC'}[i];
    return `<tr><td style="color:${ang?'#f0a850':'rgba(200,160,130,.7)'};font-family:Cinzel,serif;font-size:11px">
      ${['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][i]}${ang?' <span style="font-size:9px;opacity:.7">'+ang+'</span>':''}</td>
      <td><span style="color:${ZCOL[si]};font-family:serif;font-size:13px">${ZSYM[si]}</span>
        <span style="font-size:10px;color:${ZCOL[si]}">${SIGN_KA[si]}</span></td>
      <td class="deg">${fmtD(hh)}</td></tr>`;}).join('');

  document.getElementById('atitle').textContent='⚡ ასპექტები — სულ '+asps.length;
  document.getElementById('atb').innerHTML=asps.map(a=>{
    const i1=PI_[a.p1],i2=PI_[a.p2];
    return `<tr><td><span style="color:${i1.color};font-family:serif">${i1.sym}</span>
      <span style="font-size:10px;color:${i1.color}">${a.p1}</span></td>
      <td><span style="color:${a.color};font-size:15px;font-family:serif">${a.sym}</span></td>
      <td><span style="color:${i2.color};font-family:serif">${i2.sym}</span>
      <span style="font-size:10px;color:${i2.color}">${a.p2}</span></td>
      <td style="color:${a.color};font-size:10px">${a.type}</td>
      <td style="color:rgba(200,160,130,.65);font-size:10px">${a.orb}°</td></tr>`;}).join('');

  // Earth as a wandering star
  const eLon=P['დედამიწა'].lon,sLon=P['მზე'].lon;
  let el2=norm(eLon-sLon);const elong=el2>180?360-el2:el2;
  const side=el2<180?'საღამოს':'დილის';
  const esi=Math.floor(eLon/30)%12;
  document.getElementById('earthbox').innerHTML=`<div class="hl">
    <b style="color:#5b9ec4">⊕ დედამიწა — ${SIGN_KA[esi]} ${fmtD(eLon)}</b> · სახლი ${hOf(eLon)}
    ${P['დედამიწა'].retro?' · <span class="retro">℞ რეტროგრადი</span>':''}<br>
    <span style="color:rgba(200,160,130,.7);font-size:11px">მარსიდან დედამიწა შიდა პლანეტაა — მზისგან მაქსიმუმ 47° შორდება.
    ახლა ელონგაცია <b style="color:#5b9ec4">${elong.toFixed(1)}°</b> — ${side} ვარსკვლავი.
    შენი მთელი ცხოვრება ამ ერთ ცისფერ წერტილშია.</span></div>`;

  // Mars time
  const MSD=(J+69.184/86400-2451549.5)/1.0274912517+44796.0-0.0009626;
  const T=(MSD%1)*24,hh2=Math.floor(T),mm2=Math.floor((T-hh2)*60);
  document.getElementById('mtime').innerHTML=
    `<span style="color:rgba(200,160,130,.55);font-size:11px">MTC:</span>
     <b style="color:#f08050">${String(hh2).padStart(2,'0')}:${String(mm2).padStart(2,'0')}</b>
     &nbsp;·&nbsp; <span style="color:rgba(200,160,130,.55);font-size:11px">MSD:</span>
     <b style="color:#e8b07a">${Math.floor(MSD).toLocaleString('ka-GE')}</b>
     &nbsp;·&nbsp; <span style="color:rgba(200,160,130,.55);font-size:11px">მარსის ეკვატორის დახრა ეკლიპტიკასთან:</span>
     <b style="color:#e0a850">${tilt.toFixed(2)}°</b><br>
     <span style="color:rgba(200,160,130,.55);font-size:11px">ადგილი:</span> ${pl}
     <span style="color:rgba(200,160,130,.5);font-size:10px">(${lat}°, ${lonE}°E)</span>`;
  document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'});
}
function setNow(){const n=new Date();
  i_day.value=n.getUTCDate();i_month.value=n.getUTCMonth()+1;i_year.value=n.getUTCFullYear();
  i_hour.value=n.getUTCHours();i_min.value=n.getUTCMinutes();}
setNow();
</script>
