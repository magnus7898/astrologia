<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ასტეროიდები — Asteroid Placements</title>
<style>
  :root{
    --bg:#07070d; --panel:#0d0d18; --panel2:#11111f;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --txt:#e8e8f0; --mut:#8a8aa0;
    --freq:#7dd3fc; --freq2:#38bdf8;
    --gold:#f0d060; --purple:#a78bfa; --pink:#f472b6;
    --cyan:#22d3ee; --green:#4ade80; --red:#f87171; --orange:#fb923c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; overflow-x:hidden;
    background-image:
      radial-gradient(ellipse at top, rgba(125,211,252,.06), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(167,139,250,.05), transparent 50%);
  }
  .wrap{max-width:1280px; margin:0 auto; padding:28px 20px 60px}
  .back{
    display:inline-flex; align-items:center; gap:8px;
    color:var(--mut); text-decoration:none; font-size:.85rem;
    margin-bottom:24px; transition:color .2s;
  }
  .back:hover{color:var(--freq)}
  .back svg{width:16px; height:16px}
  header{
    display:flex; align-items:center; gap:20px;
    padding:24px 28px; margin-bottom:28px;
    background:linear-gradient(135deg, rgba(125,211,252,.06), rgba(167,139,250,.06));
    border:1px solid var(--line2); border-radius:18px;
    position:relative; overflow:hidden;
  }
  header::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 20% 50%, rgba(125,211,252,.08), transparent 40%);
    pointer-events:none;
  }
  .header-sym{
    width:56px; height:56px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--freq);
  }
  .header-sym svg{width:100%; height:100%}
  h1{
    font-size:1.6rem; font-weight:600; letter-spacing:.5px;
    background:linear-gradient(135deg, var(--freq), var(--purple));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header-sub{color:var(--mut); font-size:.85rem; margin-top:2px}
  .panel{
    background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:22px; margin-bottom:22px;
  }
  .panel-title{
    font-size:.75rem; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--mut); margin-bottom:14px;
  }
  .inputs{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
  }
  .field label{
    display:block; font-size:.7rem; text-transform:uppercase;
    letter-spacing:1px; color:var(--freq); margin-bottom:6px;
  }
  .field input, .field select{
    width:100%; padding:10px 12px;
    background:var(--panel2); border:1px solid var(--line2);
    border-radius:10px; color:var(--txt); font-size:.9rem;
    outline:none; transition:border-color .2s;
  }
  .field input:focus, .field select:focus{border-color:var(--freq)}
  .btn{
    grid-column:1/-1; padding:12px 20px;
    background:linear-gradient(135deg, var(--freq2), var(--purple));
    border:none; border-radius:10px; color:#fff;
    font-weight:600; font-size:.9rem; letter-spacing:.5px;
    cursor:pointer; transition:transform .2s, box-shadow .2s;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 8px 24px rgba(56,189,248,.25)}
  .stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px; margin-bottom:22px;
  }
  .stat{
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:16px; text-align:center;
  }
  .stat-num{
    font-size:1.8rem; font-weight:600;
    font-family:'JetBrains Mono',monospace;
  }
  .stat:nth-child(1) .stat-num{color:var(--freq)}
  .stat:nth-child(2) .stat-num{color:var(--purple)}
  .stat:nth-child(3) .stat-num{color:var(--cyan)}
  .stat:nth-child(4) .stat-num{color:var(--pink)}
  .stat-lbl{font-size:.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--mut); margin-top:4px}
  .tabs{
    display:flex; gap:4px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:4px; margin-bottom:16px;
  }
  .tab{
    padding:8px 14px; background:transparent; border:none;
    border-radius:8px; color:var(--mut); cursor:pointer;
    font-size:.8rem; font-weight:500; transition:all .2s;
  }
  .tab:hover{color:var(--txt); background:rgba(255,255,255,.04)}
  .tab.active{background:rgba(125,211,252,.12); color:var(--freq)}
  .controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
  .search{
    flex:1; min-width:200px; padding:10px 14px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; color:var(--txt); font-size:.85rem; outline:none;
  }
  .search:focus{border-color:var(--freq)}
  .fbtn{
    padding:8px 14px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; color:var(--mut); cursor:pointer;
    font-size:.78rem; transition:all .2s;
  }
  .fbtn:hover,.fbtn.active{background:rgba(125,211,252,.1); color:var(--freq); border-color:var(--freq)}
  .tbl-wrap{
    overflow-x:auto; border-radius:14px;
    border:1px solid var(--line); background:var(--panel);
  }
  table{width:100%; border-collapse:collapse; font-size:.82rem}
  thead{background:rgba(125,211,252,.04); position:sticky; top:0; z-index:5}
  th{
    padding:12px 10px; text-align:left; font-size:.7rem;
    text-transform:uppercase; letter-spacing:.8px;
    color:var(--freq); border-bottom:1px solid var(--line);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  th:hover{color:#fff}
  td{padding:9px 10px; border-bottom:1px solid var(--line)}
  tr:hover td{background:rgba(125,211,252,.02)}
  tr.has-conj td{background:rgba(240,208,96,.03)}
  .aid{font-family:'JetBrains Mono',monospace; color:var(--mut); font-size:.75rem}
  .aname{font-weight:600; color:var(--txt)}
  .zbadge{
    display:inline-flex; align-items:center; gap:4px;
    padding:2px 8px; border-radius:20px; font-size:.78rem; font-weight:500;
  }
  .z-fire{background:rgba(248,113,113,.12); color:#f87171}
  .z-earth{background:rgba(74,222,128,.12); color:#4ade80}
  .z-air{background:rgba(96,165,250,.12); color:#60a5fa}
  .z-water{background:rgba(167,139,250,.12); color:#a78bfa}
  .deg{font-family:'JetBrains Mono',monospace; color:var(--cyan); font-size:.82rem}
  .meaning{color:var(--mut); font-size:.78rem; max-width:180px}
  .cat-tag{
    display:inline-block; padding:2px 7px; border-radius:5px;
    font-size:.65rem; font-weight:600; text-transform:uppercase;
  }
  .c-major{background:rgba(240,208,96,.15); color:var(--gold)}
  .c-love{background:rgba(244,114,182,.15); color:var(--pink)}
  .c-wisdom{background:rgba(167,139,250,.15); color:var(--purple)}
  .c-karma{background:rgba(248,113,113,.15); color:var(--red)}
  .c-healing{background:rgba(74,222,128,.15); color:var(--green)}
  .c-mythic{background:rgba(34,211,238,.15); color:var(--cyan)}
  .c-destiny{background:rgba(251,146,60,.15); color:var(--orange)}
  .pbadge{
    display:inline-flex; align-items:center; gap:3px;
    padding:2px 7px; border-radius:5px; font-size:.75rem;
    background:rgba(167,139,250,.12); color:var(--purple);
  }
  .orb{color:var(--orange); font-size:.72rem; font-weight:600}
  .conj-card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:16px 18px; margin-bottom:10px;
    transition:border-color .2s, transform .2s;
  }
  .conj-card:hover{border-color:var(--gold); transform:translateX(3px)}
  .conj-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px}
  .conj-sym{color:var(--gold); font-size:1.1rem; font-weight:700}
  .conj-ast{color:var(--gold); font-weight:600}
  .conj-pl{color:var(--purple); font-weight:600}
  .conj-desc{color:var(--mut); font-size:.82rem; line-height:1.5}
  .empty{text-align:center; padding:50px 20px; color:var(--mut)}
  .empty-icon{font-size:2.5rem; margin-bottom:10px}
  .tab-content{display:none}
  .tab-content.active{display:block}
  @media(max-width:640px){
    h1{font-size:1.2rem}
    .inputs{grid-template-columns:1fr 1fr}
    table{font-size:.75rem}
    th,td{padding:7px 6px}
  }
</style>
</head>

  {id:3753,n:'Cruithne',c:'karma',m:"Earth's companion, second moon"},
  {id:4341,n:'Poseidon',c:'mythic',m:'Sea god, emotion, depth'},
  {id:174567,n:'Varda',c:'mythic',m:'Elven queen, star light'}
];

let data=[], conjs=[], elFilter='all', sortC=-1, sortA=true, curTab='all';

const BACKEND='https://astrology-production-b165.up.railway.app';
let unavailable=[],chartInfo=null;

function geocodeCity(){
  const c=document.getElementById('bcity');
  if(!c||!c.value.trim())return Promise.resolve(null);
  return fetch(BACKEND+'/geocode',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({city:c.value.trim()})})
    .then(r=>r.json()).then(g=>g && g.lat!=null?g:null).catch(()=>null);
}

async function calc(){
  const d=document.getElementById('bdate').value;
  const t=document.getElementById('btime').value||'12:00';
  if(!d){alert('შეიყვანეთ თარიღი');return}
  const orb=parseFloat(document.getElementById('orb').value)||3;
  const btn=document.getElementById('calcBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ გამოთვლა... (პირველად შეიძლება ~15 წმ)';}
  const [Y,M,D]=d.split('-').map(Number);
  const [hh,mm]=t.split(':').map(Number);

  let lat=41.7151,lon=44.8271,tz='Asia/Tbilisi';
  const g=await geocodeCity();
  if(g){lat=+g.lat;lon=+g.lon;tz=g.tz_name||tz;
    const hint=document.getElementById('cityhint');
    if(hint)hint.textContent='📍 '+(g.display||'');}

  try{
    const res=await fetch(BACKEND+'/api/asteroids',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({year:Y,month:M,day:D,hour:hh,minute:mm,second:0,
        lat:lat,lon:lon,tz_name:tz,orb:orb,ids:AST.map(a=>a.id)})});
    if(!res.ok)throw new Error('სერვერი: '+res.status);
    const j=await res.json();
    const byId={};(j.asteroids||[]).forEach(a=>byId[a.id]=a);
    unavailable=(j.unavailable||[]);
    chartInfo=j;

    data=AST.filter(a=>byId[a.id]).map(a=>{
      const p=byId[a.id];
      return {...a, lon:p.lon, si:p.sign_idx, deg:p.deg_in_sign,
              sign:SIGNS[p.sign_idx], house:p.house, retro:p.retrograde,
              cj:(p.contacts||[]).map(c=>({pn:c.planet,ps:c.sym,orb:c.orb}))};
    });
    conjs=[];
    data.forEach(a=>a.cj.forEach(c=>conjs.push({an:a.n,aid:a.id,...c})));

    document.getElementById('s1').textContent=data.length;
    document.getElementById('s2').textContent=conjs.length;
    document.getElementById('s3').textContent=new Set(data.map(a=>a.si)).size;
    document.getElementById('s4').textContent=new Set(data.map(a=>a.house)).size;
    document.getElementById('results').style.display='block';
    const nHz=(j.asteroids||[]).filter(a=>a.source==='horizons').length;
    const srcBox=document.getElementById('srcNote');
    if(srcBox)srcBox.innerHTML=nHz?('<div style="font-size:11px;color:var(--mut);margin:8px 0">'+
      'პოზიციები: '+((j.asteroids||[]).length-nHz)+' Swiss Ephemeris · '+nHz+' NASA/JPL Horizons</div>'):'';
    renderMissing();
    render();
  }catch(e){
    alert('ვერ მოხერხდა გამოთვლა — '+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='✦ გამოთვლა';}
  }
}

function renderMissing(){
  const box=document.getElementById('missingBox');
  if(!box)return;
  if(!unavailable.length){box.innerHTML='';return;}
  const names={};AST.forEach(a=>names[a.id]=a.n);
  box.innerHTML='<div style="background:rgba(251,146,60,.09);border:1px solid rgba(251,146,60,.35);'+
    'border-radius:10px;padding:12px 14px;margin:14px 0;font-size:12px;line-height:1.8">'+
    '<b style="color:var(--orange)">⚠ '+unavailable.length+' ასტეროიდი ჯერ არ არის ხელმისაწვდომი</b><br>'+
    '<span style="color:var(--mut)">სერვერი ავტომატურად ცდილობს მათი ეფემერიდული ფაილების ჩამოტვირთვას '+
    'პირველივე მოთხოვნისას — სცადეთ ხელახლა გამოთვლა რამდენიმე წამში. თუ ისევ არ ჩნდება, '+
    'ფაილები ხელით უნდა ჩაიდოს astrology რეპოში:</span><br>'+
    '<span style="color:var(--mut);font-size:11px">'+
    unavailable.slice(0,40).map(u=>(names[u.id]||('#'+u.id))+' → '+u.folder+u.file).join('<br>')+
    (unavailable.length>40?'<br>...':'')+'</span></div>';
}

function row(a,full=true){
  const ec='z-'+a.sign.e;
  const cc='c-'+a.c;
  const cj=a.cj.length?a.cj.map(c=>`<span class="pbadge">${c.ps} ${c.pn} <span class="orb">${c.orb}°</span></span>`).join(' '):'<span style="color:var(--mut);font-size:.75rem">—</span>';
  const cols=full?`<td><span class="aid">${a.id}</span></td>
    <td><span class="aname">${a.n}</span></td>
    <td><span class="cat-tag ${cc}">${a.c}</span></td>
    <td><span class="zbadge ${ec}">${a.sign.s} ${a.sign.n}</span></td>
    <td><span class="deg">${Math.floor(a.deg)}°${String(Math.floor((a.deg%1)*60)).padStart(2,'0')}′</span></td>
    <td>${a.house}</td>
    <td style="text-transform:capitalize">${a.sign.e}</td>
    <td><span class="meaning">${a.m}</span></td>
    <td>${cj}</td>`:`<td><span class="aid">${a.id}</span></td>
    <td><span class="aname">${a.n}</span></td>
    <td><span class="zbadge ${ec}">${a.sign.s} ${a.sign.n}</span></td>
    <td><span class="deg">${Math.floor(a.deg)}°${String(Math.floor((a.deg%1)*60)).padStart(2,'0')}′</span></td>
    <td>${a.house}</td>
    <td><span class="meaning">${a.m}</span></td>
    <td>${cj}</td>`;
  return `<tr class="${a.cj.length?'has-conj':''}">${cols}</tr>`;
}

function head(full=true){
  return full?`<thead><tr>
    <th onclick="sort(0)">#</th><th onclick="sort(1)">ასტეროიდი</th><th onclick="sort(2)">კატეგორია</th>
    <th onclick="sort(3)">ნიშანი</th><th onclick="sort(4)">გრადუსი</th><th onclick="sort(5)">სახლი</th>
    <th onclick="sort(6)">სტიქია</th><th>მნიშვნელობა</th><th>შეერთებები</th>
  </tr></thead>`:`<thead><tr>
    <th onclick="sort(0)">#</th><th>ასტეროიდი</th><th>ნიშანი</th>
    <th>გრადუსი</th><th>სახლი</th><th>მნიშვნელობა</th><th>შეერთებები</th>
  </tr></thead>`;
}

function render(){
  const q=document.getElementById('srch').value.toLowerCase();
  let f=data;
  if(elFilter!=='all')f=f.filter(a=>a.sign.e===elFilter);
  if(q)f=f.filter(a=>a.n.toLowerCase().includes(q)||a.sign.n.toLowerCase().includes(q)||a.m.toLowerCase().includes(q)||a.c.includes(q));
  if(sortC>=0){
    f=[...f].sort((a,b)=>{
      let va,vb;
      switch(sortC){
        case 0:va=a.id;vb=b.id;break;
        case 1:va=a.n;vb=b.n;break;
        case 2:va=a.c;vb=b.c;break;
        case 3:va=a.si;vb=b.si;break;
        case 4:va=a.lon;vb=b.lon;break;
        case 5:va=a.house;vb=b.house;break;
        case 6:va=a.sign.e;vb=b.sign.e;break;
        default:va=a.id;vb=b.id;
      }
      if(typeof va==='string')return sortA?va.localeCompare(vb):vb.localeCompare(va);
      return sortA?va-vb:vb-va;
    });
  }
  document.getElementById('tAll').innerHTML=head(true)+'<tbody>'+f.map(a=>row(a,true)).join('')+'</tbody>';
  document.getElementById('tMajor').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='major').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tLove').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='love').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tWisdom').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='wisdom').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tKarma').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='karma').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tHealing').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='healing').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tMyth').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='mythic'||a.c==='destiny').map(a=>row(a,false)).join('')+'</tbody>';

  const box=document.getElementById('conjBox');
  if(!conjs.length){box.innerHTML='<div class="empty"><div class="empty-icon">🔭</div>შეერთებები ვერ მოიძებნა. გაზარდეთ ორბი.</div>';return}
  const pd={Sun:'Core identity',Moon:'Emotions',Mercury:'Communication',Venus:'Love, values',Mars:'Action, drive',Jupiter:'Expansion, luck',Saturn:'Structure, karma',Uranus:'Innovation',Neptune:'Dreams, spirituality',Pluto:'Transformation','N.Node':'Destiny',Chiron:'Wounded healer'};
  box.innerHTML=conjs.map(c=>`<div class="conj-card">
    <div class="conj-head">
      <span class="conj-sym">☌</span>
      <span class="conj-ast">${c.an} (#${c.aid})</span>
      <span style="color:var(--mut)">× </span>
      <span class="conj-pl">${c.ps} ${c.pn}</span>
      <span class="orb">[${c.orb}°]</span>
    </div>
    <div class="conj-desc"><b>${c.an}</b> merges with <b>${c.pn}</b> energy (${pd[c.pn]||''}). This conjunction amplifies both energies in the natal chart.</div>
  </div>`).join('');
}

function sort(c){if(sortC===c)sortA=!sortA;else{sortC=c;sortA=true}render()}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  curTab=t.dataset.t;
  document.querySelector(`[data-tc="${curTab}"]`).classList.add('active');
});
document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  elFilter=b.dataset.el;
  render();
});

window.addEventListener('load',calc);
</script>
</body>
</html>
