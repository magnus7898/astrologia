  .c-major{background:rgba(232,213,160,.14);color:var(--gold)}
  .c-love{background:rgba(240,140,184,.14);color:var(--pink)}

</style>
</head>

  {id:107,n:'Camilla',c:'mythic',m:'Warrior maiden, swift runner'},
  {id:164,n:'Eva',c:'mythic',m:'Life, first woman, origin'},
  {id:174,n:'Phaedra',c:'mythic',m:'Forbidden love, tragic passion'},
  {id:175,n:'Undine',c:'mythic',m:'Water spirit, emotional depths'},
  {id:196,n:'Philomela',c:'mythic',m:'Nightingale, pain into song'},
  {id:259,n:'Aletheia',c:'wisdom',m:'Truth, disclosure, reality'},
  {id:451,n:'Patientia',c:'healing',m:'Patience, endurance'},
  {id:491,n:'Myrrha',c:'mythic',m:'Transformation, sacred resin'},
  {id:532,n:'Herculina',c:'mythic',m:'Hercules strength, might'},
  {id:664,n:'Judith',c:'mythic',m:'Praised, heroic woman'},
  {id:1009,n:'Sirene',c:'mythic',m:'Enchanting voice, allure'},
  {id:4179,n:'Toutatis',c:'mythic',m:'Chaos, unpredictable'},
  {id:2000,n:'Herschel',c:'wisdom',m:'Discovery, innovation'},
  {id:3174,n:'Alcock',c:'wisdom',m:'Astronomer, sky watcher'},
  {id:3753,n:'Cruithne',c:'karma',m:"Earth's companion, second moon"},
  {id:4341,n:'Poseidon',c:'mythic',m:'Sea god, emotion, depth'},
  {id:174567,n:'Varda',c:'mythic',m:'Elven queen, star light'}
];

let data=[], conjs=[], elFilter='all', sortC=-1, sortA=true, curTab='all';

const BACKEND='https://astrology-production-b165.up.railway.app';
let unavailable=[],chartInfo=null;

function geocodeCity(){
  const c=document.getElementById('bcity');
  if(!c||!c.value.trim())return Promise.resolve(null);
  return fetch(BACKEND+'/geocode',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({city:c.value.trim()})})
    .then(r=>r.json()).then(g=>g && g.lat!=null?g:null).catch(()=>null);
}

async function calc(){
  const d=document.getElementById('bdate').value;
  const t=document.getElementById('btime').value||'12:00';
  if(!d){alert('შეიყვანეთ თარიღი');return}
  const orb=parseFloat(document.getElementById('orb').value)||3;
  const btn=document.getElementById('calcBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ გამოთვლა...';}
  const [Y,M,D]=d.split('-').map(Number);
  const [hh,mm]=t.split(':').map(Number);

  let lat=41.7151,lon=44.8271,tz='Asia/Tbilisi';
  const g=await geocodeCity();
  if(g){lat=+g.lat;lon=+g.lon;tz=g.tz_name||tz;
    const hint=document.getElementById('cityhint');
    if(hint)hint.textContent='📍 '+(g.display||'');}

  try{
    const res=await fetch(BACKEND+'/api/asteroids',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({year:Y,month:M,day:D,hour:hh,minute:mm,second:0,
        lat:lat,lon:lon,tz_name:tz,orb:orb,ids:AST.map(a=>a.id)})});
    if(!res.ok)throw new Error('სერვერი: '+res.status);
    const j=await res.json();
    const byId={};(j.asteroids||[]).forEach(a=>byId[a.id]=a);
    unavailable=(j.unavailable||[]);
    chartInfo=j;

    data=AST.filter(a=>byId[a.id]).map(a=>{
      const p=byId[a.id];
      return {...a, lon:p.lon, si:p.sign_idx, deg:p.deg_in_sign,
              sign:SIGNS[p.sign_idx], house:p.house, retro:p.retrograde,
              cj:(p.contacts||[]).map(c=>({pn:c.planet,ps:c.sym,orb:c.orb}))};
    });
    conjs=[];
    data.forEach(a=>a.cj.forEach(c=>conjs.push({an:a.n,aid:a.id,...c})));

    document.getElementById('s1').textContent=data.length;
    document.getElementById('s2').textContent=conjs.length;
    document.getElementById('s3').textContent=new Set(data.map(a=>a.si)).size;
    document.getElementById('s4').textContent=new Set(data.map(a=>a.house)).size;
    document.getElementById('results').style.display='block';
    const all=j.asteroids||[];
    const nSw=all.filter(a=>a.source==='swisseph').length,nNb=all.filter(a=>a.source==='nbody').length;
    const srcBox=document.getElementById('srcNote');
    if(srcBox)srcBox.innerHTML='<div style="font-size:11px;color:var(--mut);margin:8px 0;line-height:1.7">'+
      'პოზიციები: '+nSw+' Swiss Ephemeris · '+nNb+' რიცხვითი ინტეგრაცია (JPL საწყისი ვექტორი, სიზუსტე &lt;1′)'+
      (unavailable.length?'<br><span style="color:var(--orange)">ჯერ მიუწვდომელია: '+
        unavailable.map(u=>{const a=AST.find(x=>x.id===u.id);return a?a.n:('#'+u.id);}).join(', ')+
        ' — სერვერი მონაცემებს ამზადებს, სცადეთ ერთ წუთში.</span>':'')+'</div>';
    render();
  }catch(e){
    alert('ვერ მოხერხდა გამოთვლა — '+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='✦ გამოთვლა';}
  }
}


function row(a,full=true){
  const ec='z-'+a.sign.e;
  const cc='c-'+a.c;
  const cj=a.cj.length?a.cj.map(c=>`<span class="pbadge">${c.ps} ${c.pn} <span class="orb">${c.orb}°</span></span>`).join(' '):'<span style="color:var(--mut);font-size:.75rem">—</span>';
  const cols=full?`<td><span class="aid">${a.id}</span></td>
    <td><span class="aname">${a.n}</span></td>
    <td><span class="cat-tag ${cc}">${CAT_KA[a.c]||a.c}</span></td>
    <td><span class="zbadge ${ec}">${a.sign.s}\uFE0E ${SIGN_KA[a.si]}</span></td>
    <td><span class="deg">${Math.floor(a.deg)}°${String(Math.floor((a.deg%1)*60)).padStart(2,'0')}′</span>${a.retro?' <span style="color:var(--red);font-size:.7rem">℞</span>':''}</td>
    <td>${a.house}</td>
    <td>${EL_KA[a.sign.e]}</td>
    <td><span class="meaning">${a.m}</span></td>
    <td>${cj}</td>`:`<td><span class="aid">${a.id}</span></td>
    <td><span class="aname">${a.n}</span></td>
    <td><span class="zbadge ${ec}">${a.sign.s}\uFE0E ${SIGN_KA[a.si]}</span></td>
    <td><span class="deg">${Math.floor(a.deg)}°${String(Math.floor((a.deg%1)*60)).padStart(2,'0')}′</span>${a.retro?' <span style="color:var(--red);font-size:.7rem">℞</span>':''}</td>
    <td>${a.house}</td>
    <td><span class="meaning">${a.m}</span></td>
    <td>${cj}</td>`;
  return `<tr class="${a.cj.length?'has-conj':''}">${cols}</tr>`;
}

function head(full=true){
  return full?`<thead><tr>
    <th onclick="sort(0)">#</th><th onclick="sort(1)">ასტეროიდი</th><th onclick="sort(2)">კატეგორია</th>
    <th onclick="sort(3)">ნიშანი</th><th onclick="sort(4)">გრადუსი</th><th onclick="sort(5)">სახლი</th>
    <th onclick="sort(6)">სტიქია</th><th>მნიშვნელობა</th><th>შეერთებები</th>
  </tr></thead>`:`<thead><tr>
    <th onclick="sort(0)">#</th><th>ასტეროიდი</th><th>ნიშანი</th>
    <th>გრადუსი</th><th>სახლი</th><th>მნიშვნელობა</th><th>შეერთებები</th>
  </tr></thead>`;
}

function render(){
  const q=document.getElementById('srch').value.toLowerCase();
  let f=data;
  if(elFilter!=='all')f=f.filter(a=>a.sign.e===elFilter);
  if(q)f=f.filter(a=>a.n.toLowerCase().includes(q)||(a.sign.n.toLowerCase().includes(q)||SIGN_KA[a.si].includes(q))||a.m.toLowerCase().includes(q)||a.c.includes(q));
  if(sortC>=0){
    f=[...f].sort((a,b)=>{
      let va,vb;
      switch(sortC){
        case 0:va=a.id;vb=b.id;break;
        case 1:va=a.n;vb=b.n;break;
        case 2:va=a.c;vb=b.c;break;
        case 3:va=a.si;vb=b.si;break;
        case 4:va=a.lon;vb=b.lon;break;
        case 5:va=a.house;vb=b.house;break;
        case 6:va=a.sign.e;vb=b.sign.e;break;
        default:va=a.id;vb=b.id;
      }
      if(typeof va==='string')return sortA?va.localeCompare(vb):vb.localeCompare(va);
      return sortA?va-vb:vb-va;
    });
  }
  document.getElementById('tAll').innerHTML=head(true)+'<tbody>'+f.map(a=>row(a,true)).join('')+'</tbody>';
  document.getElementById('tMajor').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='major').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tLove').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='love').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tWisdom').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='wisdom').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tKarma').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='karma').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tHealing').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='healing').map(a=>row(a,false)).join('')+'</tbody>';
  document.getElementById('tMyth').innerHTML=head(false)+'<tbody>'+data.filter(a=>a.c==='mythic'||a.c==='destiny').map(a=>row(a,false)).join('')+'</tbody>';

  const box=document.getElementById('conjBox');
  if(!conjs.length){box.innerHTML='<div class="empty"><div class="empty-icon">🔭</div>შეერთებები ვერ მოიძებნა. გაზარდეთ ორბი.</div>';return}
  const pd={Sun:'Core identity',Moon:'Emotions',Mercury:'Communication',Venus:'Love, values',Mars:'Action, drive',Jupiter:'Expansion, luck',Saturn:'Structure, karma',Uranus:'Innovation',Neptune:'Dreams, spirituality',Pluto:'Transformation','N.Node':'Destiny',Chiron:'Wounded healer'};
  box.innerHTML=conjs.map(c=>`<div class="conj-card">
    <div class="conj-head">
      <span class="conj-sym">☌</span>
      <span class="conj-ast">${c.an} (#${c.aid})</span>
      <span style="color:var(--mut)">× </span>
      <span class="conj-pl">${c.ps} ${c.pn}</span>
      <span class="orb">[${c.orb}°]</span>
    </div>
    <div class="conj-desc"><b>${c.an}</b> merges with <b>${c.pn}</b> energy (${pd[c.pn]||''}). This conjunction amplifies both energies in the natal chart.</div>
  </div>`).join('');
}

function sort(c){if(sortC===c)sortA=!sortA;else{sortC=c;sortA=true}render()}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  curTab=t.dataset.t;
  document.querySelector(`[data-tc="${curTab}"]`).classList.add('active');
});
document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  elFilter=b.dataset.el;
  render();
});

window.addEventListener('load',calc);
</script>
</body>
