<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ქიმიის ლაბორატორია · MAGNUS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400;600&family=Noto+Serif+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games.css">
<style>
:root{--glow:rgba(224,160,48,.12);--c-alkali:#e0605a;--c-alkaline:#e8975a;--c-transition:#c9a84c;--c-post:#7fb0a0;--c-metalloid:#5fb8c8;--c-nonmetal:#6fcf8a;--c-halogen:#b7d85c;--c-noble:#9a84e0;--c-lanthanide:#e07ab0;--c-actinide:#c06ad0;--c-unknown:#6d6253}
.page{max-width:1100px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.panel h3{font-family:'Cinzel',serif;font-weight:400;font-size:12px;letter-spacing:2.5px;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.hint{font-size:11.5px;color:var(--ink-dim);line-height:1.6}
/* periodic table */
#pt{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:2px;user-select:none;-webkit-user-select:none}
.el{position:relative;aspect-ratio:1/1.12;border-radius:4px;border:1px solid rgba(255,255,255,.08);background:color-mix(in srgb,var(--cc) 22%,#0e0b1a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;overflow:hidden;transition:transform .08s}
.el:hover{transform:scale(1.12);z-index:3;border-color:var(--cc)}
.el .z{position:absolute;top:1px;left:3px;font-size:clamp(5px,.75vw,9px);color:rgba(255,255,255,.55)}
.el .s{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(8px,1.45vw,17px);color:#fff;line-height:1}
.el .n{font-size:clamp(4px,.62vw,8px);color:rgba(255,255,255,.65);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 1px}
.el.dim{opacity:.25}.el.sel{outline:2px solid #fff;outline-offset:1px}
.gap{grid-column:span 1}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11px;color:var(--ink-mid)}
.legend span{display:inline-flex;align-items:center;gap:4px;cursor:pointer}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend span.off{opacity:.35}
.ghost{position:fixed;pointer-events:none;z-index:99;width:54px;height:60px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:600;font-size:22px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.6);transform:translate(-50%,-60%)}
/* reactor */
.reactor{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px 8px}
.slot{width:104px;height:116px;border:2px dashed var(--border-h);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink-dim);font-size:11.5px;text-align:center;transition:all .15s;background:rgba(255,255,255,.02)}
.slot.over{border-color:var(--gold-lt);background:rgba(201,168,76,.12);transform:scale(1.05)}
.slot.full{border-style:solid;background:color-mix(in srgb,var(--cc) 25%,#0e0b1a);border-color:var(--cc);color:#fff;cursor:pointer}
.slot .S{font-family:'Cinzel',serif;font-size:34px;font-weight:600;line-height:1}.slot .Z{font-size:10px;opacity:.7}.slot .N{font-size:12px}
.plus{font-family:'Cinzel',serif;font-size:28px;color:var(--gold)}
.rbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rbtns button{background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:14px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.rbtns button:hover{border-color:var(--border-h);color:var(--gold-lt)}
#out{display:none}
/* encyclopedia (chem_adv.js) */
.atop{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px}
.atop button{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:8px;text-align:left;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit}
.atop button i{grid-row:1/3;font-style:normal;font-size:22px;display:flex;align-items:center;justify-content:center;color:var(--gold)}.atop button b{font-size:13px;font-weight:600}.atop button small{font-size:10.5px;color:var(--ink-dim);line-height:1.3}
.atop button:hover{border-color:var(--border-h)}.atop button.on{background:rgba(201,168,76,.13);border-color:var(--gold)}
.ahead{font-family:'Cinzel',serif;color:var(--gold-lt);font-size:18px;margin:4px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px}.ahead span{color:var(--gold)}
.arow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}@media(max-width:860px){.arow{grid-template-columns:1fr}}.acol{min-width:0}
canvas.acv{display:block;background:radial-gradient(ellipse at 50% 40%,#151026,#0b0816);border:1px solid var(--border);border-radius:10px;margin:0 auto 6px}
.actl{display:flex;flex-direction:column;gap:7px;margin:6px 0;font-size:13px;color:var(--ink-mid)}.actl>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.asl{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink-mid)}.asl b{color:var(--gold-lt)}.asl input{width:100%;accent-color:var(--gold)}
.abt{display:flex;flex-wrap:wrap;gap:4px}.abt button{background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:12px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.abt button:hover{border-color:var(--border-h);color:var(--gold-lt)}.abt button.on{background:rgba(201,168,76,.16);border-color:var(--gold);color:var(--gold-lt)}
.actl select,.calc select,.calc input{background:#141022;color:var(--ink);border:1px solid var(--border-h);border-radius:7px;padding:4px 7px;font:inherit;font-size:13px}
.ainfo{font-size:13px;line-height:1.6;margin:6px 0;color:var(--ink)}.ainfo .big{font-family:'Cinzel',serif;font-size:24px;color:var(--gold-lt)}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}.kv2 b{color:var(--ink-dim);font-weight:400}
.acard{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:rgba(0,0,0,.15);margin-top:10px}.acard h4{font-family:'Cinzel',serif;color:var(--gold-lt);font-size:13.5px;margin:0 0 8px;font-weight:600}
.afx{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.af{border-left:2px solid var(--gold);padding:4px 10px;background:rgba(201,168,76,.05);border-radius:0 6px 6px 0}
.ff{font-family:'Times New Roman',serif;font-size:15.5px;color:#f3e7c6;letter-spacing:.2px}.fd{font-size:11.5px;color:var(--ink-mid);margin-top:2px}
.calc{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--ink-mid)}.calc label{display:flex;flex-direction:column;gap:2px}.calc input{width:110px}
.eqn{font-family:'Cinzel',serif;color:var(--gold-lt);font-size:15px;margin:4px 0 8px}
.emf>div{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:6px;font-size:12px;margin:2px 0}.emf .bw{position:relative;display:block;height:8px;background:linear-gradient(90deg,transparent calc(50% - .5px),rgba(255,255,255,.25) calc(50% - .5px),rgba(255,255,255,.25) calc(50% + .5px),transparent calc(50% + .5px))}.emf .bw i{position:absolute;top:0;height:8px;border-radius:3px}.emf>div b{text-align:right;color:var(--gold-lt);font-weight:400}
.hf{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12.5px}.hf b{color:var(--gold-lt);font-weight:400;text-align:right}
.chain2{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px}.chain2 span{display:flex;flex-direction:column;align-items:center;border:1px solid var(--border);border-radius:7px;padding:3px 7px}.chain2 span b{color:var(--gold-lt);font-family:'Cinzel',serif}.chain2 small{font-size:9.5px;color:var(--ink-dim)}.chain2 i{font-style:normal;color:#e8a050;font-size:11px}

.el.heat{background:color-mix(in srgb,var(--cc) 78%,#0e0b1a);border-color:rgba(255,255,255,.15)}.el.heat .n{color:#fff;font-weight:600}
.pview{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--ink-mid)}
.pview select,.tl-row select{background:#141022;color:var(--ink);border:1px solid var(--border-h);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px}
#pleg{margin-top:8px}.pscale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-mid)}.pscale i{flex:1;height:10px;border-radius:5px;max-width:420px}
.ptop{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--ink-dim);margin-top:4px}.ptop button,.pbtn button,.ex button,.ttabs button{background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:12px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.ptop button b{color:var(--gold-lt);font-family:'Cinzel',serif}.ptop button:hover,.pbtn button:hover,.ex button:hover,.ttabs button:hover{border-color:var(--border-h);color:var(--gold-lt)}
.pctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;margin-bottom:4px}.pctl input[type=range]{width:260px;max-width:70vw;accent-color:var(--gold)}.pctl i{color:var(--ink-dim);font-style:normal}.pbtn{display:flex;flex-wrap:wrap;gap:4px}
i.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 6px;vertical-align:-1px}
.ttabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.ttabs button{font-size:13px;padding:5px 12px}.ttabs button.on{background:rgba(201,168,76,.16);border-color:var(--gold);color:var(--gold-lt)}
.tl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px;font-size:13px;color:var(--ink-mid)}
.tin{flex:1;min-width:220px;background:#141022;color:var(--ink);border:1px solid var(--border-h);border-radius:8px;padding:8px 10px;font-family:'Cinzel',serif;font-size:15px}
.tgo{background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold-lt);border-radius:16px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.ex{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.ex button{font-family:'Cinzel',serif}
.eq.big{font-family:'Cinzel',serif;font-size:18px;color:var(--gold-lt);margin:8px 0;word-break:break-word}
.terr{color:#f08a6a;font-size:13px;padding:8px 10px;border:1px solid rgba(240,138,106,.4);border-radius:8px;margin:6px 0}
table.stq{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}@media(max-width:600px){table.stq{display:block;overflow-x:auto}.stq input{width:80px}}.stq th{color:var(--ink-dim);font-weight:400;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border)}
.stq td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.05)}.stq tr.sep td{border-top:1px solid var(--border-h)}.stq tr.lim td{background:rgba(240,138,106,.1)}
.stq input{width:110px;background:#141022;color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font:inherit}
.bar{display:inline-block;width:90px;height:7px;background:rgba(255,255,255,.07);border-radius:4px;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%}
.oxv{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;margin:10px 0}.oxa{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--cc) 25%,#0e0b1a);border:1px solid var(--cc)}
.oxa small{color:var(--gold-lt);font-size:13px;font-weight:600}.oxa b{font-family:'Cinzel',serif;font-size:22px;color:#fff}.oxa i{position:absolute;right:3px;bottom:2px;font-size:10px;font-style:normal;color:var(--ink-mid)}.oxq{font-size:18px;color:var(--gold);align-self:flex-start}
.solw{overflow-x:auto}table.sol{border-collapse:collapse;font-size:11.5px}.sol th{padding:3px 5px;color:var(--ink-mid);font-weight:400;white-space:nowrap}.sol td{width:26px;height:24px;text-align:center;color:#fff;cursor:pointer;border:1px solid #0e0b1a}.sol td:hover{outline:2px solid var(--gold)}
.act{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-family:'Cinzel',serif}.act i{color:var(--ink-dim);font-style:normal}
.ac{padding:3px 6px;border-radius:6px;font-size:13px;cursor:pointer;color:#fff}.ac.w{background:#8a3a4a}.ac.h{background:#a8662a}.ac.a{background:#5a6a2a}.ac.H{background:#3a5a8a}.ac.n{background:#3a3550;color:var(--gold-lt)}
#info{position:fixed;inset:0;z-index:80;background:rgba(5,3,12,.72);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
#info.on{display:flex}
.info-in{position:relative;width:min(1000px,100%);background:#120e20;border:1px solid var(--border-h);border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.info-in .x{position:absolute;top:10px;right:10px;background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer}
.ihd{display:flex;gap:14px;align-items:center;padding-right:36px}
.ihd .big{width:86px;height:96px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:38px;font-weight:600;color:#fff;background:color-mix(in srgb,var(--cc) 35%,#0e0b1a);border:2px solid var(--cc);line-height:1.05}
.ihd .big small{font-size:11px;font-family:inherit;font-weight:400;opacity:.8}
.inm{font-size:22px;color:var(--gold-lt)}
.ibtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}.ibtn button{background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold-lt);border-radius:16px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.ibtn a{color:var(--ink-mid);font-size:12px}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}@media(max-width:900px){.igrid{grid-template-columns:1fr}}
.igrid h4{font-family:'Cinzel',serif;color:var(--gold-lt);font-size:14px;margin:0;font-weight:600}
.igrid .kv i{color:var(--ink-dim);font-style:normal;font-size:11px}
.iph{margin:10px 0 0}.iph img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;display:block}.iph figcaption{font-size:9.5px;color:var(--ink-dim);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.chips button{background:none;border:1px solid var(--border);color:var(--gold-lt);border-radius:12px;padding:3px 10px;font-family:'Cinzel',serif;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--gold)}
.orb{animation:spin linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.reactor.many{gap:6px}.reactor.many .slot{width:74px;height:86px}.reactor.many .slot .S{font-size:25px}.reactor.many .plus{font-size:18px}
.slot.add{border-style:dotted;color:var(--gold);font-size:24px;cursor:pointer;width:64px}.slot.add small{font-size:10px;color:var(--ink-dim)}.reactor.many .slot.add{width:52px}
.minis{display:flex;flex-wrap:wrap;gap:6px}.mini{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:6px 8px;border-radius:8px;border:1px solid var(--cc);background:color-mix(in srgb,var(--cc) 18%,#0e0b1a)}
.mini b{font-family:'Cinzel',serif;font-size:22px;color:#fff}.mini span{font-size:12px}.mini small{font-size:10px;color:var(--ink-dim)}
.sec{margin-top:16px}.sec h4{font-family:'Cinzel',serif;color:var(--gold-lt);font-size:14px;margin:0 0 6px;font-weight:600}
.prow{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--border);font-size:13px}.prow>span{flex:1}
.prow b{min-width:64px;color:var(--ink)}.prow button{background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:12px;padding:2px 10px;font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}
.prow button:hover{border-color:var(--border-h);color:var(--gold-lt)}
details.more{margin-top:8px}details.more summary{cursor:pointer;color:var(--gold);font-size:13px;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}

.card2 .hd{display:flex;align-items:center;gap:10px}
.card2 .big{font-family:'Cinzel',serif;font-size:30px;font-weight:600;width:52px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;background:color-mix(in srgb,var(--cc) 35%,#0e0b1a);border:1px solid var(--cc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-top:8px}.kv b{color:var(--ink-dim);font-weight:400}
.cf{font-family:'Cinzel',serif;letter-spacing:.5px}

.bond b{color:var(--gold-lt)}

.cmp .nm{font-size:14px;color:var(--ink);margin-left:8px}

.tag.t{color:var(--ink-mid);border-color:var(--border)}

.anim{display:flex;justify-content:center}

<body>
<div class="page">
<header>
  <a class="back" href="games.html">← თამაშები</a>
  <div class="cellno">3</div>
  <h1>ქიმიის ლაბორატორია</h1>
  <div class="sub">მენდელეევის ცხრილი · რეაქციები · მოლეკულები · ჯაჭვები</div>
</header>

<div class="panel">
  <div class="pview" id="pview"></div>
  <div id="pt" aria-label="ელემენტების პერიოდული ცხრილი"></div>
  <div class="legend" id="legend"></div>
  <div id="pleg"></div>
  <div class="hint" style="margin-top:6px">შეეხე ელემენტს — ყველა მახასიათებელი გაიხსნება. გადაათრიე ქვემოთ რეაქტორში — 2-დან 8 ელემენტამდე; „＋“ უჯრა ახალ ადგილს ამატებს. კატეგორიაზე დაჭერა ცხრილში მას გამოყოფს.</div>
</div>

<div class="panel">

/* ═══════════ formulas with brackets and hydrates: 'Ca(OH)2', 'CuSO4·5H2O', 'K4[Fe(CN)6]' → {Ca:1,O:2,H:2} ═══════════ */
function elemCounts(f){
  const tot={};
  for(let part of String(f).replace(/\[/g,'(').replace(/\]/g,')').split(/[·*]/)){
    let mult=1;const mm=part.match(/^(\d+)(.*)$/);if(mm){mult=+mm[1];part=mm[2];}
    const st=[{}];let i=0;
    while(i<part.length){const c=part[i];
      if(c==='('){st.push({});i++;continue;}
      if(c===')'){i++;let n='';while(/\d/.test(part[i]||''))n+=part[i++];const g=st.pop(),top=st[st.length-1];for(const k in g)top[k]=(top[k]||0)+g[k]*(n?+n:1);continue;}
      const m=part.slice(i).match(/^([A-Z][a-z]?)(\d*)/);if(!m){i++;continue;}
      const top=st[st.length-1];top[m[1]]=(top[m[1]]||0)+(m[2]?+m[2]:1);i+=m[0].length;}
    for(const k in st[0])tot[k]=(tot[k]||0)+st[0][k]*mult;}
  return tot;
}

    if(c==='.'){prev=null;i++;continue;}
    if(c==='-'){bo=1;i++;continue;}if(c==='='){bo=2;i++;continue;}if(c==='#'){bo=3;i++;continue;}
    if(/\d/.test(c)||c==='%'){let n;if(c==='%'){n=s.substr(i+1,2);i+=3;}else{n=c;i++;}

    if(c==='['){const j=s.indexOf(']',i),t=s.slice(i+1,j);i=j+1;

      let q=0;if(m[5]){q=/\d/.test(m[5])?(m[5][0]==='-'?-1:1)*+m[5].slice(1):(m[5][0]==='-'?-1:1)*m[5].length;}

const FR=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(Math.abs(n),Math.abs(d))||1;return [n/g,d/g];};

function balanceEq(str){
  const sides=str.split(/\s*(?:=|→|->|⇌|⟶)\s*/);if(sides.length!==2)throw 'მხარეები გაყავი „=“ ან „→“ ნიშნით.';

  const sp=[...L,...Rt],cn=sp.map(f=>elemCounts(f));
  for(let i=0;i<sp.length;i++){const ks=Object.keys(cn[i]);if(!ks.length)throw `„${sp[i]}“ — ფორმულა ვერ წავიკითხე.`;const bad=ks.filter(k=>!BY[k]);if(bad.length)throw `უცნობი ელემენტი: ${bad.join(', ')} (${sp[i]}). დიდი/პატარა ასოები: Co ≠ CO.`;}
  const els=[...new Set(cn.flatMap(c=>Object.keys(c)))];
  for(const e of els){const l=cn.slice(0,L.length).some(c=>c[e]),r=cn.slice(L.length).some(c=>c[e]);if(!l||!r)throw `${e} მხოლოდ ${l?'მარცხენა':'მარჯვენა'} მხარესაა — განტოლება ვერ გათანაბრდება.`;}
  const n=sp.length,A=els.map(e=>sp.map((_,j)=>FR((cn[j][e]||0)*(j<L.length?1:-1))));
  const piv=[];let r=0;
  for(let c=0;c<n&&r<A.length;c++){let k=r;while(k<A.length&&A[k][c][0]===0)k++;if(k===A.length)continue;[A[r],A[k]]=[A[k],A[r]];
    const p=A[r][c];A[r]=A[r].map(x=>fdiv(x,p));
    for(let i=0;i<A.length;i++)if(i!==r&&A[i][c][0]!==0){const f=A[i][c];A[i]=A[i].map((x,j)=>fsub(x,fmul(f,A[r][j])));}
    piv.push(c);r++;}
  const free=[...Array(n).keys()].filter(c=>!piv.includes(c));
  if(free.length===0)throw 'ასეთი რეაქცია ატომების შენახვის კანონით შეუძლებელია.';
  if(free.length>1)throw 'განტოლება ცალსახად არ თანაბრდება — ეს რამდენიმე დამოუკიდებელი რეაქციაა. დაამატე ან ამოიღე ნივთიერება.';
  const fc=free[0],x=Array(n).fill(null);x[fc]=FR(1);piv.forEach((c,i)=>x[c]=FR(-A[i][fc][0],A[i][fc][1]));

  <div class="solw"><table class="sol"><tr><th></th>${SCAT.map(([,l])=>`<th>${l}</th>`).join('')}</tr>
  ${SAN.map(([a,al])=>`<tr><th>${al}</th>${SCAT.map(([c])=>{const v=sol2(c,a),C=SOLC[v]||['?','#333'];return `<td style="background:${C[1]}" data-c="${c}" data-a="${a}">${C[0]}</td>`;}).join('')}</tr>`).join('')}</table></div><div id="solOut" class="hint" style="margin-top:6px"></div>`;}
const QCAT={H:1,NH4:1,Li:1,Na:1,K:1,Mg:2,Ca:2,Sr:2,Ba:2,Al:3,Cr:3,Mn:2,Fe2:2,Fe3:3,Co:2,Ni:2,Cu:2,Zn:2,Ag:1,Hg:2,Sn:2,Pb:2},QAN={OH:1,F:1,Cl:1,Br:1,I:1,S:2,SO3:2,SO4:2,NO3:1,PO4:3,CO3:2,SiO3:2,CH3COO:1};
function saltF(c,a){const q=QCAT[c],p=QAN[a],g=gcd(q,p),x=p/g,y=q/g,cs=c==='NH4'?'NH4':c.replace(/\d$/,''),poly=!['F','Cl','Br','I','S'].includes(a);
  const cf=cs==='NH4'&&x>1?`(NH4)${x}`:cs+(x>1?x:''),af=y>1?(poly?`(${a})${y}`:a+y):a;return cf+af;}
/* activity series */
const ACT=['Li','K','Ba','Sr','Ca','Na','Mg','Al','Mn','Zn','Cr','Fe','Cd','Co','Ni','Sn','Pb','H','Cu','Hg','Ag','Pt','Au'];
const AQ={Li:1,K:1,Ba:2,Sr:2,Ca:2,Na:1,Mg:2,Al:3,Mn:2,Zn:2,Cr:3,Fe:2,Cd:2,Co:2,Ni:2,Sn:2,Pb:2,Cu:2,Hg:2,Ag:1,Pt:2,Au:3};
const nitr=s=>AQ[s]>1?`${s}(NO3)${AQ[s]}`:`${s}NO3`;
function actTool(){
  const zone=s=>{const i=ACT.indexOf(s);return i<=5?'w':i<=7?'h':i<ACT.indexOf('H')?'a':s==='H'?'H':'n';};
  return `<div class="act">${ACT.map(s=>`<span class="ac ${zone(s)}" data-s="${s}">${s}</span>`).join('<i>›</i>')}</div>
  <div class="hint" style="margin:6px 0"><span class="ac w">■</span> ცივ წყალთანაც რეაგირებს · <span class="ac h">■</span> ცხელ წყალთან/ორთქლთან · <span class="ac a">■</span> მჟავებიდან წყალბადს აძევებს · <span class="ac n">■</span> წყალბადის შემდეგ — განზავებული მჟავები ვერ ხსნის. მარცხნივ მდგომი ლითონი მარჯვნივ მდგომს მარილიდან აძევებს.</div>
  <div class="tl-row"><label>ლითონი <select id="acA">${ACT.filter(s=>s!=='H').map(s=>`<option${s==='Zn'?' selected':''}>${s}</option>`).join('')}</select></label>
   <label>+ მარილი/მჟავა <select id="acB">${ACT.map(s=>`<option${s==='Cu'?' selected':''} value="${s}">${s==='H'?'HCl (მჟავა)':nitr(s)}</option>`).join('')}</select></label></div><div id="acOut"></div>`;}
function actRun(){const A=$('acA').value,B=$('acB').value,out=$('acOut'),ia=ACT.indexOf(A),ib=ACT.indexOf(B);
  if(A===B){out.innerHTML='<div class="hint">ერთი და იგივე ლითონი — რეაქცია არ არის.</div>';return;}
  if(ia>ib){out.innerHTML=`<div class="terr">✕ რეაქცია არ მიმდინარეობს: ${A} აქტივობის რიგში ${B==='H'?'წყალბადის':B+'-ის'} შემდეგ დგას — ${B==='H'?'მჟავიდან წყალბადს ვერ აძევებს.':'უფრო ნაკლებად აქტიურია.'}</div>`;return;}
  let s=B==='H'?`${A} + HCl = ${AQ[A]>1?A+'Cl'+AQ[A]:A+'Cl'} + H2`:`${A} + ${nitr(B)} = ${nitr(A)} + ${B}`,eq;
  try{const r=balanceEq(s);eq=r.sp.slice(0,r.nl).map((f,i)=>coefTxt(r.k[i],f)).join(' + ')+' → '+r.sp.slice(r.nl).map((f,i)=>coefTxt(r.k[r.nl+i],f)).join(' + ');}catch(e){eq=s;}
  const ws=ia<=5?` ${A} ისე აქტიურია, რომ ხსნარში ჯერ წყალთან რეაგირებს (${A} + H2O → ჰიდროქსიდი + H2) — ლითონის გამოყოფა პრაქტიკულად არ ხდება.`:'';
  out.innerHTML=`<div class="eq big">${eqFmt(eq+(B==='H'?'↑':''))}</div><div class="hint">${A} აქტიურია ${B==='H'?'წყალბადზე':B+'-ზე'}: ელექტრონებს გასცემს (იჟანგება ${A}⁰ → ${A}${AQ[A]>1?SUPN(AQ[A]):''}⁺), ${B==='H'?'H⁺ აღდგება H₂-მდე':B+' კი აღდგება ლითონამდე'}.${ws}</div>`;}
const TOOLS=[['eq','⚖ განტოლება და სტექიომეტრია',eqTool,eqRun],['mm','🧮 მოლური მასა',mmTool,mmRun],['ox','± ჟანგვის ხარისხი',oxTool,oxRun],['sol','💧 ხსნადობის ცხრილი',solTool,null],['act','⚡ ლითონების აქტივობის რიგი',actTool,actRun]];
let TOOL='eq';
function drawTools(){const box=$('tools');if(!box)return;const T=TOOLS.find(t=>t[0]===TOOL);
  box.innerHTML=`<h3>🔬 ქიმიის ინსტრუმენტები</h3><div class="ttabs">${TOOLS.map(([k,n])=>`<button data-t="${k}" class="${k===TOOL?'on':''}">${n}</button>`).join('')}</div><div class="tbody">${T[2]()}</div>`;
  box.querySelectorAll('.ttabs button').forEach(b=>b.onclick=()=>{TOOL=b.dataset.t;drawTools();});
  const run=T[3];
  if(TOOL==='eq'){$('eqGo').onclick=run;$('eqIn').onkeydown=e=>{if(e.key==='Enter')run();};box.querySelectorAll('.ex button').forEach(b=>b.onclick=()=>{$('eqIn').value=b.textContent;run();});}
  if(TOOL==='mm'){$('mmIn').oninput=run;box.querySelectorAll('.ex button').forEach(b=>b.onclick=()=>{$('mmIn').value=b.textContent;run();});}
  if(TOOL==='ox'){$('oxIn').oninput=run;$('oxQ').oninput=run;box.querySelectorAll('.ex button').forEach(b=>b.onclick=()=>{$('oxIn').value=b.textContent.replace(/[⁺²⁻]/g,'');$('oxQ').value=b.dataset.q;run();});}
  if(TOOL==='act'){$('acA').onchange=run;$('acB').onchange=run;box.querySelectorAll('.act .ac').forEach(s=>s.onclick=()=>{const v=s.dataset.s;if(v!=='H'&&BY[v])showInfo(BY[v].z);});}
  if(TOOL==='sol')box.querySelectorAll('.sol td').forEach(td=>td.onclick=()=>{const c=td.dataset.c,a=td.dataset.a,v=sol2(c,a),f=saltF(c,a);
    $('solOut').innerHTML=v==='-'?`${esc(f)} — წყალხსნარში არ არსებობს (ჰიდროლიზდება ან იშლება).`:`<b class="cf" style="color:var(--gold-lt);font-size:15px">${fmt(f)}</b> — ${SOLC[v][2]}${v==='N'?' · ხსნარების შერევისას ნალექად გამოიყოფა':''}.`;});
  if(run)run();
}

/* tooltip */
pt.addEventListener('mousemove',ev=>{const el=ev.target.closest('.el');const tip=$('tip');if(!el||DRAG){tip.style.display='none';return;}const e=EL[+el.dataset.z];
  tip.innerHTML=`<b>${e.z} ${e.sym} — ${esc(e.ka)}</b><br>${CATN[e.cat]} · ${e.m}<br><span class="cf">${cfgText(e.z)}</span>`;tip.style.display='block';tip.style.left=Math.min(innerWidth-250,ev.clientX+14)+'px';tip.style.top=(ev.clientY+14)+'px';});
pt.addEventListener('mouseleave',()=>{$('tip').style.display='none';});
viewInit();drawTable();drawSlots();drawTools();
</script>
<script src="chem_adv.js"></script>
