<title>ქიმიის ლაბორატორია · MAGNUS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400;600&family=Noto+Serif+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games.css">
<style>

.page{max-width:1100px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.panel h3{font-family:'Cinzel',serif;font-weight:400;font-size:12px;letter-spacing:2.5px;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.hint{font-size:11.5px;color:var(--ink-dim);line-height:1.6}

.el{position:relative;aspect-ratio:1/1.12;border-radius:4px;border:1px solid rgba(255,255,255,.08);background:color-mix(in srgb,var(--cc) 22%,#0e0b1a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;overflow:hidden;transition:transform .08s}
.el:hover{transform:scale(1.12);z-index:3;border-color:var(--cc)}
.el .z{position:absolute;top:1px;left:3px;font-size:clamp(5px,.75vw,9px);color:rgba(255,255,255,.55)}
.el .s{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(8px,1.45vw,17px);color:#fff;line-height:1}
.el .n{font-size:clamp(4px,.62vw,8px);color:rgba(255,255,255,.65);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 1px}
.el.dim{opacity:.25}.el.sel{outline:2px solid #fff;outline-offset:1px}
.gap{grid-column:span 1}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11px;color:var(--ink-mid)}
.legend span{display:inline-flex;align-items:center;gap:4px;cursor:pointer}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend span.off{opacity:.35}
.ghost{position:fixed;pointer-events:none;z-index:99;width:54px;height:60px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:600;font-size:22px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.6);transform:translate(-50%,-60%)}

.reactor{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px 8px}
.slot{width:104px;height:116px;border:2px dashed var(--border-h);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink-dim);font-size:11.5px;text-align:center;transition:all .15s;background:rgba(255,255,255,.02)}
.slot.over{border-color:var(--gold-lt);background:rgba(201,168,76,.12);transform:scale(1.05)}
.slot.full{border-style:solid;background:color-mix(in srgb,var(--cc) 25%,#0e0b1a);border-color:var(--cc);color:#fff;cursor:pointer}
.slot .S{font-family:'Cinzel',serif;font-size:34px;font-weight:600;line-height:1}.slot .Z{font-size:10px;opacity:.7}.slot .N{font-size:12px}
.plus{font-family:'Cinzel',serif;font-size:28px;color:var(--gold)}
.rbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rbtns button{background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:14px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.rbtns button:hover{border-color:var(--border-h);color:var(--gold-lt)}

.card2 .hd{display:flex;align-items:center;gap:10px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-top:8px}.kv b{color:var(--ink-dim);font-weight:400}
.cf{font-family:'Cinzel',serif;letter-spacing:.5px}
.bond{font-size:13.5px;line-height:1.7;padding:8px 12px;border-radius:8px;background:rgba(201,168,76,.07);border:1px solid var(--border)}
.bond b{color:var(--gold-lt)}
.cmp{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px;background:rgba(0,0,0,.15)}
.cmp .f{font-family:'Cinzel',serif;font-size:24px;color:var(--gold-lt)}
.cmp .nm{font-size:14px;color:var(--ink);margin-left:8px}
.cmp .eq{font-family:'Cinzel',serif;font-size:15px;color:#e8e0cc;margin:6px 0;letter-spacing:.3px}
.cmp .meta{font-size:12px;color:var(--ink-mid);line-height:1.6}
.tag{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:9px;border:1px solid;margin:2px 4px 2px 0}
.tag.r{color:#7fd8a8;border-color:rgba(127,216,168,.5)}.tag.p{color:#e8c95a;border-color:rgba(232,201,90,.5)}.tag.w{color:#f08a6a;border-color:rgba(240,138,106,.5)}
.tag.t{color:var(--ink-mid);border-color:var(--border)}
.mol{display:flex;justify-content:center;margin-top:6px}.mol svg{max-width:100%;height:auto}
.anim{display:flex;justify-content:center}

#tip{position:fixed;z-index:50;pointer-events:none;background:#141022;border:1px solid var(--border-h);border-radius:8px;padding:6px 9px;font-size:12px;display:none;max-width:240px}

  if(A===B)return [A.metal?'მეტალური ბმა':'არაპოლარული კოვალენტური',A.metal?'საერთო ელექტრონული ღრუბელი.':'ერთნაირი ატომები ელექტრონებს თანაბრად იზიარებენ.'];
  if(d>=1.7)return ['იონური ბმა',`ΔEN = ${d.toFixed(2)} ≥ 1.7: ${((A.en||0)<(B.en||0)?A:B).ka} ელექტრონებს გასცემს და დადებით იონად იქცევა, ${((A.en||0)<(B.en||0)?B:A).ka} — იღებს და უარყოფით იონად; იონები ერთმანეთს ელექტროსტატიკურად იზიდავს.`];
  if(d>=0.4)return ['პოლარული კოვალენტური',`ΔEN = ${d.toFixed(2)}: ელექტრონული წყვილი საერთოა, მაგრამ ${((A.en||0)>(B.en||0)?A:B).ka}სკენაა გადახრილი (ნაწილობრივი მუხტები δ⁺ და δ⁻).`];

}

    if(DRAG.ghost){DRAG.ghost.remove();const t=slotAt(u.clientX,u.clientY);if(t!=null)put(t,z);}
    else put(SLOT[0]==null?0:SLOT[1]==null?1:1,z);

  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function slotAt(x,y){for(const [i,id] of [[0,'sA'],[1,'sB']]){const r=$(id).getBoundingClientRect();if(x>=r.left-12&&x<=r.right+12&&y>=r.top-12&&y<=r.bottom+12)return i;}return null;}
function put(i,z){SLOT[i]=z;drawSlots();react();}
function drawSlots(){[$('sA'),$('sB')].forEach((s,i)=>{const z=SLOT[i];if(!z){s.className='slot';s.innerHTML='ჩააგდე<br>ელემენტი';s.style.removeProperty('--cc');return;}
  const e=EL[z];s.className='slot full';s.style.setProperty('--cc',`var(--c-${e.cat})`);s.innerHTML=`<span class="Z">${z}</span><span class="S">${e.sym}</span><span class="N">${esc(e.ka)}</span>`;
  s.onclick=()=>{SLOT[i]=null;drawSlots();react();};});
  pt.querySelectorAll('.el').forEach(el=>el.classList.toggle('sel',SLOT.includes(+el.dataset.z)));}
$('swap').onclick=()=>{SLOT.reverse();drawSlots();react();};

$('rnd').onclick=()=>{const keys=Object.keys(R).filter(k=>R[k].length);const k=keys[Math.floor(Math.random()*keys.length)].split('|');SLOT[0]=BY[k[0]].z;SLOT[1]=BY[k[1]].z;drawSlots();react();};

/* ═══════════ molecule drawing ═══════════ */
const BVAL={H:1,B:3,C:4,N:3,O:2,F:1,Si:4,P:3,S:2,Cl:1,Br:1,I:1,Se:2,As:3,Ge:4,Xe:2};
const LONE={O:2,S:2,N:1,P:1,Se:2,As:1,Xe:3,Cl:3,Br:3,I:3,F:3};
function atomSVG(s,x,y,r){const e=BY[s];return `<circle cx="${x}" cy="${y}" r="${r}" fill="color-mix(in srgb,var(--c-${e.cat}) 45%,#141022)" stroke="var(--c-${e.cat})" stroke-width="1.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-family="Cinzel,serif" font-size="${r>16?15:12}" fill="#fff" font-weight="600">${s}</text>`;}
function bondSVG(x1,y1,x2,y2,o){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*4,ny=dx/L*4;let s='';
  const offs=o===1?[0]:o===2?[-1,1]:[-1.6,0,1.6];for(const k of offs)s+=`<line x1="${x1+nx*k}" y1="${y1+ny*k}" x2="${x2+nx*k}" y2="${y2+ny*k}" stroke="#d8cfb8" stroke-width="2"/>`;return s;}
function drawGeo(G){const W=260,H=150,cx=W/2,cy=H/2;let s='';for(const [i,j,o] of G.b){const a=G.a[i],b=G.a[j];s+=bondSVG(cx+a[1],cy+a[2],cx+b[1],cy+b[2],o);}
  for(const a of G.a)s+=atomSVG(a[0],cx+a[1],cy+a[2],16);return `<svg viewBox="0 0 ${W} ${H}" width="${W}">${s}</svg>`;}
function molecule(c,type){
  if(c.g&&GEO[c.g])return drawGeo(GEO[c.g]);
  const p=parseF(c.f);if(!p.length)return '';
  if(type==='ionic'||type==='metal')return lattice(p,type);
  if(p.length===1){const [s,n]=p[0];if(n===2){const o=BVAL[s]||1;return drawGeo({a:[[s,-34,0],[s,34,0]],b:[[0,1,o]]});}return '';}
  if(p.length!==2)return '';
  let [[a,na],[b,nb]]=p;
  if(na===1&&nb===1){let o=Math.min(BVAL[a]||1,BVAL[b]||1);const m=(c.flags||'').match(/b:\w+-\w+:(\d)/);if(m)o=+m[1];return drawGeo({a:[[a,-38,0],[b,38,0]],b:[[0,1,o]]});}
  /* centre = the single atom (or the less electronegative) */
  let C,L,n;if(na===1){C=a;L=b;n=nb;}else if(nb===1){C=b;L=a;n=na;}else return '';
  if(n>6)return '';
  const lone=Math.max(0,LONE[C]!=null?Math.min(LONE[C],Math.round(((BY[C]&&valence(BY[C]))-n*Math.min(BVAL[L]||1,Math.floor((BVAL[C]||n)/n)))/2)):0);
  const bo=Math.max(1,Math.min(BVAL[L]||1,Math.floor((BVAL[C]||n)/n)));
  /* VSEPR-ish angles */
  const tot=n+lone;const ANG={1:[0],2:[0,180],3:[90,210,330],4:[45,135,225,315],5:[90,162,234,306,18],6:[0,60,120,180,240,300]};
  let ang=(ANG[tot]||ANG[n]).slice(0,n);if(n===2&&lone>0)ang=tot===5?[0,180]:[142,38];if(n===4&&tot===6)ang=[0,90,180,270];
  const R=58,atoms=[[C,0,0]],bonds=[];ang.forEach((g,i)=>{atoms.push([L,Math.round(R*Math.cos(g*Math.PI/180)),Math.round(-R*Math.sin(g*Math.PI/180)*0.85)]);bonds.push([0,i+1,bo]);});
  let svg=drawGeo({a:atoms,b:bonds});
  if(lone)svg=svg.replace('</svg>',`<text x="130" y="${n===2?104:30}" text-anchor="middle" font-size="10" fill="#b3a68f">${':'.repeat(lone)} ${lone} თავისუფალი წყვილი</text></svg>`);
  return svg;
}
function lattice(p,type){const W=260,H=150;let s='';
  if(type==='metal'||p.length<2){const syms=p.map(x=>x[0]);for(let r=0;r<4;r++)for(let c=0;c<7;c++){const sy=syms[(r+c)%syms.length];s+=atomSVG(sy,26+c*35,26+r*33,13);}
    for(let k=0;k<14;k++)s+=`<circle cx="${18+Math.random()*224}" cy="${14+Math.random()*120}" r="2" fill="#7fd8ff" opacity=".8"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}">${s}<text x="130" y="146" text-anchor="middle" font-size="10" fill="#b3a68f">ლითონის მესერი · ცისფერი — თავისუფალი ელექტრონები</text></svg>`;}
  const [[a,na],[b,nb]]=p,ea=BY[a],eb=BY[b];const posA=(ea.en||0)<(eb.en||0);const cat=posA?a:b,an=posA?b:a,nc=posA?na:nb,nn=posA?nb:na;
  const seq=[];for(let i=0;i<nc;i++)seq.push(cat);for(let i=0;i<nn;i++)seq.push(an);
  let k=0;for(let r=0;r<4;r++)for(let c=0;c<7;c++){const sy=seq[(k++)%seq.length];const x=24+c*35,y=24+r*33;s+=atomSVG(sy,x,y,13);
    s+=`<text x="${x+11}" y="${y-8}" font-size="10" fill="${sy===cat?'#ff9a8a':'#8ab8ff'}">${sy===cat?'+':'−'}</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}">${s}<text x="130" y="146" text-anchor="middle" font-size="10" fill="#b3a68f">იონური კრისტალი · ${cat}⁺ და ${an}⁻ იონები (თანაფარდობა ${nc}:${nn})</text></svg>`;}

/* ═══════════ animated atoms (Bohr model): electron transfer or sharing ═══════════ */
let RAF=null;
function bohr(A,B,kind,give){
  cancelAnimationFrame(RAF);
  const W=320,H=170,host=document.getElementById('bohr');if(!host)return;
  const sa=shells(A.z),sb=shells(B.z);
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" id="bsv"></svg>`;const svg=$('bsv');
  const t0=performance.now();
  const frame=t=>{const T=((t-t0)/1000)%6,ph=Math.min(1,Math.max(0,(T-1)/2.5));
    const sep=kind==='cov'?120-40*ph:140;const xa=W/2-sep/2,xb=W/2+sep/2,y=H/2;let s='';
    const drawAtom=(x,sh,e,lost,gain)=>{let o=`<circle cx="${x}" cy="${y}" r="9" fill="color-mix(in srgb,var(--c-${e.cat}) 70%,#141022)"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" fill="#fff" font-family="Cinzel">${e.sym}</text>`;
      const vis=sh.slice(-3),base=sh.length-vis.length;
      vis.forEach((n,i)=>{const r=18+i*13;o+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="rgba(201,168,76,.25)"/>`;
        let cnt=n;const outer=i===vis.length-1;if(outer)cnt=n-lost;
        for(let k=0;k<cnt;k++){const g=k/Math.max(cnt,1)*Math.PI*2+t/1000*(0.6/(i+1));o+=`<circle cx="${x+r*Math.cos(g)}" cy="${y+r*Math.sin(g)}" r="2.6" fill="#7fd8ff"/>`;}});
      return o;};
    const rA=18+(Math.min(3,sa.length)-1)*13,rB=18+(Math.min(3,sb.length)-1)*13;
    if(kind==='ion'){const n=give,moving=ph<1;
      s+=drawAtom(xa,sa,A,n,0)+drawAtom(xb,sb,B,0,0);
      for(let k=0;k<n;k++){const px=xa+rA+(xb-rB-(xa+rA))*ph,py=y-12+k*8;s+=`<circle cx="${px}" cy="${py}" r="3" fill="${moving?'#ffd27f':'#7fd8ff'}"/>`;}
      if(ph>=1)s+=`<text x="${xa}" y="${y-rA-8}" text-anchor="middle" fill="#ff9a8a" font-size="13">+${n>1?n:''}</text><text x="${xb}" y="${y-rB-8}" text-anchor="middle" fill="#8ab8ff" font-size="13">−${n>1?n:''}</text>`;}
    else if(kind==='cov'){s+=drawAtom(xa,sa,A,ph>0.9?1:0,0)+drawAtom(xb,sb,B,ph>0.9?1:0,0);
      if(ph>0.9){const mx=(xa+xb)/2;s+=`<circle cx="${mx-4}" cy="${y-3}" r="3" fill="#ffd27f"/><circle cx="${mx+4}" cy="${y+3}" r="3" fill="#ffd27f"/><text x="${mx}" y="${y+40}" text-anchor="middle" font-size="10" fill="#ffd27f">საერთო წყვილი</text>`;}}
    else s+=drawAtom(xa,sa,A,0,0)+drawAtom(xb,sb,B,0,0);
    svg.innerHTML=s;RAF=requestAnimationFrame(frame);};
  RAF=requestAnimationFrame(frame);
}

/* ═══════════ chains (C–H, Si–H) ═══════════ */
const ALK=['','მეთ','ეთ','პროპ','ბუტ','პენტ','ჰექს','ჰეპტ','ოქტ','ნონ','დეკ','უნდეკ','დოდეკ'];
let CH={kind:'ane',n:4,el:'C'};
function chainHTML(){
  const n=CH.n,el=CH.el,k=CH.kind;
  let H=k==='ane'?2*n+2:k==='ene'?2*n:k==='yne'?2*n-2:k==='cyc'?2*n:6,N=k==='benz'?6:n;
  const f=`${el}${N>1?N:''}H${H}`;
  const nm=el==='Si'?(n===1?'სილანი':['','','დი','ტრი','ტეტრა','პენტა','ჰექსა','ჰეპტა','ოქტა','ნონა','დეკა'][n]+'სილანი'):k==='benz'?'ბენზოლი':k==='cyc'?'ციკლო'+ALK[n]+'ანი':ALK[n]+(k==='ane'?'ანი':k==='ene'?'ენი':'ინი');
  const st=el==='Si'?'':N<=4?'აირი':N<=16?'სითხე':'მყარი';
  return `<div class="ctl">${el==='C'?['ane','ალკანები CₙH₂ₙ₊₂','ene','ალკენები CₙH₂ₙ','yne','ალკინები CₙH₂ₙ₋₂','cyc','ციკლოალკანები','benz','ბენზოლი'].reduce((a,x,i,arr)=>i%2?a:a+`<button data-k="${x}" class="${k===x?'on':''}">${arr[i+1]}</button>`,''):''}
    ${k!=='benz'?`<label class="hint">ატომი: <b style="color:var(--gold-lt)">${n}</b> <input type="range" id="chn" min="${k==='ane'?1:k==='cyc'?3:2}" max="${el==='Si'?8:12}" value="${n}"></label>`:''}</div>
    <div class="cmp"><span class="f">${fmt(f)}</span><span class="nm">${esc(nm)}</span><div class="meta">მოლური მასა ${molMass(f).toFixed(2)} გ/მოლი${st?' · ოთახის ტემპერატურაზე: '+st:''}${k==='benz'?' · არომატული რგოლი: 6 ელექტრონი მთელ რგოლზეა გადანაწილებული':''}</div>
    <div class="mol">${chainSVG()}</div></div>`;
}
function chainSVG(){
  const n=CH.k==='benz'?6:CH.n,el=CH.el,k=CH.kind,full=n<=8&&k!=='cyc'&&k!=='benz';
  if(k==='cyc'||k==='benz'){const N=k==='benz'?6:n,R=48,cx=150,cy=85;let s='';const P=[];for(let i=0;i<N;i++){const g=-Math.PI/2+i*2*Math.PI/N;P.push([cx+R*Math.cos(g),cy+R*Math.sin(g)]);}
    for(let i=0;i<N;i++){const [x1,y1]=P[i],[x2,y2]=P[(i+1)%N];s+=bondSVG(x1,y1,x2,y2,k==='benz'&&i%2===0?2:1);}
    for(let i=0;i<N;i++){const [x,y]=P[i],hx=cx+(R+30)*(x-cx)/R,hy=cy+(R+30)*(y-cy)/R;s+=bondSVG(x,y,hx,hy,1)+atomSVG('H',hx,hy,9);if(k!=='benz'){const hx2=cx+(R+30)*(x-cx)/R+((y-cy)/R)*14,hy2=cy+(R+30)*(y-cy)/R-((x-cx)/R)*14;}}
    for(const [x,y] of P)s+=atomSVG(el,x,y,13);
    if(k==='benz')s+=`<circle cx="${cx}" cy="${cy}" r="${R*0.55}" fill="none" stroke="#ffd27f" stroke-dasharray="3 3"/>`;
    return `<svg viewBox="0 0 300 175" width="300">${s}</svg>`;}
  const dx=full?44:30,W=Math.max(220,n*dx+80),y0=80;let s='';const X=i=>40+i*dx;
  for(let i=0;i<n-1;i++){const o=(k==='ene'&&i===0)||(k==='yne'&&i===0)?(k==='ene'?2:3):1;s+=bondSVG(X(i),y0,X(i+1),y0,o);}
  if(full){for(let i=0;i<n;i++){let h=4-(i>0?1:0)-(i<n-1?1:0);if(k==='ene'&&(i===0||i===1))h-=1;if(k==='yne'&&(i===0||i===1))h-=2;
      const spots=[[0,-36],[0,36],[-34,0],[34,0]].filter(([sx])=>!(sx<0&&i>0)&&!(sx>0&&i<n-1));
      for(let j=0;j<h&&j<spots.length;j++){const [sx,sy]=spots[j];s+=bondSVG(X(i),y0,X(i)+sx,y0+sy,1)+atomSVG('H',X(i)+sx,y0+sy,9);}}}
  for(let i=0;i<n;i++)s+=atomSVG(el,X(i),y0,13);
  if(!full)s+=`<text x="${W/2}" y="${y0+40}" text-anchor="middle" font-size="10" fill="#b3a68f">ჩონჩხი — წყალბადები ნაგულისხმევია</text>`;
  return `<svg viewBox="0 0 ${W} 160" width="${Math.min(W,900)}">${s}</svg>`;
}
function wireChain(){const box=$('chain');if(!box)return;box.querySelectorAll('.ctl button').forEach(b=>b.onclick=()=>{CH.kind=b.dataset.k;if(CH.kind==='cyc'&&CH.n<3)CH.n=6;if((CH.kind==='ene'||CH.kind==='yne')&&CH.n<2)CH.n=2;box.innerHTML=chainHTML();wireChain();});
  const r=$('chn');if(r)r.oninput=()=>{CH.n=+r.value;box.innerHTML=chainHTML();wireChain();};}

/* ═══════════ reaction panel ═══════════ */
function elCard(e){return `<div class="card2"><div class="hd"><div class="big" style="--cc:var(--c-${e.cat})">${e.sym}</div><div><b style="font-size:16px">${esc(e.ka)}</b><div class="hint">${CATN[e.cat]}${e.radio?' · ☢ რადიოაქტიური':''}</div></div></div>
  <div class="kv"><b>რიგითი ნომერი</b><span>${e.z}</span><b>ატომური მასა</b><span>${e.m}</span><b>ელექტრონული კონფიგ.</b><span class="cf">${cfgText(e.z)}</span><b>შრეები</b><span>${shells(e.z).join(' · ')}</span>
  <b>ელექტროუარყოფითობა</b><span>${e.en??'—'}</span><b>ჟანგვის ხარისხები</b><span>${e.ox.length?e.ox.map(x=>x>0?'+'+x:x).join(', '):'—'}</span><b>მდგომარეობა 20 °C-ზე</b><span>${{g:'აირი',l:'სითხე',s:'მყარი','?':'უცნობი'}[e.st]}</span></div></div>`;}
function react(){
  const out=$('out');cancelAnimationFrame(RAF);
  const [za,zb]=SLOT;if(!za&&!zb){out.style.display='none';return;}
  out.style.display='block';
  if(!za||!zb){const e=EL[za||zb];out.innerHTML=`<div class="panel"><h3>ელემენტი</h3>${elCard(e)}<p class="hint" style="margin-top:8px">ჩააგდე მეორე ელემენტიც (ან იგივე) რეაქციის სანახავად.</p></div>`;return;}
  let A=EL[za],B=EL[zb];const key=[A,B].sort((x,y)=>x.z-y.z).map(e=>e.sym).join('|');
  const [bt,bd]=bondInfo(A,B);
  let list=[],none=null,curated=false;
  if(R[key]!==undefined){curated=true;list=R[key].map(r=>({f:r[0],n:r[1],eq:r[2],note:r[3]||'',flags:r[4]||'',g:r[5]||(r[4]&&!/^(d|chain|b:)/.test(r[4])?r[4]:'')}));
    list.forEach(c=>{if(c.flags==='chain')c.chain=1;});if(!list.length)none=`${A.metal?A.ka:B.ka} კეთილშობილი ლითონია — ჟანგბადთან პირდაპირ არ რეაგირებს (ამიტომაა ოქრო და პლატინა მარადიული).`;}
  else{const p=predict(A,B);if(p.none)none=p.none;else list=p.list;}
  const ionic=bt==='იონური ბმა',type=bt==='მეტალური ბმა'?'metal':ionic?'ionic':'cov';
  /* animation choice */
  let give=1;if(ionic){const P=(A.en||0)<(B.en||0)?A:B;give=Math.max(1,Math.min(3,(P.ox.find(x=>x>0)||1)));if((A.en||0)>(B.en||0))[A,B]=[B,A];}
  let h=`<div class="panel"><h3>⚗ ${esc(A.ka)} + ${esc(B.ka)}</h3><div class="grid2">${elCard(A)}${elCard(B)}</div>
    <div class="bond" style="margin-top:10px"><b>ბმის ტიპი: ${bt}</b><br>${bd}</div>
    <div class="anim" id="bohr" style="margin-top:6px"></div>`;
  if(none)h+=`<div class="cmp"><span class="tag t">რეაქცია არ მიმდინარეობს</span><div class="meta" style="margin-top:4px">${esc(none)}</div></div>`;
  for(const c of list){const mm=molMass(c.f);
    h+=`<div class="cmp"><div><span class="f">${fmt(c.f)}</span><span class="nm">${esc(c.n)}</span></div>
      <div>${c.pred?'<span class="tag p">პროგნოზი ჟანგვის ხარისხებით</span>':'<span class="tag r">რეალური ნაერთი</span>'}${/\bd\b/.test(c.flags||'')?'<span class="tag w">⚠ საშიში / ტოქსიკური</span>':''}<span class="tag t">${type==='metal'?'შენადნობი':ionic?'იონური':'მოლეკულური / კოვალენტური'}</span>${mm?`<span class="tag t">${mm.toFixed(2)} გ/მოლი</span>`:''}</div>
      ${c.eq&&c.eq!=='—'?`<div class="eq">${eqFmt(c.eq)}</div>`:''}${c.note?`<div class="meta">${esc(c.note)}</div>`:''}
      <div class="mol">${molecule(c,c.type||type)}</div></div>`;}
  if(list.some(c=>c.chain)){CH.el=key==='H|Si'?'Si':'C';if(CH.el==='Si')CH.kind='ane';
    h+=`<div class="panel" style="margin-top:12px;background:rgba(0,0,0,.12)"><h3>⛓ ${CH.el==='C'?'ნახშირბადის':'სილიციუმის'} ჯაჭვები — მოლეკულური დონე</h3><div class="hint" style="margin-bottom:8px">${CH.el==='C'?'ნახშირბადი თავის თავთან გრძელ ჯაჭვებს და რგოლებს ქმნის — აქედან იწყება ორგანული ქიმია და სიცოცხლე. აირჩიე ტიპი და ჯაჭვის სიგრძე.':'სილიციუმიც ქმნის ჯაჭვებს (სილანებს), მაგრამ ისინი ბევრად ნაკლებად მდგრადია, ვიდრე ნახშირბადისა.'}</div><div class="chain" id="chain">${chainHTML()}</div></div>`;}
  h+=`<p class="hint" style="margin-top:10px">${curated?'რეალური ნაერთები — სასწავლო მონაცემებით.':'ამ წყვილისთვის ნაერთები ნაწინასწარმეტყველებია ტიპური ჟანგვის ხარისხებით — ზოგი ნაერთი რეალურად შეიძლება არ არსებობდეს ან სხვა შემადგენლობით იყოს.'} ⚠ ქიმიური ცდები მხოლოდ ლაბორატორიაში, სპეციალისტის ზედამხედველობით.</p></div>`;
  out.innerHTML=h;wireChain();
  bohr(A,B,type==='metal'||none?'none':ionic?'ion':'cov',give);
  const r=out.getBoundingClientRect();if(r.top>innerHeight*0.6)out.scrollIntoView({behavior:'smooth',block:'start'});
}
/* tooltip */
pt.addEventListener('mousemove',ev=>{const el=ev.target.closest('.el');const tip=$('tip');if(!el||DRAG){tip.style.display='none';return;}const e=EL[+el.dataset.z];
  tip.innerHTML=`<b>${e.z} ${e.sym} — ${esc(e.ka)}</b><br>${CATN[e.cat]} · ${e.m}<br><span class="cf">${cfgText(e.z)}</span>`;tip.style.display='block';tip.style.left=Math.min(innerWidth-250,ev.clientX+14)+'px';tip.style.top=(ev.clientY+14)+'px';});
pt.addEventListener('mouseleave',()=>{$('tip').style.display='none';});
drawTable();drawSlots();
</script>
