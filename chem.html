<link rel="stylesheet" href="games.css">

.panel h3{font-family:'Cinzel',serif;font-weight:400;font-size:12px;letter-spacing:2.5px;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.hint{font-size:11.5px;color:var(--ink-dim);line-height:1.6}

  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;overflow:hidden;transition:transform .08s}
.el:hover{transform:scale(1.12);z-index:3;border-color:var(--cc)}
.el .z{position:absolute;top:1px;left:3px;font-size:clamp(5px,.75vw,9px);color:rgba(255,255,255,.55)}
.el .s{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(8px,1.45vw,17px);color:#fff;line-height:1}
.el .n{font-size:clamp(4px,.62vw,8px);color:rgba(255,255,255,.65);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 1px}
.el.dim{opacity:.25}.el.sel{outline:2px solid #fff;outline-offset:1px}
.gap{grid-column:span 1}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11px;color:var(--ink-mid)}
.legend span{display:inline-flex;align-items:center;gap:4px;cursor:pointer}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend span.off{opacity:.35}
.ghost{position:fixed;pointer-events:none;z-index:99;width:54px;height:60px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:600;font-size:22px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.6);transform:translate(-50%,-60%)}

.reactor{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px 8px}
.slot{width:104px;height:116px;border:2px dashed var(--border-h);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink-dim);font-size:11.5px;text-align:center;transition:all .15s;background:rgba(255,255,255,.02)}
.slot.over{border-color:var(--gold-lt);background:rgba(201,168,76,.12);transform:scale(1.05)}
.slot.full{border-style:solid;background:color-mix(in srgb,var(--cc) 25%,#0e0b1a);border-color:var(--cc);color:#fff;cursor:pointer}
.slot .S{font-family:'Cinzel',serif;font-size:34px;font-weight:600;line-height:1}.slot .Z{font-size:10px;opacity:.7}.slot .N{font-size:12px}
.plus{font-family:'Cinzel',serif;font-size:28px;color:var(--gold)}
.rbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rbtns button{background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:14px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.rbtns button:hover{border-color:var(--border-h);color:var(--gold-lt)}
#out{display:none}
.reactor.many{gap:6px}.reactor.many .slot{width:74px;height:86px}.reactor.many .slot .S{font-size:25px}.reactor.many .plus{font-size:18px}
.slot.add{border-style:dotted;color:var(--gold);font-size:24px;cursor:pointer;width:64px}.slot.add small{font-size:10px;color:var(--ink-dim)}.reactor.many .slot.add{width:52px}
.minis{display:flex;flex-wrap:wrap;gap:6px}.mini{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:6px 8px;border-radius:8px;border:1px solid var(--cc);background:color-mix(in srgb,var(--cc) 18%,#0e0b1a)}
.mini b{font-family:'Cinzel',serif;font-size:22px;color:#fff}.mini span{font-size:12px}.mini small{font-size:10px;color:var(--ink-dim)}
.sec{margin-top:16px}.sec h4{font-family:'Cinzel',serif;color:var(--gold-lt);font-size:14px;margin:0 0 6px;font-weight:600}

.prow button:hover{border-color:var(--border-h);color:var(--gold-lt)}

.bond b{color:var(--gold-lt)}

.cmp .nm{font-size:14px;color:var(--ink);margin-left:8px}

function predict(A,B){

    if(DIAT.has(A.sym))return {list:[{f:A.sym+'2',n:`${A.ka}ს მოლეკულა`,eq:`${A.sym} + ${A.sym} → ${A.sym}2`,pred:1}]};

  if(A.cat==='noble'||B.cat==='noble')return {none:`${A.cat==='noble'?A.ka:B.ka} ინერტული აირია: გარე შრე სავსეა, ელექტრონის გაცემა ან მიღება არ სჭირდება — ჩვეულებრივ პირობებში ნაერთს არ ქმნის.`};
  if(A.synth||B.synth)return {none:'ზემძიმე სინთეზური ელემენტია: მიღებულია მხოლოდ რამდენიმე ატომი, რომლებიც წამებში ან წუთებში იშლება — მისი ქიმია პრაქტიკულად შეუსწავლელია.'};
  if(A.metal&&B.metal)return {list:[{f:A.sym+B.sym,n:`${gen(A.ka)} და ${gen(B.ka)} შენადნობი`,eq:'—',note:'ორი ლითონი ქიმიურ ნაერთს იშვიათად ქმნის — ძირითადად შენადნობს ან ინტერმეტალურ ფაზას (გამდნარი ლითონების შერევით).',pred:1,type:'metal'}]};

  if(A.cat==='noble'||B.cat==='noble')return ['არ არის','—'];

  const d=Math.abs((A.en||0)-(B.en||0));
  if(A===B)return [A.metal?'მეტალური ბმა':'არაპოლარული კოვალენტური',A.metal?'საერთო ელექტრონული ღრუბელი.':'ერთნაირი ატომები ელექტრონებს თანაბრად იზიარებენ.'];
  if(d>=1.7)return ['იონური ბმა',`ΔEN = ${d.toFixed(2)} ≥ 1.7: ${((A.en||0)<(B.en||0)?A:B).ka} ელექტრონებს გასცემს და დადებით იონად იქცევა, ${((A.en||0)<(B.en||0)?B:A).ka} — იღებს და უარყოფით იონად; იონები ერთმანეთს ელექტროსტატიკურად იზიდავს.`];
  if(d>=0.4)return ['პოლარული კოვალენტური',`ΔEN = ${d.toFixed(2)}: ელექტრონული წყვილი საერთოა, მაგრამ ${((A.en||0)>(B.en||0)?A:B).ka}სკენაა გადახრილი (ნაწილობრივი მუხტები δ⁺ და δ⁻).`];
  return ['არაპოლარული კოვალენტური',`ΔEN = ${d.toFixed(2)} < 0.4: ელექტრონები თითქმის თანაბრად ნაწილდება.`];
}

function slotEls(){return [...document.querySelectorAll('#rx .slot')];}
function slotAt(x,y){for(const s of slotEls()){const r=s.getBoundingClientRect();if(x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8)return +s.dataset.s;}return null;}

/* ═══════════ molecule drawing ═══════════ */
const BVAL={H:1,B:3,C:4,N:3,O:2,F:1,Si:4,P:3,S:2,Cl:1,Br:1,I:1,Se:2,As:3,Ge:4,Xe:2};

function atomSVG(s,x,y,r){const e=BY[s];return `<circle cx="${x}" cy="${y}" r="${r}" fill="color-mix(in srgb,var(--c-${e.cat}) 45%,#141022)" stroke="var(--c-${e.cat})" stroke-width="1.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-family="Cinzel,serif" font-size="${r>16?15:12}" fill="#fff" font-weight="600">${s}</text>`;}

  for(const a of G.a)s+=atomSVG(a[0],cx+a[1],cy+a[2],16);return `<svg viewBox="0 0 ${W} ${H}" width="${W}">${s}</svg>`;}
function molecule(c,type){

  if(p.length!==2)return '';

  const tot=n+lone;const ANG={1:[0],2:[0,180],3:[90,210,330],4:[45,135,225,315],5:[90,162,234,306,18],6:[0,60,120,180,240,300]};

  const R=58,atoms=[[C,0,0]],bonds=[];ang.forEach((g,i)=>{atoms.push([L,Math.round(R*Math.cos(g*Math.PI/180)),Math.round(-R*Math.sin(g*Math.PI/180)*0.85)]);bonds.push([0,i+1,bo]);});
  let svg=drawGeo({a:atoms,b:bonds});
  if(lone)svg=svg.replace('</svg>',`<text x="130" y="${n===2?104:30}" text-anchor="middle" font-size="10" fill="#b3a68f">${':'.repeat(lone)} ${lone} თავისუფალი წყვილი</text></svg>`);

}
function lattice(p,type){const W=260,H=150;let s='';

    for(let k=0;k<14;k++)s+=`<circle cx="${18+Math.random()*224}" cy="${14+Math.random()*120}" r="2" fill="#7fd8ff" opacity=".8"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}">${s}<text x="130" y="146" text-anchor="middle" font-size="10" fill="#b3a68f">ლითონის მესერი · ცისფერი — თავისუფალი ელექტრონები</text></svg>`;}

/* ═══════════ animated atoms (Bohr model): electron transfer or sharing ═══════════ */
let RAF=null;

      return o;};
    const rA=18+(Math.min(3,sa.length)-1)*13,rB=18+(Math.min(3,sb.length)-1)*13;
    if(kind==='ion'){const n=give,moving=ph<1;
      s+=drawAtom(xa,sa,A,n,0)+drawAtom(xb,sb,B,0,0);
      for(let k=0;k<n;k++){const px=xa+rA+(xb-rB-(xa+rA))*ph,py=y-12+k*8;s+=`<circle cx="${px}" cy="${py}" r="3" fill="${moving?'#ffd27f':'#7fd8ff'}"/>`;}
      if(ph>=1)s+=`<text x="${xa}" y="${y-rA-8}" text-anchor="middle" fill="#ff9a8a" font-size="13">+${n>1?n:''}</text><text x="${xb}" y="${y-rB-8}" text-anchor="middle" fill="#8ab8ff" font-size="13">−${n>1?n:''}</text>`;}
    else if(kind==='cov'){s+=drawAtom(xa,sa,A,ph>0.9?1:0,0)+drawAtom(xb,sb,B,ph>0.9?1:0,0);
      if(ph>0.9){const mx=(xa+xb)/2;s+=`<circle cx="${mx-4}" cy="${y-3}" r="3" fill="#ffd27f"/><circle cx="${mx+4}" cy="${y+3}" r="3" fill="#ffd27f"/><text x="${mx}" y="${y+40}" text-anchor="middle" font-size="10" fill="#ffd27f">საერთო წყვილი</text>`;}}
    else s+=drawAtom(xa,sa,A,0,0)+drawAtom(xb,sb,B,0,0);
    svg.innerHTML=s;RAF=requestAnimationFrame(frame);};
  RAF=requestAnimationFrame(frame);
}

  return `<div class="ctl"><label class="hint">ნახშირბადი: <b style="color:var(--gold-lt)">${n}</b> <input type="range" id="chn" min="${g.min}" max="12" value="${n}"></label></div>
  <div class="cmp"><span class="f">${fmt(f)}</span><span class="nm">${esc(g.nm(n))}${g.triv&&g.triv[n]?' · '+esc(g.triv[n]):''}</span>
  <div class="meta">მოლური მასა ${massOf(f).toFixed(2)} გ/მოლი · ჰომოლოგიური რიგი: ${g.row}</div><div class="mol">${drawSmiles(smi)}</div></div>`;}
function chainHTML(){const fgs=CH.el==='C'?(CH.fgs||[]):[];
  const row=fgs.length?`<div class="ctl fgrow"><span class="hint">ფუნქციური ჯგუფი:</span><button data-fg="" class="${CH.fg?'':'on'}">ნახშირწყალბადი</button>${fgs.map(k=>`<button data-fg="${k}" class="${CH.fg===k?'on':''}">${FG[k].lbl}</button>`).join('')}</div>`:'';
  return row+(CH.fg&&fgs.includes(CH.fg)?fgPart():chainHTML0());}
function wireChain(){const box=$('chain');if(!box)return;wireChain0();
  box.querySelectorAll('.ctl button[data-k]').forEach(b=>{const old=b.onclick;b.onclick=()=>{CH.fg='';old();};});
  box.querySelectorAll('.fgrow button').forEach(b=>b.onclick=()=>{CH.fg=b.dataset.fg;if(CH.fg)CH.kind='ane';box.innerHTML=chainHTML();wireChain();});}
const chainPanel=(el,txt)=>`<div class="panel" style="margin-top:12px;background:rgba(0,0,0,.12)"><h3>⛓ ${el==='C'?'ნახშირბადის':'სილიციუმის'} ჯაჭვები — მოლეკულური დონე</h3><div class="hint" style="margin-bottom:8px">${txt}</div><div class="chain" id="chain">${chainHTML()}</div></div>`;

/* ═══════════ three or more elements ═══════════ */
function enScale(E){
  const W=560,x=v=>24+(v-0.7)/(4.0-0.7)*(W-48);
  let s=`<defs><linearGradient id="eng"><stop offset="0" stop-color="#e8705a"/><stop offset=".5" stop-color="#c9a84c"/><stop offset="1" stop-color="#5a8ae8"/></linearGradient></defs>
    <line x1="24" y1="50" x2="${W-24}" y2="50" stroke="url(#eng)" stroke-width="6" stroke-linecap="round"/>
    <text x="24" y="96" font-size="10.5" fill="#e8a090">← ელექტრონებს გასცემს (კატიონი)</text><text x="${W-24}" y="96" font-size="10.5" fill="#90b0e8" text-anchor="end">ელექტრონებს იღებს (ანიონი) →</text>`;
  E.filter(e=>e.en!=null).sort((a,b)=>a.en-b.en).forEach((e,i)=>{const X=x(e.en),up=i%2===0,Y=up?20:80;
    s+=`<line x1="${X}" y1="50" x2="${X}" y2="${up?31:69}" stroke="var(--c-${e.cat})" stroke-width="1.5"/>`+atomSVG(e.sym,X,Y,12)+`<text x="${X+15}" y="${Y+4}" font-size="9.5" fill="#b3a68f">${e.en}</text>`;});
  return `<svg viewBox="0 0 ${W} 104" width="${W}" style="max-width:100%">${s}</svg>`;
}
const SOLT={1:['tag r','💧 წყალში ხსნადი'],0.5:['tag p','💧 მცირედ ხსნადი'],0:['tag t','⬇ უხსნადი — ნალექი']};
function cmpCard(c,zs){
  const sol=c.sol!=null&&SOLT[c.sol]?`<span class="${SOLT[c.sol][0]}">${SOLT[c.sol][1]}</span>`:'';
  const kind=c.alloy?'შენადნობი':c.kind==='acid'?'მჟავა':c.kind==='base'?'ფუძე (ტუტე)':c.kind==='salt'?'მარილი':'';
  return `<div class="cmp"><div><span class="f">${fmt(c.f)}</span><span class="nm">${esc(c.n)}</span></div>
    <div>${c.gen?'<span class="tag p">გენერირებული იონებიდან</span>':'<span class="tag r">რეალური ნაერთი</span>'}${hitTag(c.f,zs)}${c.d?'<span class="tag w">⚠ საშიში / ტოქსიკური</span>':''}${kind?`<span class="tag t">${kind}</span>`:''}${sol}</div>
    ${c.eq&&c.eq!=='—'?`<div class="eq">${eqFmt(c.eq)}</div>`:''}${c.note?`<div class="meta">${esc(c.note)}</div>`:''}
    ${c.alloy?'':`<div class="meta">მოლური მასა ${massOf(c.f).toFixed(2)} გ/მოლი · შედგენილობა: ${compo(c.f)}</div>`}
    ${c.smi?`<div class="mol">${drawSmiles(c.smi)}</div>`:''}</div>`;
}
let LAZY={};
function listBlock(id,arr,zs,first){
  if(!arr.length)return '';
  const a=arr.slice(0,first),b=arr.slice(first);LAZY[id]={b,zs};
  return a.map(c=>cmpCard(c,zs)).join('')+(b.length?`<details class="more" data-lazy="${id}"><summary>კიდევ ${b.length} ნაერთი</summary><div></div></details>`:'');
}
function pairData(A,B){const key=[A,B].sort((x,y)=>x.z-y.z).map(e=>e.sym).join('|');
  if(R[key]!==undefined)return R[key].length?{list:R[key].map(r=>({f:r[0],n:r[1]})),cur:1}:{none:'არ რეაგირებს'};
  const p=predict(A,B);return p.none?{none:p.none}:{list:p.list};}
function reactMulti(uniq,zs){
  const out=$('out'),E=uniq.map(z=>EL[z]),S=new Set(E.map(e=>e.sym));LAZY={};
  const sortF=(a,b)=>(hitTag(b.f,zs)?1:0)-(hitTag(a.f,zs)?1:0)||b.els.length-a.els.length||(a.smi?0:1)-(b.smi?0:1);
  const known=MC.filter(c=>c.els.length>=3&&c.els.every(s=>S.has(s))).sort(sortF);
  const kk=new Set(known.map(c=>c.key));
  const gens=genIonic(E,S).filter(c=>!kk.has(ckey(c.f))).map(c=>({...c,gen:1})).sort(sortF);
  const noble=E.filter(e=>e.cat==='noble'),synth=E.filter(e=>e.synth);
  const cat=E.filter(e=>e.en!=null).sort((a,b)=>a.en-b.en);
  let h=`<div class="panel"><h3>⚗ ${E.map(e=>esc(e.ka)).join(' + ')}</h3>
    <div class="minis">${E.map(e=>`<div class="mini" style="--cc:var(--c-${e.cat})"><b>${e.sym}</b><span>${esc(e.ka)}</span><small>EN ${e.en??'—'} · ${e.ox.length?e.ox.map(x=>x>0?'+'+x:x).join(', '):'—'}</small></div>`).join('')}</div>
    <div class="sec"><h4>⚖ ელექტროუარყოფითობის სკალა</h4><div class="mol">${enScale(E)}</div>
    <div class="bond">${cat.length>1?`ყველაზე ძლიერად ელექტრონებს <b>${esc(cat[cat.length-1].ka)}</b> იზიდავს (EN ${cat[cat.length-1].en}) — ნაერთებში ის უარყოფითი ნაწილი იქნება; ყველაზე ადვილად <b>${esc(cat[0].ka)}</b> გასცემს (EN ${cat[0].en}) — დადებითი ნაწილი. ΔEN = ${(cat[cat.length-1].en-cat[0].en).toFixed(2)} → ${cat[cat.length-1].en-cat[0].en>=1.7?'იონური ბმები (მარილები, კრისტალები)':cat[cat.length-1].en-cat[0].en>=0.4?'პოლარული კოვალენტური ბმები (მოლეკულები)':'თითქმის არაპოლარული ბმები'}.`:''}
    ${noble.length?`<br>${noble.map(e=>esc(e.ka)).join(', ')} — ინერტული აირი, ნაერთებში თითქმის არ მონაწილეობს.`:''}${synth.length?`<br>${synth.map(e=>esc(e.ka)).join(', ')} — ზემძიმე სინთეზური ელემენტი, ქიმია შეუსწავლელია.`:''}</div></div>`;
  h+=`<div class="sec"><h4>📚 ცნობილი ნაერთები ამ ელემენტებიდან (${known.length})</h4>${known.length?listBlock('k',known,zs,6):'<div class="meta">ბაზაში ამ ელემენტების სამ- ან მეტელემენტიანი ნაერთი არ არის.</div>'}</div>`;
  if(gens.length)h+=`<div class="sec"><h4>🧪 მარილები, მჟავები და ფუძეები იონებიდან (${gens.length})</h4><div class="hint" style="margin-bottom:4px">აწყობილია რეალური იონებიდან მუხტების ბალანსით: კატიონი (ლითონი ან NH₄⁺) + ანიონი (SO₄²⁻, NO₃⁻, CO₃²⁻, PO₄³⁻, OH⁻ …). განტოლება — ნეიტრალიზაცია: ფუძე + მჟავა → მარილი + წყალი.</div>${listBlock('g',gens,zs,6)}</div>`;
  /* every pair */
  let pr='';for(let i=0;i<E.length;i++)for(let j=i;j<E.length;j++){if(i===j)continue;const A=E[i],B=E[j],p=pairData(A,B);
    pr+=`<div class="prow"><b class="cf">${A.sym} + ${B.sym}</b><span>${p.none?'<span class="hint">'+esc(p.none.length>60?'არ რეაგირებს':p.none)+'</span>':p.list.slice(0,3).map(c=>`<span class="cf" style="color:var(--gold-lt)">${fmt(c.f)}</span> <span class="hint">${esc(c.n)}</span>`).join(' · ')}</span><button type="button" data-p="${A.z},${B.z}">გახსნა ›</button></div>`;}
  h+=`<div class="sec"><h4>🔗 ყველა წყვილი (${E.length*(E.length-1)/2})</h4>${pr}</div>`;
  if(S.has('C')&&S.has('H')){CH.el='C';CH.fgs=Object.keys(FG).filter(k=>FG[k].need.every(s=>S.has(s)));if(CH.fg&&!CH.fgs.includes(CH.fg))CH.fg='';
    h+=chainPanel('C','ნახშირბადის ჯაჭვს დამატებითი ელემენტები ფუნქციურ ჯგუფებად ებმება — ასე იქმნება სპირტები, მჟავები, ამინები… აირჩიე ჯგუფი და ჯაჭვის სიგრძე.');}
  h+=`<p class="hint" style="margin-top:10px">რიგი არ აქვს მნიშვნელობა. ერთი და იგივე ელემენტის რამდენჯერმე ჩაგდებით თანაფარდობას მიუთითებ (მაგ. H + H + O) — შესაბამისი ნაერთი 🎯 ნიშნით გამოიყოფა.</p></div>`;
  out.innerHTML=h;wireChain();
  out.querySelectorAll('details[data-lazy]').forEach(d=>d.addEventListener('toggle',()=>{const box=d.querySelector('div');if(d.open&&!box.innerHTML){const L=LAZY[d.dataset.lazy];box.innerHTML=L.b.map(c=>cmpCard(c,L.zs)).join('');}}));
  out.querySelectorAll('.prow button').forEach(b=>b.onclick=()=>{SLOT=b.dataset.p.split(',').map(Number);drawSlots();react();});
}
function react(){
  const out=$('out');cancelAnimationFrame(RAF);
  const zs=SLOT.filter(Boolean);
  if(!zs.length){out.style.display='none';return;}
  out.style.display='block';
  const uniq=[...new Set(zs)].sort((a,b)=>a-b);
  if(zs.length===1){out.innerHTML=`<div class="panel"><h3>ელემენტი</h3>${elCard(EL[zs[0]])}<p class="hint" style="margin-top:8px">ჩააგდე მეორე ელემენტიც (ან იგივე) რეაქციის სანახავად — შეგიძლია 8-მდე ელემენტი.</p></div>`;return;}
  if(uniq.length<=2)reactPair(EL[uniq[0]],EL[uniq[1]||uniq[0]],zs);else reactMulti(uniq,zs);
  const r=out.getBoundingClientRect();if(r.top>innerHeight*0.6)out.scrollIntoView({behavior:'smooth',block:'start'});
}

/* tooltip */
pt.addEventListener('mousemove',ev=>{const el=ev.target.closest('.el');const tip=$('tip');if(!el||DRAG){tip.style.display='none';return;}const e=EL[+el.dataset.z];
  tip.innerHTML=`<b>${e.z} ${e.sym} — ${esc(e.ka)}</b><br>${CATN[e.cat]} · ${e.m}<br><span class="cf">${cfgText(e.z)}</span>`;tip.style.display='block';tip.style.left=Math.min(innerWidth-250,ev.clientX+14)+'px';tip.style.top=(ev.clientY+14)+'px';});
pt.addEventListener('mouseleave',()=>{$('tip').style.display='none';});
drawTable();drawSlots();
</script>
