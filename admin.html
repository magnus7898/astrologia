<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGNUS — პანელი</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--void:#04030a;--surface:rgba(15,13,42,.85);--raised:#161228;
    --gold:#c9a84c;--gold-l:#f0d080;--txt:#e6e0d4;--dim:#9ba8b8;
    --brd:rgba(122,90,34,.45);--ok:#30c890;--bad:#e05050;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);color:var(--txt);font-family:'Noto Sans Georgian',sans-serif;
    min-height:100vh;padding:30px 16px 70px;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-family:'Cinzel',serif;font-size:18px;letter-spacing:6px;text-transform:uppercase;
    color:var(--gold-l);text-align:center;margin-bottom:6px;}
  .sub{text-align:center;font-size:11px;color:var(--dim);margin-bottom:26px;}
  .panel{background:var(--surface);border:1px solid var(--brd);border-radius:10px;
    padding:18px;margin-bottom:16px;}
  label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--dim);margin-bottom:4px;}
  input,select{width:100%;background:rgba(8,6,18,.8);border:1px solid var(--brd);
    border-radius:6px;color:var(--txt);padding:9px 11px;font-size:13px;
    font-family:inherit;outline:none;}
  input:focus{border-color:var(--gold);}
  button{background:linear-gradient(135deg,#8a6a20,var(--gold));border:none;color:#0a0810;
    padding:9px 18px;border-radius:6px;font-family:'Cinzel',serif;font-size:12px;
    letter-spacing:1.5px;cursor:pointer;font-weight:600;}
  button:hover{filter:brightness(1.12);}
  button.ghost{background:none;border:1px solid var(--brd);color:var(--gold-l);font-weight:400;}
  button.danger{background:none;border:1px solid rgba(224,80,80,.5);color:#f08080;}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .row>div{flex:1;min-width:120px;}
  /* card list */
  .item{display:flex;align-items:center;gap:12px;padding:11px 13px;margin-bottom:8px;
    background:var(--raised);border:1px solid var(--brd);border-radius:8px;
    cursor:grab;transition:border-color .15s,opacity .15s;}
  .item.dragging{opacity:.4;}
  .item.hidden-card{opacity:.45;}
  .item:hover{border-color:rgba(201,168,76,.7);}
  .grip{color:var(--dim);font-size:14px;cursor:grab;}
  .sym{font-size:20px;width:28px;text-align:center;}
  .info{flex:1;min-width:0;}
  .info .t{font-size:14px;}
  .info .h{font-size:10.5px;color:var(--dim);font-family:monospace;}
  .toggle{width:42px;height:22px;border-radius:11px;border:1px solid var(--brd);
    background:rgba(8,6,18,.8);position:relative;cursor:pointer;flex-shrink:0;}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
    border-radius:50%;background:var(--dim);transition:left .18s,background .18s;}
  .toggle.on{border-color:var(--ok);}
  .toggle.on::after{left:21px;background:var(--ok);}
  .msg{font-size:12px;padding:9px 12px;border-radius:6px;margin-bottom:12px;display:none;}
  .msg.ok{display:block;background:rgba(48,200,144,.12);color:var(--ok);}
  .msg.err{display:block;background:rgba(224,80,80,.12);color:#f08080;}
  #login{max-width:340px;margin:60px auto;}
  #app{display:none;}
  .note{font-size:10.5px;color:var(--dim);line-height:1.7;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>პანელი</h1>
  <div class="sub">მთავარი გვერდის ბარათების მართვა</div>

  <div id="msg" class="msg"></div>

  <!-- login -->
  <div id="login" class="panel">
    <div style="margin-bottom:12px"><label>ელფოსტა</label><input id="email" type="email" autocomplete="username"></div>
    <div style="margin-bottom:14px"><label>პაროლი</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button style="width:100%" onclick="login()">შესვლა</button>
    <div class="note">საჭიროა ადმინის ანგარიში (role = admin).</div>
  </div>

  <!-- app -->
  <div id="app">
    <div class="panel">
      <div style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;
        color:var(--gold);text-transform:uppercase;margin-bottom:14px">ბარათები</div>
      <div id="list"></div>
      <div class="note">გადაათრიეთ რიგის შესაცვლელად · ჩამრთველი მალავს/აჩენს ბარათს ·
        ცვლილება მაშინვე ჩანს მთავარ გვერდზე</div>
    </div>

    <div class="panel">
      <div style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;
        color:var(--gold);text-transform:uppercase;margin-bottom:14px">ახალი ბარათი</div>
      <div class="row" style="margin-bottom:10px">
        <div><label>Key (ლათინურად)</label><input id="n-key" placeholder="tarot"></div>
        <div><label>სათაური</label><input id="n-title" placeholder="ტარო"></div>
        <div><label>ქვესათაური</label><input id="n-sub" placeholder="Tarot"></div>
      </div>
      <div class="row" style="margin-bottom:12px">
        <div><label>ფაილი</label><input id="n-href" placeholder="tarot.html"></div>
        <div style="max-width:90px"><label>სიმბოლო</label><input id="n-sym" placeholder="✦"></div>
        <div style="max-width:120px"><label>ფერი</label><input id="n-col" value="#c9a84c"></div>
      </div>
      <button onclick="addCard()">დამატება</button>
      <button class="ghost" onclick="loadCards()">განახლება</button>
    </div>
  </div>
</div>

<script>
const BACKEND='https://astrology-production-b165.up.railway.app';
let TOKEN=localStorage.getItem('magnus_admin_token')||'';
let CARDS=[];

function msg(t,ok){const m=document.getElementById('msg');
  m.textContent=t;m.className='msg '+(ok?'ok':'err');
  setTimeout(()=>{m.className='msg';},3500);}

async function api(path,opts={}){
  const r=await fetch(BACKEND+path,{...opts,
    headers:{'Content-Type':'application/json',
             ...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}),...(opts.headers||{})}});
  if(r.status===401||r.status===403){logout();throw new Error('ავტორიზაცია საჭიროა');}
  if(!r.ok)throw new Error('შეცდომა '+r.status);
  return r.json();
}

async function login(){
  try{
    const r=await fetch(BACKEND+'/api/login',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:document.getElementById('email').value.trim(),
                           password:document.getElementById('pw').value})});
    const d=await r.json();
    if(!r.ok||!d.token)throw new Error(d.error||'შესვლა ვერ მოხერხდა');
    TOKEN=d.token;localStorage.setItem('magnus_admin_token',TOKEN);
    showApp();loadCards();
  }catch(e){msg(e.message,false);}
}
function logout(){TOKEN='';localStorage.removeItem('magnus_admin_token');
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='block';}
function showApp(){document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';}

async function loadCards(){
  try{
    const d=await api('/api/admin/cards');
    CARDS=d.cards||[];render();
  }catch(e){msg(e.message,false);}
}

function render(){
  const list=document.getElementById('list');
  list.innerHTML=CARDS.map(c=>`
    <div class="item${c.visible?'':' hidden-card'}" draggable="true" data-id="${c.id}">
      <span class="grip">⋮⋮</span>
      <span class="sym" style="color:${c.color}">${c.symbol||'✦'}</span>
      <span class="info">
        <span class="t" contenteditable onblur="editField(${c.id},'title',this.textContent)">${c.title}</span>
        <div class="h" contenteditable onblur="editField(${c.id},'href',this.textContent)">${c.href}</div>
      </span>
      <span class="toggle${c.visible?' on':''}" onclick="toggle(${c.id},${!c.visible})"></span>
      <button class="danger" onclick="delCard(${c.id},'${c.title}')">✕</button>
    </div>`).join('');
  wireDrag();
}

async function editField(id,field,val){
  const c=CARDS.find(x=>x.id===id);
  if(!c||c[field]===val.trim())return;
  try{await api('/api/admin/cards/'+id,{method:'PUT',
    body:JSON.stringify({[field]:val.trim()})});
    c[field]=val.trim();msg('შენახულია',true);
  }catch(e){msg(e.message,false);}
}
async function toggle(id,vis){
  try{await api('/api/admin/cards/'+id,{method:'PUT',body:JSON.stringify({visible:vis})});
    const c=CARDS.find(x=>x.id===id);if(c)c.visible=vis;render();
    msg(vis?'ბარათი ჩანს':'ბარათი დამალულია',true);
  }catch(e){msg(e.message,false);}
}
async function delCard(id,title){
  if(!confirm('წავშალო "'+title+'"?'))return;
  try{await api('/api/admin/cards/'+id,{method:'DELETE'});
    CARDS=CARDS.filter(c=>c.id!==id);render();msg('წაიშალა',true);
  }catch(e){msg(e.message,false);}
}
async function addCard(){
  const body={key:val('n-key'),title:val('n-title'),subtitle:val('n-sub'),
    href:val('n-href'),symbol:val('n-sym')||'✦',color:val('n-col')||'#c9a84c'};
  if(!body.key||!body.title){msg('key და სათაური საჭიროა',false);return;}
  try{const c=await api('/api/admin/cards',{method:'POST',body:JSON.stringify(body)});
    CARDS.push(c);render();
    ['n-key','n-title','n-sub','n-href','n-sym'].forEach(i=>document.getElementById(i).value='');
    msg('დაემატა',true);
  }catch(e){msg(e.message,false);}
}
const val=id=>document.getElementById(id).value.trim();

/* drag to reorder */
function wireDrag(){
  const list=document.getElementById('list');
  let dragged=null;
  list.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('dragstart',()=>{dragged=el;el.classList.add('dragging');});
    el.addEventListener('dragend',async()=>{
      el.classList.remove('dragging');
      const order=[...list.querySelectorAll('.item')].map(x=>+x.dataset.id);
      try{await api('/api/admin/cards/order',{method:'POST',body:JSON.stringify({order})});
        CARDS.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
        msg('რიგი შენახულია',true);
      }catch(e){msg(e.message,false);}
    });
    el.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragged||dragged===el)return;
      const r=el.getBoundingClientRect();
      const after=(e.clientY-r.top)/r.height>0.5;
      list.insertBefore(dragged,after?el.nextSibling:el);
    });
  });
}

if(TOKEN){showApp();loadCards();}
</script>
</body>
</html>
