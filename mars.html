<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>პლანეტების კალენდარი</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@300;400;600&family=IM+Fell+English:ital@0;1&family=Noto+Sans+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#c2542a;--primary-rgb:194,84,42;--secondary:#f08050;--accent:#e0a850;
  --text:#f0ddc8;--dim:rgba(200,160,130,0.55);--glow:rgba(194,84,42,0.25);
  --bg:#0a0503;--dust:#e8b07a;
  --globe-grad:radial-gradient(circle at 34% 30%,#f0a070 0%,#c2542a 45%,#6a2410 78%,#2a0e05 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Georgian',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 80px;
  overflow-x:hidden;position:relative;transition:background 0.8s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.5) 0,transparent 100%),
  radial-gradient(1px 1px at 31% 42%,rgba(255,255,255,.3) 0,transparent 100%),
  radial-gradient(1px 1px at 58% 11%,rgba(255,255,255,.4) 0,transparent 100%),
  radial-gradient(1px 1px at 79% 33%,rgba(255,255,255,.45) 0,transparent 100%),
  radial-gradient(1px 1px at 44% 77%,rgba(255,255,255,.3) 0,transparent 100%),
  radial-gradient(1px 1px at 88% 62%,rgba(255,255,255,.35) 0,transparent 100%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 700px 420px at 25% 15%,var(--glow) 0,transparent 70%),
  radial-gradient(ellipse 520px 520px at 82% 72%,rgba(var(--primary-rgb),0.13) 0,transparent 70%);
  transition:all 0.8s}
.hero{position:relative;z-index:1;text-align:center;padding:38px 24px 14px;width:100%}
.globe{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--globe-grad);
  box-shadow:0 0 30px var(--glow),inset -6px -6px 14px rgba(0,0,0,.6);
  position:relative;transition:all 0.8s}
.globe::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse 22px 8px at 30% 22%,rgba(255,255,255,.32) 0,transparent 70%)}
.globe.saturn::after,.globe.uranus::after{content:'';position:absolute;width:150%;height:26%;
  border:2px solid rgba(var(--primary-rgb),0.45);border-radius:50%;
  top:37%;left:-25%;transform:rotateX(72deg);pointer-events:none}
.globe.uranus::after{transform:rotateZ(80deg) rotateX(70deg)}
.hero-eyebrow{font-size:9px;letter-spacing:7px;text-transform:uppercase;color:var(--secondary);opacity:.6;margin-bottom:10px;font-family:'Cinzel',serif}
.hero-title{font-family:'Cinzel Decorative',serif;font-size:clamp(20px,4vw,36px);letter-spacing:3px;
  background:linear-gradient(160deg,#ffd9b0 0%,var(--secondary) 35%,#8a3818 62%,#f0c090 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:all 0.8s}
.hero-sub{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:var(--dim);margin-top:8px}
.planet-bar{position:relative;z-index:1;display:flex;gap:6px;padding:10px 16px;overflow-x:auto;
  scrollbar-width:none;max-width:100%;margin-bottom:6px}
.planet-bar::-webkit-scrollbar{display:none}
.planet-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 10px;
  border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(20,10,5,0.55);
  cursor:pointer;transition:all 0.3s;min-width:74px;flex-shrink:0}
.planet-btn:hover{border-color:var(--primary);background:rgba(30,15,8,0.8)}
.planet-btn.active{border-color:var(--primary);background:rgba(40,20,10,0.9);box-shadow:0 0 15px var(--glow)}
.mini{width:28px;height:28px;border-radius:50%}
.planet-btn span{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-family:'Cinzel',serif}
.tab-bar{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:14px auto 0;padding:0 16px;max-width:700px;width:100%}
.tab-btn{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(var(--primary-rgb),0.75);background:rgba(20,8,4,.6);border:1px solid rgba(var(--primary-rgb),0.3);
  border-radius:20px;padding:8px 18px;cursor:pointer;transition:all .25s;white-space:nowrap}
.tab-btn:hover{color:var(--secondary);border-color:rgba(var(--primary-rgb),0.6)}
.tab-btn.active{color:#160804;background:linear-gradient(135deg,var(--secondary),var(--primary));box-shadow:0 2px 14px var(--glow)}
.panel{position:relative;z-index:1;width:100%;max-width:1020px;padding:0 16px;margin-top:18px}
.section{display:none}.section.active{display:block}
.card{background:rgba(20,8,4,.72);border:1px solid rgba(var(--primary-rgb),0.26);border-radius:14px;
  padding:18px;margin-bottom:14px;transition:border-color 0.8s}
.card-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--secondary);opacity:.85;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid rgba(var(--primary-rgb),0.18)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--secondary);opacity:.7;font-family:'Cinzel',serif}
input{background:rgba(14,6,3,.7);border:1px solid rgba(var(--primary-rgb),0.35);border-radius:8px;
  color:var(--text);padding:9px 12px;font-size:13px;font-family:'Noto Sans Georgian',sans-serif;width:100%}
input:focus{outline:none;border-color:var(--secondary);box-shadow:0 0 0 3px rgba(var(--primary-rgb),0.15)}
.btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#160804;border:none;border-radius:9px;
  padding:11px 22px;font-size:12px;cursor:pointer;letter-spacing:2px;font-family:'Cinzel',serif;font-weight:600;transition:all 0.3s}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.ghost{background:none;border:1px solid rgba(var(--primary-rgb),0.45);color:var(--secondary)}
.clock{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:rgba(40,16,8,.45);border:1px solid rgba(var(--primary-rgb),0.22);border-radius:12px;padding:14px;text-align:center;transition:border-color 0.8s}
.tile-k{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-family:'Cinzel',serif}
.tile-v{font-family:'Cinzel',serif;font-size:24px;color:var(--secondary);margin-top:6px;letter-spacing:1px}
.tile-s{font-size:10px;color:var(--dim);margin-top:3px}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.month{background:rgba(20,8,4,.68);border:1px solid rgba(var(--primary-rgb),0.2);border-radius:11px;overflow:hidden}
.month.now{border-color:var(--primary);box-shadow:0 0 14px var(--glow)}
.month-head{padding:7px 11px;background:rgba(var(--primary-rgb),0.09);border-bottom:1px solid rgba(var(--primary-rgb),0.18);
  display:flex;justify-content:space-between;align-items:baseline}
.month-name{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:1.2px;color:var(--dust)}
.month-num{font-size:8.5px;color:var(--dim);font-family:'Cinzel',serif}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:7px}
.dow{font-size:7.5px;text-align:center;color:rgba(200,160,130,.4);font-family:'Cinzel',serif;padding-bottom:2px}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#e8ceb0;border-radius:4px}
.day:hover{background:rgba(var(--primary-rgb),0.15)}
.day.today{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#160804;font-weight:700}
.day.bday{outline:2px solid #f0c060;color:#f0c060;font-weight:700}
.day.leap{background:rgba(224,168,80,.2);color:var(--accent);border:1px solid rgba(224,168,80,.4)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);padding:6px 10px;text-align:left;font-weight:400;font-size:9px;
  text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(var(--primary-rgb),0.2)}
td{padding:6px 10px;border-bottom:1px solid rgba(30,14,6,.9)}
tr:last-child td{border-bottom:none}
tr.now td{background:rgba(var(--primary-rgb),0.12)}
.bar{height:16px;border-radius:4px;position:relative;overflow:hidden;background:rgba(var(--primary-rgb),0.13);min-width:70px}
.barfill{position:absolute;inset:0;background:linear-gradient(90deg,var(--primary),var(--secondary))}
.result{background:rgba(60,24,10,.34);border-left:3px solid var(--primary);border-radius:8px;padding:14px 16px;margin-top:12px;font-size:13px;line-height:2}
.big{font-family:'Cinzel',serif;font-size:25px;color:var(--secondary);letter-spacing:2px}
.k{color:var(--dim);font-size:11px;letter-spacing:1px}
.v{color:var(--dust);font-weight:600}
.note{font-size:10px;color:rgba(200,160,130,.45);line-height:1.7;margin-top:10px}
.warn{background:rgba(224,168,80,.12);border-left:3px solid var(--accent);border-radius:8px;padding:12px 15px;margin-top:12px;font-size:12px;line-height:1.9}
.season{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;margin-left:6px}
</style>
</head>
<body>

<div class="hero">
  <div class="globe" id="globe"></div>
  <div class="hero-eyebrow">მზის სისტემის დრო</div>
  <h1 class="hero-title" id="h-title">პლანეტების კალენდარი</h1>
  <p class="hero-sub" id="h-sub">აირჩიეთ პლანეტა</p>
</div>

<div class="planet-bar" id="pbar"></div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="now">🕐 ახლა პლანეტაზე</button>
  <button class="tab-btn" data-tab="year">📅 პლანეტური წელი</button>
  <button class="tab-btn" data-tab="bday">🎂 პლანეტური ასაკი</button>
</div>

<div class="panel">
  <div id="tab-now" class="section active">
    <div class="card">
      <div class="card-title">🕐 პლანეტური დრო</div>
      <div class="clock">
        <div class="tile"><div class="tile-k" id="l-time">ადგილობრივი დრო</div>
          <div class="tile-v" id="c-time">--:--:--</div><div class="tile-s" id="l-tsub">—</div></div>
        <div class="tile"><div class="tile-k">სოლი ეპოქიდან</div>
          <div class="tile-v" id="c-sol">—</div><div class="tile-s">J2000-დან</div></div>
        <div class="tile"><div class="tile-k">Ls მზის გრძედი</div>
          <div class="tile-v" id="c-ls">—</div><div class="tile-s">ასტრონომიული</div></div>
        <div class="tile"><div class="tile-k">პლანეტური წელი</div>
          <div class="tile-v" id="c-yr">—</div><div class="tile-s">წელი 0 = 2000</div></div>
      </div>
      <div class="result" style="margin-top:14px">
        <div class="big" id="c-date">—</div>
        <div><span class="k">კვირის დღე:</span> <span class="v" id="c-dow">—</span></div>
        <div><span class="k">სეზონი (ჩრდ. ნახევარსფერო):</span> <span id="c-season"></span></div>
        <div><span class="k">დედამიწაზე:</span> <span class="v" id="c-earth">—</span></div>
      </div>
      <div id="c-warn"></div>
      <div class="note" id="c-note"></div>
    </div>
  </div>

  <div id="tab-year" class="section">
    <div class="card">
      <div class="card-title">⚙ წელი</div>
      <div class="row">
        <div class="field" style="max-width:130px"><label>წელი</label><input type="number" id="y-year" value="0"></div>
        <button class="btn" id="y-go">✦ ჩვენება ✦</button>
        <button class="btn ghost" id="y-now">↻ მიმდინარე</button>
      </div>
      <div class="note" id="y-info"></div>
    </div>
    <div class="card">
      <div class="card-title" id="y-title">📅 კალენდარი</div>
      <div id="y-body"></div>
      <div class="note" id="y-note"></div>
    </div>
  </div>

  <div id="tab-bday" class="section">
    <div class="card">
      <div class="card-title">🎂 შენი ასაკი პლანეტაზე</div>
      <div class="row">
        <div class="field"><label>დღე</label><input type="number" id="b-d" value="1" min="1" max="31"></div>
        <div class="field"><label>თვე</label><input type="number" id="b-m" value="1" min="1" max="12"></div>
        <div class="field"><label>წელი</label><input type="number" id="b-y" value="1990"></div>
        <div class="field"><label>საათი</label><input type="number" id="b-h" value="12" min="0" max="23"></div>
        <button class="btn" id="b-go">🚀 გამოთვლა</button>
      </div>
      <div id="b-out"></div>
    </div>
  </div>
</div>

/* ── astronomy ── */
const jdOf=function(ms){return ms/86400000+2440587.5;};
const crossV=function(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];};
const dot=function(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];};
const unit=function(v){const n=Math.hypot(v[0],v[1],v[2]);return[v[0]/n,v[1]/n,v[2]/n];};
function helio(k,T){
  const e0=KEP[k];
  const a=e0[0]+e0[6]*T,e=e0[1]+e0[7]*T,I=(e0[2]+e0[8]*T)*D2R,
        L=e0[3]+e0[9]*T,vp=e0[4]+e0[10]*T,Om=(e0[5]+e0[11]*T)*D2R;
  let M=norm(L-vp)*D2R; if(M>Math.PI)M-=2*Math.PI;
  let E=M; for(let i=0;i<10;i++)E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  const xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const w=(vp*D2R)-Om,cw=Math.cos(w),sw=Math.sin(w),
        cO=Math.cos(Om),sO=Math.sin(Om),ci=Math.cos(I),si=Math.sin(I);
  return[(cw*cO-sw*sO*ci)*xp+(-sw*cO-cw*sO*ci)*yp,
         (cw*sO+sw*cO*ci)*xp+(-sw*sO+cw*cO*ci)*yp,(sw*si)*xp+(cw*si)*yp];
}
function Ls(p,J){                       /* true solar longitude */
  const T=(J-2451545.0)/36525,e0=KEP[p];
  const i=(e0[2]+e0[8]*T)*D2R,Om=(e0[5]+e0[11]*T)*D2R;
  const n=[Math.sin(i)*Math.sin(Om),-Math.sin(i)*Math.cos(Om),Math.cos(i)];
  const r=ROT[p],a0=(r[0]+r[1]*T)*D2R,d0=(r[2]+r[3]*T)*D2R;
  const pe=[Math.cos(d0)*Math.cos(a0),Math.cos(d0)*Math.sin(a0),Math.sin(d0)];
  const pol=[pe[0],pe[1]*Math.cos(EPS)+pe[2]*Math.sin(EPS),-pe[1]*Math.sin(EPS)+pe[2]*Math.cos(EPS)];
  const eq=unit(crossV(pol,n)),ey=unit(crossV(n,eq));
  const o=helio(p,T),s=[-o[0],-o[1],-o[2]];
  return norm(Math.atan2(dot(s,ey),dot(s,eq))*R2D);
}
/* ── civil calendar ── */
const yLen=function(p,y){return C[p].base+(isLeap(p,y)?1:0);};
function isLeap(p,y){const f=C[p].frac;
  return Math.floor((y+1)*f)>Math.floor(y*f);}
function monLens(p,y){
  const c=C[p],L=c.mon.slice();
  if(isLeap(p,y)){                       /* extra sol to the longest month */
    let bi=0; for(let i=1;i<c.monf.length;i++)if(c.monf[i]>c.monf[bi])bi=i;
    L[bi]++;
  }
  return L;
}
function solOf(p,ms){return (jdOf(ms)-2451545.0)/C[p].Psol;}
function calDate(p,ms){
  let n=Math.floor(solOf(p,ms)),y=0;
  if(n>=0){for(;;){const L=yLen(p,y);if(n<L)break;n-=L;y++;}}
  else{while(n<0){y--;n+=yLen(p,y);}}
  const L=monLens(p,y);let m=0;
  while(m<L.length-1&&n>=L[m]){n-=L[m];m++;}
  return{y:y,m:m,d:n+1,dow:((Math.floor(solOf(p,ms))%7)+7)%7,sol:Math.floor(solOf(p,ms))};
}
const fmtN=function(x,d){return (+x).toLocaleString('ka-GE',
  {minimumFractionDigits:d||0,maximumFractionDigits:d||0});};

  $('c-sol').textContent=fmtN(Math.floor(solF));
  const J=jdOf(ms),ls=Ls(cur,J);

  const sp=Math.max.apply(null,c.monf)/Math.min.apply(null,c.monf);
  $('y-note').innerHTML='თვე = მზის გრძედის '+(360/c.nmon).toFixed(0)+'° რკალი — თვეები სეზონებზეა მიბმული. '+
    'კეპლერის მე-2 კანონით ისინი არათანაბარია: ყველაზე გრძელი/ყველაზე მოკლე = <b>'+sp.toFixed(2)+'×</b>. '+
    'ნაკიანობა: floor((y+1)·f) > floor(y·f), f='+c.frac.toFixed(6)+' — გრძელვადიანი ცდომილება &lt; 0.001 სოლი/წელი.';
}
function calcAge(){
  const bd=new Date(Date.UTC(+$('b-y').value,+$('b-m').value-1,+$('b-d').value,+$('b-h').value));
  if(isNaN(bd.getTime())){$('b-out').innerHTML='<div class="result">⚠ არასწორი თარიღი</div>';return;}
  const p=P[cur],c=C[cur],now=Date.now();
  const days=(now-bd.getTime())/86400000;
  const age=days/c.Porb,sols=days/c.Psol;
  const bc=calDate(cur,bd.getTime());bmark={m:bc.m,d:bc.d};
  const bls=Ls(cur,jdOf(bd.getTime())),se=SEASON[Math.floor(bls/90)];
  const nx=Math.ceil(age),nxMs=bd.getTime()+nx*c.Porb*86400000;
  const toNx=Math.round((nxMs-now)/86400000);
  $('b-out').innerHTML='<div class="result">'+
    '<div class="big">'+age.toFixed(age<10?3:2)+' '+p.ka+'ული წელი</div>'+
    '<div class="k" style="margin-bottom:6px">დედამიწაზე '+(days/365.2425).toFixed(2)+' წელი</div>'+
    (c.sols>=10?'<div><span class="k">დაბადება '+p.ka+'ურად:</span> <span class="v">'+
      p.mon[bc.m]+' '+bc.d+', წელი '+bc.y+'</span> <span class="k">('+p.monEn[bc.m]+')</span></div>':'')+
    '<div><span class="k">Ls '+bls.toFixed(1)+'°</span><span class="season" style="background:'+se[1]+
      '22;color:'+se[1]+';border:1px solid '+se[1]+'55">'+se[0]+'</span></div>'+
    '<div><span class="k">ნაცხოვრები სოლები:</span> <span class="v">'+fmtN(sols,sols<100?2:0)+'</span></div>'+
    '<div><span class="k">მე-'+nx+' დაბადების დღე:</span> <span class="v">'+
      new Date(nxMs).toLocaleDateString('ka-GE',{dateStyle:'long'})+'</span> <span class="k">· '+
      (toNx>0?fmtN(toNx)+' დღეში':'გავიდა')+'</span></div></div>'+
    (c.Porb>3650?'<div class="note">⚠ '+p.ka+'ის წელი '+(c.Porb/365.25).toFixed(1)+
      ' დედამიწის წელია — პირველ დაბადების დღემდე ადამიანი ვერ მიაღწევდა.</div>':'');
  if(tab==='year')renderYear();
}
document.querySelectorAll('.tab-btn').forEach(function(b){
  b.onclick=function(){setTab(b.dataset.tab);};});
$('y-go').onclick=renderYear; $('y-now').onclick=thisYear; $('b-go').onclick=calcAge;
initBar();select('mars');
(function(){const n=new Date();$('b-d').value=n.getUTCDate();$('b-m').value=n.getUTCMonth()+1;})();
timer=setInterval(tick,1000);
