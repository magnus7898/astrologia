<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>მომხმარებლები — MAGNUS ადმინი</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Cinzel:wght@400;600&family=Noto+Serif+Georgian:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1222;--card:rgba(17,26,46,.72);--brd:rgba(184,137,74,.3);--gold:#E3BE84;--gold2:#B8894A;--txt:#EDE6D8;--dim:#BCC0CA;--bad:#e88a8a;--good:#7fd1a8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:14px/1.45 'Noto Serif Georgian',system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font:400 22px "Marcellus SC",serif;color:var(--gold);margin:0;flex:1}
header a{color:var(--dim);font-size:13px;text-decoration:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button,.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 13px;border-radius:2px;border:1px solid var(--brd);color:var(--dim);font-size:13px}
.tabs button.on{background:rgba(184,137,74,.15);color:var(--gold);border-color:var(--gold2)}
.btn{border-radius:2px;color:var(--gold)}
.btn.pri{background:var(--gold2);color:#0C1222;border-color:var(--gold2);font-weight:600}
.card{background:var(--card);border:1px solid var(--brd);border-radius:2px;padding:14px;margin-bottom:12px;min-width:0}
.card h2{font:500 14px 'Noto Serif Georgian',sans-serif;color:var(--gold);margin:0 0 10px}
input,select{background:#0C1222;border:1px solid var(--brd);border-radius:2px;padding:7px 9px;color:var(--txt);font:inherit}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--brd);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid rgba(184,137,74,.08);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(184,137,74,.08)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:10.5px;letter-spacing:.06em;border:1px solid var(--gold2);color:var(--gold);border-radius:2px;padding:0 5px}
.ok{color:var(--good)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:rgba(12,18,34,.6);border:1px solid rgba(184,137,74,.18);border-radius:2px;padding:10px}
.stat b{display:block;font:400 22px "Marcellus SC",serif;color:var(--gold)}
.stat span{color:var(--dim);font-size:12px}
.tl .d{color:var(--gold);font-size:12px;margin:12px 0 4px}
.tl .s{color:var(--dim);font-size:11px;margin:8px 0 2px;border-top:1px dashed rgba(184,137,74,.2);padding-top:4px}
.tl .e{display:grid;grid-template-columns:62px 92px 150px 1fr;gap:8px;padding:3px 0;font-size:12.5px;border-bottom:1px solid rgba(184,137,74,.06)}
.tl .e .a{color:var(--gold)}
.tl .e .x{color:var(--dim);overflow-wrap:anywhere}
.bar{height:8px;background:var(--gold2);border-radius:2px;opacity:.7}
.login{max-width:360px;margin:60px auto}
.login label{display:block;font-size:11px;color:var(--dim);margin:10px 0 4px}
.login input{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:700px){.tl .e{grid-template-columns:52px 1fr}.tl .e .x,.tl .e .p{grid-column:1/-1}}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),radial-gradient(ellipse 1100px 520px at 50% -12%,rgba(123,147,189,.10),transparent 70%),radial-gradient(ellipse 800px 600px at 50% 115%,rgba(184,137,74,.06),transparent 70%)}
.wrap{position:relative;z-index:1}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>მომხმარებლები</h1><a href="admin.html">ბარათები</a><a href="admin_articles.html">სტატიები</a><a href="index.html">საიტი</a></header>
  <div id="app"></div>
</div>
<script src="account.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=()=>window.MAGNUS;
let TAB='users',Q='',DETAIL=null;
const SITE=['astro.html','matrix.html','hd.html','pythagoras.html','numerology.html','name.html','vedic.html','vedictrop.html','true_sidereal.html','planeta.html','asteroid.html',
  'tarot.html','cards.html','compat.html','bazi.html','ziwei.html','tibet.html','celtic.html','Tzolkin.html','iching.html','genekeys.html','kabbalah.html','hdastro.html','sky.html','skycal.html',
  'moon.html','fengshui.html','stones.html','stats.html','calendars.html','calendar13.html','mars.html','frequency.html','bio.html','games.html','systems.html'];
const api=(p,o)=>M().api(p,o);

function loginView(msg){
  $('app').innerHTML=`<div class="card login"><h2>ადმინის შესვლა</h2><form id="lf"><label for="le">ელფოსტა</label><input id="le" type="email" required autocomplete="email">
    <label for="lp">პაროლი</label><input id="lp" type="password" required autocomplete="current-password"><div class="row" style="margin-top:14px"><button class="btn pri" type="submit">შესვლა</button></div>
    <div class="bad" id="lm" style="margin-top:8px;font-size:13px">${esc(msg||'')}</div></form></div>`;
  $('lf').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/account/login',{method:'POST',body:{email:$('le').value,password:$('lp').value,device:M().DEVICE},noLogout:true});
    M().setSession(d.token,d.user);if(d.user.role!=='admin')return loginView('ეს ანგარიში ადმინი არ არის');draw();}catch(x){$('lm').textContent=x.message;}};
}
function draw(){
  const u=M().user;if(!u||u.role!=='admin')return loginView(u?'ეს ანგარიში ადმინი არ არის':'');
  if(DETAIL)return detail(DETAIL);
  $('app').innerHTML=`<div class="tabs">${[['users','მომხმარებლები'],['stats','სტატისტიკა'],['anon','ანონიმური ვიზიტები'],['features','Pro გვერდები']].map(([k,t])=>`<button type="button" data-t="${k}" class="${k===TAB?'on':''}">${t}</button>`).join('')}</div><div id="pane"><div class="card">⏳</div></div>`;
  $('app').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;draw();});
  ({users,stats,anon,features})[TAB]().catch(x=>{$('pane').innerHTML=`<div class="card bad">${esc(x.message)}</div>`;});
}
async function users(){
  const list=await api('/api/admin/accounts'+(Q?'?q='+encodeURIComponent(Q):''));
  $('pane').innerHTML=`<div class="card"><div class="row" style="margin-bottom:10px"><form id="sf" class="row"><input id="sq" placeholder="ძიება: ელფოსტა ან სახელი" value="${esc(Q)}" style="min-width:240px"><button class="btn" type="submit">ძიება</button></form><span class="dim">${list.length}</span></div>
    <div class="scroll"><table><tr><th>#</th><th>ელფოსტა</th><th>სახელი</th><th>გეგმა</th><th>✉</th><th class="num">ხალხი</th><th class="num">შენახ.</th><th class="num">ნაბიჯები</th><th>ბოლოს</th><th>რეგისტრ.</th></tr>
    ${list.map(u=>`<tr class="click" data-u="${u.id}"><td class="dim">${u.id}</td><td>${esc(u.email)}${u.role==='admin'?' <span class="pill">ADMIN</span>':''}</td><td>${esc(u.name)}</td>
      <td>${u.plan==='pro'?'<span class="pill">PRO</span>'+(u.plan_until?' <span class="dim">'+u.plan_until.slice(0,10)+'</span>':''):'<span class="dim">free</span>'}</td>
      <td>${u.verified?'<span class="ok">✓</span>':'<span class="dim">—</span>'}</td><td class="num">${u.people}</td><td class="num">${u.saved}</td><td class="num">${u.activity}</td>
      <td class="dim">${u.last_seen?esc(u.last_seen.slice(0,16)):'—'}</td><td class="dim">${esc(u.created.slice(0,10))}</td></tr>`).join('')}</table></div></div>`;
  $('sf').onsubmit=e=>{e.preventDefault();Q=$('sq').value.trim();draw();};
  $('pane').querySelectorAll('[data-u]').forEach(r=>r.onclick=()=>{DETAIL=+r.dataset.u;draw();});
}
function timeline(acts){
  let h='',day='',ses='';
  for(const a of acts){const d=a.t.slice(0,10);if(d!==day){day=d;ses='';h+=`<div class="d">${d}</div>`;}
    if(a.session!==ses){ses=a.session;h+=`<div class="s">სესია ${esc((ses||'').slice(0,8))}${a.device?' · მოწყობილობა '+esc(a.device.slice(0,8)):''}</div>`;}
    const det=a.detail&&typeof a.detail==='object'?Object.entries(a.detail).filter(([k,v])=>v!==null&&v!=='').map(([k,v])=>`${esc(k)}=${esc(String(v).slice(0,60))}`).join(' · '):'';
    h+=`<div class="e"><span class="dim">${a.t.slice(11,19)}</span><span class="a">${esc(a.action)}</span><span class="p">${esc(a.page)}</span><span>${esc(a.target)}${det?`<div class="x">${det}</div>`:''}</span></div>`;}
  return h||'<div class="dim">აქტივობა არ არის.</div>';
}
async function detail(id){
  $('app').innerHTML='<div class="card">⏳</div>';
  const d=await api('/api/admin/accounts/'+id+'?limit=1500'),u=d.user;
  $('app').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn" type="button" id="bk">← სია</button><h2 style="margin:0;color:var(--gold);font-weight:500">${esc(u.email)}</h2></div>
    <div class="grid" style="margin-bottom:12px">
      <div class="stat"><b>${u.plan==='pro'?'PRO':'free'}</b><span>${u.plan_until?'ვადა '+esc(u.plan_until.slice(0,10)):'გეგმა'}</span></div>
      <div class="stat"><b>${d.people.length}</b><span>ადამიანი</span></div><div class="stat"><b>${d.saved.length}</b><span>შენახული</span></div>
      <div class="stat"><b>${d.activity.length}</b><span>ნაბიჯი (ბოლო 1500)</span></div><div class="stat"><b>${d.payments.length}</b><span>გადახდა</span></div></div>
    <div class="card"><h2>მართვა</h2><div class="row">
      <select id="pl"><option value="free" ${u.plan==='free'?'selected':''}>free</option><option value="pro" ${u.plan==='pro'?'selected':''}>pro</option></select>
      <select id="dy"><option value="">ვადის გარეშე</option><option value="30">30 დღე</option><option value="90">90 დღე</option><option value="365">1 წელი</option></select>
      <button class="btn pri" type="button" id="sp">გეგმის შენახვა</button>
      <label class="row" style="gap:5px"><input type="checkbox" id="vf" ${u.verified?'checked':''}> ელფოსტა დადასტურებული</label>
      <select id="rl"><option value="user" ${u.role==='user'?'selected':''}>user</option><option value="admin" ${u.role==='admin'?'selected':''}>admin</option></select>
      <span id="am" class="dim"></span></div>
      <div class="dim" style="margin-top:8px;font-size:12.5px">სახელი: ${esc(u.name)||'—'} · რეგისტრაცია ${esc(u.created.slice(0,10))} · ბოლოს ${d.last_seen?esc(d.last_seen.slice(0,16)):'—'}</div></div>
    <div class="card"><h2>ხალხი</h2><div class="scroll"><table><tr><th>სახელი</th><th>თარიღი</th><th>დრო</th><th>ქალაქი</th><th>შენიშვნა</th></tr>${d.people.map(p=>`<tr><td>${p.is_self?'⭐ ':''}${esc(p.name)}</td><td>${p.day}.${p.month}.${p.year}</td><td>${p.time_unknown?'—':p.hour+':'+String(p.minute).padStart(2,'0')}</td><td>${esc(p.city)}</td><td class="dim">${esc(p.note)}</td></tr>`).join('')||'<tr><td colspan="5" class="dim">—</td></tr>'}</table></div></div>
    <div class="card"><h2>შენახული</h2><div class="scroll"><table><tr><th>სათაური</th><th>გვერდი</th><th>ჩანართი</th><th>განახლდა</th></tr>${d.saved.map(s=>`<tr><td>${esc(s.title)}</td><td>${esc(s.page)}</td><td class="dim">${esc(s.tab)}</td><td class="dim">${esc(s.updated.slice(0,16))}</td></tr>`).join('')||'<tr><td colspan="4" class="dim">—</td></tr>'}</table></div></div>
    <div class="card"><h2>გადახდები</h2><div class="scroll"><table><tr><th>თანხა</th><th>პროდუქტი</th><th>სტატუსი</th><th>დრო</th></tr>${d.payments.map(p=>`<tr><td>${p.amount} ${esc(p.currency)}</td><td>${esc(p.product)}</td><td>${esc(p.status)}</td><td class="dim">${esc(p.t.slice(0,16))}</td></tr>`).join('')||'<tr><td colspan="4" class="dim">—</td></tr>'}</table></div></div>
    <div class="card"><h2>ყოველი ნაბიჯი (UTC)</h2><div class="tl">${timeline(d.activity)}</div></div>`;
  $('bk').onclick=()=>{DETAIL=null;draw();};
  const save=async body=>{try{await api('/api/admin/accounts/'+id,{method:'PATCH',body});$('am').className='ok';$('am').textContent='შენახულია';setTimeout(()=>detail(id),600);}catch(x){$('am').className='bad';$('am').textContent=x.message;}};
  $('sp').onclick=()=>save({plan:$('pl').value,days:$('dy').value?+$('dy').value:null});
  $('vf').onchange=()=>save({verified:$('vf').checked});
  $('rl').onchange=()=>save({role:$('rl').value});
}
async function stats(){
  const[a,s7]=await Promise.all([api('/api/admin/activity/stats?days=30'),api('/api/admin/activity/stats?days=7')]);
  const mx=Math.max(1,...a.pages.map(p=>p.n));
  $('pane').innerHTML=`<div class="grid" style="margin-bottom:12px">
      <div class="stat"><b>${a.events}</b><span>ნაბიჯი · 30 დღე</span></div><div class="stat"><b>${a.devices}</b><span>მოწყობილობა · 30 დღე</span></div>
      <div class="stat"><b>${a.users}</b><span>შესული მომხმარებელი · 30 დღე</span></div><div class="stat"><b>${s7.events}</b><span>ნაბიჯი · 7 დღე</span></div></div>
    <div class="card"><h2>გვერდების ნახვები · 30 დღე</h2><div class="scroll"><table>${a.pages.map(p=>`<tr><td style="width:180px">${esc(p.page)}</td><td><div class="bar" style="width:${(p.n/mx*100).toFixed(1)}%"></div></td><td class="num" style="width:60px">${p.n}</td></tr>`).join('')||'<tr><td class="dim">—</td></tr>'}</table></div></div>
    <div class="card"><h2>ქმედებები · 30 დღე</h2><div class="scroll"><table>${a.actions.map(x=>`<tr><td>${esc(x.action)}</td><td class="num">${x.n}</td></tr>`).join('')}</table></div></div>`;
}
async function anon(){
  const acts=await api('/api/admin/activity?anon=1&limit=800');
  $('pane').innerHTML=`<div class="card"><h2>ანონიმური ვიზიტები (ბოლო 800 ნაბიჯი)</h2><p class="dim" style="margin:0 0 8px;font-size:12.5px">როცა ვიზიტორი დარეგისტრირდება ან შევა, მისი მოწყობილობის წინა ნაბიჯები ავტომატურად მის ანგარიშს მიებმება.</p><div class="tl">${timeline(acts)}</div></div>`;
}
async function features(){
  const list=await api('/api/admin/features');const on=new Set(list.filter(f=>f.pro_only).map(f=>f.key.toLowerCase()));
  $('pane').innerHTML=`<div class="card"><h2>რომელი გვერდი სჭირდება Pro-ს</h2><p class="dim" style="margin:0 0 10px;font-size:12.5px">მონიშნული გვერდი უფასო ანგარიშისთვის დაბლოკილია (ადმინს ყველაფერი ხელმისაწვდომია). ცვლილება მოქმედებს 10 წუთში.</p>
    <div class="grid">${SITE.map(p=>`<label class="row stat" style="gap:8px;cursor:pointer"><input type="checkbox" data-k="${esc(p)}" ${on.has(p.toLowerCase())?'checked':''}> ${esc(p)}</label>`).join('')}</div>
    <div class="row" style="margin-top:12px"><input id="fk" placeholder="სხვა გვერდი, მაგ. directions" style="min-width:220px"><input id="ft" placeholder="სათაური"><button class="btn" type="button" id="fa">დამატება</button><span id="fm" class="dim"></span></div></div>`;
  const byKey=k=>list.find(f=>f.key.toLowerCase()===k.toLowerCase());
  $('pane').querySelectorAll('[data-k]').forEach(c=>c.onchange=async()=>{const k=c.dataset.k,f=byKey(k);
    try{if(c.checked)await api('/api/admin/features',{method:'POST',body:{key:k,title:k.replace('.html',''),pro_only:true}});else if(f)await api('/api/admin/features/'+f.id,{method:'DELETE'});
      try{sessionStorage.removeItem('magnus_feat');}catch(e){}$('fm').className='ok';$('fm').textContent='შენახულია';}catch(x){$('fm').className='bad';$('fm').textContent=x.message;c.checked=!c.checked;}});
  $('fa').onclick=async()=>{const k=$('fk').value.trim();if(!k)return;try{await api('/api/admin/features',{method:'POST',body:{key:k,title:$('ft').value||k,pro_only:true}});features();}catch(x){$('fm').className='bad';$('fm').textContent=x.message;}};
}
document.addEventListener('magnus:user',()=>draw());
function boot(){if(!window.MAGNUS)return setTimeout(boot,50);draw();}
boot();
})();
</script>
</body>
</html>
