<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>პიროვნების ტიპები</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Noto+Sans+Georgian:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#06050f;--surface:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.07);--gold:#c8a96e;--gold-dim:rgba(200,169,110,0.3);--text:#e8e2d5;--muted:rgba(232,226,213,0.42);--vio:#9b7fe8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Georgian',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 15% 20%,rgba(60,35,120,.28) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 85% 75%,rgba(20,55,80,.22) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 55% 45%,rgba(70,20,50,.15) 0%,transparent 55%)}
.page{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:56px 20px 100px}
.page-header{text-align:center;margin-bottom:40px}
.eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin-bottom:14px;opacity:.8}
.page-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(34px,7vw,54px);line-height:1.05}
.page-title em{font-style:italic;color:rgba(232,226,213,.5)}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
.ornament-line{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.ornament-line.r{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.ornament-dot{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);opacity:.6}
.lead{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.85;max-width:620px;margin:0 auto 26px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px}
.h{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.88;margin-bottom:14px}
.note{font-size:11.5px;color:var(--muted);line-height:1.8}
.note b{color:rgba(200,169,110,.9);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.in,.sel{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans Georgian',sans-serif;font-size:13px;padding:9px 11px;outline:none}
.in:focus,.sel:focus{border-color:rgba(200,169,110,.4)}
.sel option{background:#14121f}
.in.date{font-family:'Cinzel',serif;letter-spacing:2px;width:160px;text-align:center;font-size:15px}
.in.time{font-family:'Cinzel',serif;letter-spacing:2px;width:96px;text-align:center;font-size:15px}
.btn{padding:10px 24px;background:linear-gradient(135deg,rgba(155,127,232,.2),rgba(120,100,200,.1));border:1px solid rgba(155,127,232,.3);border-radius:8px;color:var(--text);font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .25s}
.btn:hover{border-color:rgba(155,127,232,.6);box-shadow:0 0 22px rgba(155,127,232,.2)}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.pill{padding:8px 18px;border-radius:20px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.02);transition:all .25s;user-select:none}
.pill:hover{color:var(--text)}
.pill.active{color:var(--gold);border-color:rgba(200,169,110,.5);background:rgba(200,169,110,.07)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:'Cinzel',serif;font-weight:400;font-size:9px;letter-spacing:1.5px;color:var(--muted);padding:7px 5px;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.035);vertical-align:top}
.tbl tr.now td{background:rgba(200,169,110,.07)}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv>div{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.kv .k{font-size:9.5px;letter-spacing:1.5px;color:var(--muted);font-family:'Cinzel',serif;text-transform:uppercase}
.kv .v{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);line-height:1.25}
.kv .t{font-size:11.5px;color:rgba(232,226,213,.62);line-height:1.55}
.txt{font-size:13.5px;font-weight:300;line-height:1.85;color:rgba(232,226,213,.78)}
.txt b{color:var(--text);font-weight:500}
.big{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:46px;line-height:1.1;color:var(--gold);text-align:center}
.sub{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.5px}
.hidden{display:none!important}
.err{color:#e87f7f;font-size:12px;text-align:center;margin-top:10px}
@media(max-width:600px){.page{padding:40px 14px 80px}.in.date{width:140px}}

.q{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.q .qt{font-size:13.5px;line-height:1.6;margin-bottom:8px}
.q .qt span{color:var(--muted);font-size:11px;margin-right:6px}
.lik{display:flex;gap:6px;flex-wrap:wrap}
.lik label,.opt label{cursor:pointer;border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:11.5px;color:var(--muted);transition:all .2s;user-select:none}
.lik input,.opt input{display:none}
.lik input:checked+span,.opt input:checked+span{color:var(--gold)}
.lik label:has(input:checked),.opt label:has(input:checked){border-color:rgba(200,169,110,.6);background:rgba(200,169,110,.08)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{border-radius:10px;text-align:left}
.bar{display:flex;align-items:center;gap:10px;margin:5px 0}
.bar .n{width:170px;font-size:12.5px}
.bar .b{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .b i{display:block;height:100%;border-radius:5px;background:var(--gold)}
.bar .v{width:44px;text-align:right;font-size:12px;color:var(--muted)}
.prog{position:sticky;top:0;z-index:5;background:rgba(6,5,15,.92);backdrop-filter:blur(6px);padding:8px 0;margin-bottom:8px;font-size:11px;color:var(--muted);text-align:center}
.dich{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:600px){.bar .n{width:120px}.dich{grid-template-columns:1fr}}
</style>
</head>

</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* calendar convention (MAGNUS): Julian before 15.10.1582, Gregorian after */
const isLeap=y=>y<1582?y%4===0:(y%4===0&&y%100!==0)||y%400===0;
const dimOf=(y,m)=>[31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];
/* Gregorian (proleptic) → Julian Day Number */
function jdn(y,m,d){if(y*10000+m*100+d<15821015){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-32083;}const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function parseDate(v,ymin,ymax){
  v=(v||'').trim();const m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{1,4})$/);if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3];if(y<(ymin||1)||y>(ymax||9999)||mo<1||mo>12||d<1||d>dimOf(y,mo))return null;
  return{d,m:mo,y,dd:String(d).padStart(2,'0'),mm:String(mo).padStart(2,'0'),yyyy:String(y).padStart(4,'0')};
}
function parseTime(v){v=(v||'').trim();if(!v)return null;const m=v.match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return undefined;const h=+m[1],mi=+m[2];if(h>23||mi>59)return undefined;return{h,mi};}
function maskDate(inp){inp.addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);if(v.length>5)v=v.slice(0,5)+'/'+v.slice(5,9);e.target.value=v;});}
function maskTime(inp){inp.addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2)+':'+v.slice(2,4);e.target.value=v;});}
const fmtD=p=>p.dd+'/'+p.mm+'/'+p.yyyy;

const dsum=n=>String(Math.abs(n)).split('').reduce((a,b)=>a+ +b,0);

/* ═════ ENNEAGRAM ═════ */
const ENN_Q=[
[1,'მაღიზიანებს, როცა რამე არასწორად ან უწესრიგოდ კეთდება.'],[1,'ხშირად ვაკრიტიკებ საკუთარ თავს — შინაგანი ხმა მეუბნება, რა გავაკეთე ცუდად.'],[1,'მნიშვნელოვანია, რომ ყოველთვის სწორად და პატიოსნად მოვიქცე.'],[1,'ძნელად ვისვენებ, სანამ საქმე სრულყოფილად არ დასრულდება.'],
[2,'ბუნებრივად ვგრძნობ, რა სჭირდებათ სხვებს, და ვეხმარები.'],[2,'მწყინს, როცა ჩემს ზრუნვას არ აფასებენ.'],[2,'ჩემთვის მნიშვნელოვანია, რომ მიყვარდეთ და ვჭირდებოდე.'],[2,'საკუთარ საჭიროებებზე თქმა მიჭირს — სხვებზე ზრუნვა უფრო ადვილია.'],
[3,'წარმატება და მიღწევები ჩემთვის ძალიან მნიშვნელოვანია.'],[3,'ადვილად ვერგები გარემოს და ვიცი, როგორ წარვადგინო თავი.'],[3,'მიყვარს მიზნების დასახვა და შედეგის დანახვა.'],[3,'წარუმატებლობა ჩემთვის განსაკუთრებით მტკივნეულია.'],
[4,'ხშირად ვგრძნობ, რომ სხვებისგან განსხვავებული ვარ და ბოლომდე არავის ესმის ჩემი.'],[4,'ღრმა ემოციები, მელანქოლიაც კი, ჩემი ცხოვრების ნაწილია.'],[4,'ავთენტურობა და თვითგამოხატვა ჩემთვის უმთავრესია.'],[4,'ხშირად მენატრება ის, რაც არ მაქვს.'],

[9,'კონფლიქტს ვერიდები და მშვიდობა მირჩევნია.'],[9,'ადვილად ვხედავ ყველა მხარის სიმართლეს.'],[9,'ზოგჯერ ჩემს სურვილებს ვივიწყებ და სხვებს მივყვები.'],[9,'მიჭირს დაწყება — „მერე გავაკეთებ“ ხშირი ფრაზაა ჩემთვის.'],

[5,'მირჩევნია ბევრი ვიცოდე, ვიდრე ბევრი მქონდეს.'],[5,'სხვების ემოციური მოთხოვნები მღლის.'],
[6,'ხშირად ვამოწმებ ადამიანებს, სანამ ვენდობი.'],[6,'შიშის წინაშე ან ვიმალები, ან პირიქით — პირდაპირ ვუტევ.'],
[7,'ბევრ გეგმას ვაწყობ, რომ ტკივილს ავარიდო თავი.'],[7,'მიჭირს ერთ რამეზე დიდხანს ფოკუსირება.'],
[8,'ვიცი, რა მინდა, და ვიღებ — ნებართვის გარეშე.'],[8,'ადამიანების ძალას ვამოწმებ — ვინ დამიდგება წინ.'],
[9,'მიმდინარეობას მივყვები, რომ ვინმე არ გავანაწყენო.'],[9,'სიმშვიდისთვის ზოგჯერ ვერ ვამჩნევ საკუთარ ბრაზს.']];

    h=`<p class="lead"><b>სოციონიკა</b> (აუშრა აუგუსტინავიჩიუტე, იუნგის ტიპების საფუძველზე) — 16 ტიპი და მათ შორის ურთიერთობები. ყოველ წყვილში აირჩიე, რომელი უფრო გგავს.</p>
    <div class="card"><div class="prog" id="prog"></div>`+ORDER.map((qi,i)=>`<div class="q"><div class="qt"><span>${i+1}.</span></div><div class="dich opt">${[1,2].map(v=>`<label><input type="radio" name="q${qi}" value="${v-1}"><span>${SOC_Q[qi][v]}</span></label>`).join('')}</div></div>`).join('')+
    `<div class="row" style="margin-top:16px"><button class="btn" id="go">შედეგი</button></div><div class="err" id="err"></div></div>`;}
  $('panel').innerHTML=h;
  const total=TAB==='enn'?ENN_Q.length+INST_Q.length:TAB==='dosha'?DOSHA_Q.length+VIK_Q.length:SOC_Q.length;
  const upd=()=>{const n=document.querySelectorAll('#panel input:checked').length;$('prog').textContent=`პასუხი ${n} / ${total}`;};upd();
  document.querySelectorAll('#panel input').forEach(i=>i.onchange=upd);
  $('go').onclick=()=>{const n=document.querySelectorAll('#panel input:checked').length;if(n<total){$('err').textContent=`უპასუხე ყველა კითხვას (${total-n} დარჩა).`;return;}$('err').textContent='';
    ({enn:resEnn,dosha:resDosha,soc:resSoc})[TAB]();$('out').scrollIntoView({behavior:'smooth'});};
}
const val=qi=>+document.querySelector(`#panel input[name=q${qi}]:checked`).value;
const valN=n=>+document.querySelector(`#panel input[name=${n}]:checked`).value;
function bars(items){const mx=Math.max(...items.map(i=>i[1]));return items.map(i=>`<div class="bar"><span class="n" style="${i[2]?'color:'+i[2]:''}">${i[0]}</span><div class="b"><i style="width:${mx?i[1]/mx*100:0}%;${i[2]?'background:'+i[2]:''}"></i></div><span class="v">${i[3]||Math.round(i[1])}</span></div>`).join('');}
function resEnn(){
  const S=Array(10).fill(0);ENN_Q.forEach((q,qi)=>S[q[0]]+=val(qi));
  const rank=[1,2,3,4,5,6,7,8,9].sort((a,b)=>S[b]-S[a]),t=rank[0];
  const wl=t===1?9:t-1,wr=t===9?1:t+1,w=S[wl]>=S[wr]?wl:wr;
  const tri=[[8,9,1],[2,3,4],[5,6,7]].map(g=>g.sort((a,b)=>S[b]-S[a])[0]).sort((a,b)=>S[b]-S[a]);
  const IS={sp:0,so:0,sx:0};INST_Q.forEach((q,i)=>IS[q[0]]+=valN('i'+i));const ist=Object.keys(IS).sort((a,b)=>IS[b]-IS[a]);const D=ENN_D[t];
  $('out').innerHTML=`<div class="card" style="text-align:center"><div class="big">${t}w${w} ${ist[0]}/${ist[1]}</div><div class="sub">${ENN[t][0]} · ფრთა ${w} (${ENN[w][0]}) · ინსტინქტი: ${INST[ist[0]][0]}</div></div>
   <div class="card"><div class="kv"><div><div class="k">ძირითადი სურვილი</div><div class="t" style="font-size:13px">${D[0]}</div></div><div><div class="k">ძირითადი შიში</div><div class="t" style="font-size:13px">${D[1]}</div></div><div><div class="k">საუკეთესოში</div><div class="t" style="font-size:13px;color:#7fcf8f">${D[2]}</div></div><div><div class="k">სტრესში</div><div class="t" style="font-size:13px;color:#e8a0a0">${D[3]}</div></div></div>
    <div class="txt" style="margin-top:10px"><b>ზრდის რჩევა:</b> ${D[4]}.</div></div>
   <div class="card"><div class="h">ტიპი ${t} · ${ENN[t][0]}</div><div class="txt">${ENN[t][1]}</div>
    <div class="txt" style="margin-top:10px">ცენტრი: <b>${CENTER[t]}</b> · ზრდის მიმართულება → <b>${ARROW[t][0]} (${ENN[ARROW[t][0]][0]})</b> · სტრესის მიმართულება → <b>${ARROW[t][1]} (${ENN[ARROW[t][1]][0]})</b></div>
    <div class="txt" style="margin-top:10px">ტრიტიპი: <b>${tri.join('-')}</b> — ყოველი ცენტრის წამყვანი ტიპი.</div></div>
   <div class="card"><div class="h">ქულები</div>${bars(rank.map(k=>[`${k} · ${ENN[k][0]}`,S[k],k===t?'#c8a96e':null,S[k]+'/24']))}</div>
   <div class="card"><div class="h">ინსტინქტები</div>${bars(ist.map(k=>[INST[k][0],IS[k],k===ist[0]?'#9b7fe8':null,IS[k]+'/12']))}<div class="txt" style="margin-top:8px">წამყვანი — <b>${INST[ist[0]][0]}</b>: ${INST[ist[0]][1]} ყველაზე სუსტი (ბრმა წერტილი) — ${INST[ist[2]][0]}.</div>
    <div class="note" style="margin-top:8px">თუ ორი ტიპი ახლოსაა, წაიკითხე ორივე აღწერა — ენეაგრამაში საბოლოო ტიპს ადამიანი თავად ამოიცნობს მოტივაციის მიხედვით.</div></div>`;
}
function resDosha(){
  const S=[0,0,0];DOSHA_Q.forEach((q,qi)=>S[val(qi)]++);const tot=S.reduce((a,b)=>a+b,0),pct=S.map(s=>s/tot*100);
  const r=[0,1,2].sort((a,b)=>S[b]-S[a]);const dual=pct[r[0]]-pct[r[1]]<15;
  const name=Math.max(...pct)-Math.min(...pct)<12?'ტრიდოშა (სამა)':dual?`${DOSHA[r[0]][0]}-${DOSHA[r[1]][0]}`:DOSHA[r[0]][0];
  $('out').innerHTML=`<div class="card" style="text-align:center"><div class="big">${name}</div><div class="sub">${r.map(i=>`${DOSHA[i][0]} ${Math.round(pct[i])}%`).join(' · ')}</div></div>
   <div class="card">${bars(r.map(i=>[`${DOSHA[i][0]} · ${DOSHA[i][1]}`,pct[i],DOSHA[i][2],Math.round(pct[i])+'%']))}</div>
   ${r.slice(0,dual?2:1).map(i=>`<div class="card"><div class="h" style="color:${DOSHA[i][2]}">${DOSHA[i][0]}</div><div class="txt">${DOSHA[i][3]}</div></div>`).join('')}
   ${(()=>{const V=[0,0,0];VIK_Q.forEach((q,i)=>V[valN('v'+i)]++);const vt=V.reduce((a,b)=>a+b,0),vp=V.map(x=>x/vt*100);const ex=[0,1,2].map(i=>vp[i]-pct[i]);const k=ex.indexOf(Math.max(...ex));
     return `<div class="card"><div class="h">ვიკრიტი — ამჟამინდელი მდგომარეობა</div>${bars([0,1,2].map(i=>[DOSHA[i][0],vp[i],DOSHA[i][2],Math.round(vp[i])+'% ('+(ex[i]>0?'+':'')+Math.round(ex[i])+')']))}
      <div class="txt" style="margin-top:8px">${ex[k]>12?`<b style="color:${DOSHA[k][2]}">${DOSHA[k][0]}</b> ამჟამად ბუნებრივზე მაღლაა — დისბალანსი; დაბალანსება საჭიროა სწორედ მისთვის:`:'ამჟამინდელი მდგომარეობა ახლოსაა ბუნებრივთან — ბალანსი შენარჩუნებულია. რეკომენდაციები შენი წამყვანი დოშისთვის:'}</div>
      ${(()=>{const d=ex[k]>12?k:r[0],R=DOSHA_REC[d];return `<div class="txt" style="margin-top:6px"><b>კვება:</b> ${R[0]}<br><b>რეჟიმი:</b> ${R[1]}<br><b>მოძრაობა:</b> ${R[2]}<br><b>სანელებლები:</b> ${R[3]}</div>`;})()}</div>`;})()}
   <div class="card note">ეს ტრადიციული აიურვედული თვითშეფასებაა და არა სამედიცინო დიაგნოზი.</div>`;
}
function resSoc(){
  const S={EI:0,NS:0,TF:0,JP:0},C={EI:0,NS:0,TF:0,JP:0};SOC_Q.forEach((q,qi)=>{C[q[0]]++;if(val(qi)===0)S[q[0]]++;});
  const L=(k,a,b)=>S[k]/C[k]>=0.5?a:b;
  const code=L('EI','E','I')+L('NS','N','S')+L('TF','T','F')+L('JP','j','p');
  const T=SOC[code],q=QUADRA[T[0]],du=byCode(DUAL[T[0]]),co=byCode(CONFLICT[T[0]]);
  const dim=[['EI','ექსტრავერსია','ინტროვერსია'],['NS','ინტუიცია','სენსორიკა'],['TF','ლოგიკა','ეთიკა'],['JP','რაციონალობა','ირაციონალობა']];
  $('out').innerHTML=`<div class="card" style="text-align:center"><div class="big">${T[0]}</div><div class="sub">${T[1]} · ${code}</div><div class="txt" style="margin-top:8px">${T[2]}</div></div>
   <div class="card"><div class="h">ოთხი ნიშანი</div>${dim.map(d=>{const p=S[d[0]]/C[d[0]]*100;return `<div class="bar"><span class="n">${d[1]}</span><div class="b"><i style="width:${p}%"></i></div><span class="v" style="width:120px;text-align:left">${Math.round(p)}% ${p>=50?'':'→ '+d[2]}</span></div>`;}).join('')}</div>
   <div class="card"><div class="kv">
    <div><div class="k">კვადრა</div><div class="v">${q}</div><div class="t">${QUADRA_T[q]}</div></div>
    <div><div class="k">დუალი (საუკეთესო პარტნიორი)</div><div class="v">${du[1][0]}</div><div class="t">${du[1][1]} — სრული ურთიერთშევსება</div></div>
    <div><div class="k">კონფლიქტი</div><div class="v" style="color:#e86b6b">${co[1][0]}</div><div class="t">${co[1][1]} — ყველაზე რთული ურთიერთობა</div></div></div></div>
   <div class="card"><div class="h">მოდელი A · ${T[0]}</div><div class="scroll"><table class="tbl"><tr><th>#</th><th>პოზიცია</th><th>ფუნქცია</th></tr>${modelA(T[0]).map((f,i)=>`<tr${i<2?' class="now"':''}><td>${i+1}</td><td>${POS_KA[i]}</td><td>${f} · ${FN_KA[f]}</td></tr>`).join('')}</table></div></div>
   <div class="card"><div class="h">ურთიერთობები 16 ტიპთან</div><div class="scroll"><table class="tbl"><tr><th>ტიპი</th><th>ურთიერთობა</th></tr>${Object.values(SOC).map(v=>{const r=relation(T[0],v[0]);return `<tr><td>${v[0]} · ${v[1]}</td><td style="color:${r[1]}">${r[0]}</td></tr>`;}).join('')}</table></div></div>
   <div class="card"><div class="h">შეთავსება სხვა ტიპთან</div><div class="row"><select class="sel" id="pt">${Object.values(SOC).map(v=>`<option value="${v[0]}">${v[0]} · ${v[1]}</option>`).join('')}</select></div><div class="txt" id="ptr" style="margin-top:10px;text-align:center"></div></div>`;
  const rel=()=>{const p=$('pt').value,me=T[0];const r=relation(me,p);$('ptr').innerHTML=`<b style="color:${r[1]}">${r[0]}</b> — ${r[2]}`;};
  $('pt').onchange=rel;$('pt').value=DUAL[T[0]];rel();
}
build();
</script>
</body>
</html>
