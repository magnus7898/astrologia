<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ტიბეტური ასტროლოგია</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Noto+Sans+Georgian:wght@300;400;500&family=Noto+Serif+Tibetan&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<style>
:root{--bg:#06050f;--surface:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.07);--gold:#c8a96e;--gold-dim:rgba(200,169,110,0.3);--text:#e8e2d5;--muted:rgba(232,226,213,0.42);--vio:#9b7fe8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Georgian',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 15% 20%,rgba(60,35,120,.28) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 85% 75%,rgba(20,55,80,.22) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 55% 45%,rgba(70,20,50,.15) 0%,transparent 55%)}
.page{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:56px 20px 100px}
.page-header{text-align:center;margin-bottom:40px}
.eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin-bottom:14px;opacity:.8}
.page-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(34px,7vw,54px);line-height:1.05}
.page-title em{font-style:italic;color:rgba(232,226,213,.5)}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
.ornament-line{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.ornament-line.r{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.ornament-dot{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);opacity:.6}
.lead{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.85;max-width:620px;margin:0 auto 26px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px}
.h{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.88;margin-bottom:14px}
.note{font-size:11.5px;color:var(--muted);line-height:1.8}
.note b{color:rgba(200,169,110,.9);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.in,.sel{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans Georgian',sans-serif;font-size:13px;padding:9px 11px;outline:none}
.in:focus,.sel:focus{border-color:rgba(200,169,110,.4)}
.sel option{background:#14121f}
.in.date{font-family:'Cinzel',serif;letter-spacing:2px;width:160px;text-align:center;font-size:15px}
.in.time{font-family:'Cinzel',serif;letter-spacing:2px;width:96px;text-align:center;font-size:15px}
.btn{padding:10px 24px;background:linear-gradient(135deg,rgba(155,127,232,.2),rgba(120,100,200,.1));border:1px solid rgba(155,127,232,.3);border-radius:8px;color:var(--text);font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .25s}
.btn:hover{border-color:rgba(155,127,232,.6);box-shadow:0 0 22px rgba(155,127,232,.2)}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.pill{padding:8px 18px;border-radius:20px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.02);transition:all .25s;user-select:none}
.pill:hover{color:var(--text)}
.pill.active{color:var(--gold);border-color:rgba(200,169,110,.5);background:rgba(200,169,110,.07)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:'Cinzel',serif;font-weight:400;font-size:9px;letter-spacing:1.5px;color:var(--muted);padding:7px 5px;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.035);vertical-align:top}
.tbl tr.now td{background:rgba(200,169,110,.07)}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv>div{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.kv .k{font-size:9.5px;letter-spacing:1.5px;color:var(--muted);font-family:'Cinzel',serif;text-transform:uppercase}
.kv .v{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);line-height:1.25}
.kv .t{font-size:11.5px;color:rgba(232,226,213,.62);line-height:1.55}
.txt{font-size:13.5px;font-weight:300;line-height:1.85;color:rgba(232,226,213,.78)}
.txt b{color:var(--text);font-weight:500}
.big{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:46px;line-height:1.1;color:var(--gold);text-align:center}
.sub{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.5px}
.hidden{display:none!important}
.err{color:#e87f7f;font-size:12px;text-align:center;margin-top:10px}
@media(max-width:600px){.page{padding:40px 14px 80px}.in.date{width:140px}}

.tib{font-family:'Noto Serif Tibetan',serif;color:var(--muted);font-size:20px}
.mewa{display:grid;grid-template-columns:repeat(3,64px);gap:5px;justify-content:center;margin:8px auto}
.mewa div{height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:26px;border:1px solid var(--border)}
.mewa div.me{outline:2px solid var(--gold);outline-offset:2px}
.mewa div.yr{box-shadow:inset 0 0 0 2px #7fcfe8}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid}
.rel{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}.rel:last-child{border-bottom:0}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:center}
.form2 label{font-size:10px;color:var(--muted);letter-spacing:1px;display:block;margin-bottom:3px;font-family:'Cinzel',serif}
.form2 .in,.form2 .sel{width:100%}
.elbar{display:flex;align-items:center;gap:10px;margin:5px 0}.elbar .n{width:150px;font-size:12px}.elbar .b{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}.elbar .b i{display:block;height:100%;border-radius:5px}.elbar .v{width:60px;text-align:right;font-size:11.5px;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.pk{display:grid;grid-template-columns:repeat(3,92px);gap:5px;justify-content:center}
.pk div{height:76px;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted)}
.pk div b{font-size:24px;color:var(--text);font-weight:400}
.pk div.me{outline:2px solid var(--gold)}.pk div.ch{box-shadow:inset 0 0 0 2px var(--vio)}
</style>
</head>
<body>
<div class="page">
<header class="page-header">
  <div class="eyebrow">ტიბეტური ასტროლოგია · ནག་རྩིས</div>
  <h1 class="page-title">ელემენტები <em>· მევა · პარხა</em></h1>
  <div class="ornament"><div class="ornament-line"></div><div class="ornament-dot"></div><div class="ornament-line r"></div></div>
</header>
<div class="pills" id="tabs"><div class="pill active" data-v="natal">ნატალური</div><div class="pill" data-v="years">ხუთი ძალა წლებით</div><div class="pill" data-v="mp">მევა · პარხა</div><div class="pill" data-v="compat">შეთავსება</div><div class="pill" data-v="life">სიცოცხლის სტატისტიკა</div></div>

  <div class="form2">

    <div><label>სქესი</label><select class="sel" id="sx"><option value="m">მამრობითი</option><option value="f">მდედრობითი</option></select></div>
    <div><label>დედის ასაკი დაბადებისას</label><input class="in" id="ma" placeholder="არასავალდ." style="text-align:center"></div>
    <div><label>პროგნოზის წელი</label><input class="in" id="yr" style="text-align:center"></div>
    <div><label>პარტნიორი</label><input class="in date" id="d2" placeholder="DD/MM/YYYY" maxlength="10"></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn" id="go">გამოთვლა</button></div>
  <div class="err" id="err"></div>
</div>
<div id="out"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* calendar convention (MAGNUS): Julian before 15.10.1582, Gregorian after */
const isLeap=y=>y<1582?y%4===0:(y%4===0&&y%100!==0)||y%400===0;
const dimOf=(y,m)=>[31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];
/* Gregorian (proleptic) → Julian Day Number */
function jdn(y,m,d){if(y*10000+m*100+d<15821015){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-32083;}const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function parseDate(v,ymin,ymax){
  v=(v||'').trim();const m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{1,4})$/);if(!m)return null;
  const d=+m[1],mo=+m[2],y=+m[3];if(y<(ymin||1)||y>(ymax||9999)||mo<1||mo>12||d<1||d>dimOf(y,mo))return null;
  return{d,m:mo,y,dd:String(d).padStart(2,'0'),mm:String(mo).padStart(2,'0'),yyyy:String(y).padStart(4,'0')};
}
function parseTime(v){v=(v||'').trim();if(!v)return null;const m=v.match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return undefined;const h=+m[1],mi=+m[2];if(h>23||mi>59)return undefined;return{h,mi};}
function maskDate(inp){inp.addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);if(v.length>5)v=v.slice(0,5)+'/'+v.slice(5,9);e.target.value=v;});}
function maskTime(inp){inp.addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2)+':'+v.slice(2,4);e.target.value=v;});}
const fmtD=p=>p.dd+'/'+p.mm+'/'+p.yyyy;
const root9=n=>{n=Math.abs(n);while(n>9)n=String(n).split('').reduce((a,b)=>a+ +b,0);return n;};
const dsum=n=>String(Math.abs(n)).split('').reduce((a,b)=>a+ +b,0);

/* ── Chinese calendar data (Georgian) ── */
const GAN='甲乙丙丁戊己庚辛壬癸',ZHI='子丑寅卯辰巳午未申酉戌亥';
const GAN_KA=['ძია','ი','ბინ','დინ','ვუ','ძი','გენ','სინ','ჟენ','გუი'];
const ZHI_KA=['ძი','ჩოუ','ინ','მაო','ჩენ','ს','ვუ','ვეი','შენ','იოუ','სიუ','ხაი'];
const ANIMAL=['ვირთხა','ხარი','ვეფხვი','კურდღელი','დრაკონი','გველი','ცხენი','თხა','მაიმუნი','მამალი','ძაღლი','ღორი'];
const ANIMAL_EMO=['🐀','🐂','🐅','🐇','🐉','🐍','🐎','🐐','🐒','🐓','🐕','🐖'];
const EL=['ხე','ცეცხლი','მიწა','ლითონი','წყალი'];
const EL_COL=['#7fcf8f','#e86b6b','#d9b36a','#d8dde6','#6fa8e8'];
const EL_ICO=['🌳','🔥','⛰️','⚙️','💧'];
const ganEl=i=>Math.floor(i/2), ganYang=i=>i%2===0;
const ZHI_EL=[4,2,0,0,2,1,1,2,3,3,2,4];
const gi=c=>GAN.indexOf(c), zi=c=>ZHI.indexOf(c);
const elOfChar=c=>{const g=gi(c);if(g>=0)return ganEl(g);const z=zi(c);return z>=0?ZHI_EL[z]:-1;};
/* generating: wood→fire→earth→metal→water→wood ; controlling: wood→earth→water→fire→metal→wood */
const gen=e=>(e+1)%5, ctl=e=>(e+2)%5;
function elRel(a,b){/* relation of b to a */ if(a===b)return'same';if(gen(b)===a)return'mother';if(gen(a)===b)return'child';if(ctl(a)===b)return'wealth';return'enemy';}
const SHISHEN={'比肩':['თანასწორი','მეგობრები, თანატოლები, დამოუკიდებლობა'],'劫财':['სიმდიდრის მძარცველი','კონკურენცია, რისკი, გაბედულება'],
 '食神':['გემრიელი ღმერთი','შემოქმედება, სიამოვნება, ნიჭის რბილი გამოხატვა'],'伤官':['დამაზიანებელი ოფიცერი','მეამბოხე ნიჭი, ორიგინალობა, კრიტიკა'],
 '偏财':['არაპირდაპირი სიმდიდრე','მოულოდნელი შემოსავალი, ბიზნესი, გულუხვობა'],'正财':['პირდაპირი სიმდიდრე','სტაბილური შემოსავალი, ქონება, პრაქტიკულობა'],
 '七杀':['შვიდი მკვლელი','ზეწოლა, ძალაუფლება, გამოწვევა, მეომარი'],'正官':['პირდაპირი ოფიცერი','წესრიგი, სტატუსი, პასუხისმგებლობა, კანონი'],
 '偏印':['არაპირდაპირი რესურსი','ინტუიცია, უჩვეულო ცოდნა, მისტიკა'],'正印':['პირდაპირი რესურსი','მფარველობა, განათლება, დედა, მხარდაჭერა'],'日主':['დღის ოსტატი','შენ თვითონ']};
const NAYIN={'海中金':'ზღვის სიღრმის ოქრო','炉中火':'ქურის ცეცხლი','大林木':'დიდი ტყის ხე','路旁土':'გზისპირა მიწა','剑锋金':'ხმლის პირის ლითონი','山头火':'მთის მწვერვალის ცეცხლი','涧下水':'ხევის წყალი','城头土':'ციხე-კედლის მიწა','白蜡金':'თეთრი ცვილის ლითონი','杨柳木':'ტირიფის ხე','泉中水':'წყაროს წყალი','屋上土':'სახურავის მიწა','霹雳火':'ელვის ცეცხლი','松柏木':'ფიჭვის ხე','长流水':'დიდი მდინარე','沙中金':'ქვიშის ოქრო','砂中金':'ქვიშის ოქრო','山下火':'მთის ძირის ცეცხლი','平地木':'ველის ხე','壁上土':'კედლის მიწა','金箔金':'ოქროს ფურცელი','覆灯火':'ლამპრის ცეცხლი','天河水':'ციური მდინარე','大驿土':'დიდი გზის მიწა','钗钏金':'სამკაულის ოქრო','桑柘木':'თუთის ხე','大溪水':'დიდი ნაკადულის წყალი','沙中土':'ქვიშის მიწა','天上火':'ციური ცეცხლი','石榴木':'ბროწეულის ხე','大海水':'დიდი ზღვის წყალი'};
const nayinEl=s=>{const c=s.slice(-1);return {'金':3,'火':1,'木':0,'土':2,'水':4}[c];};
const HARM=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]], CLASH=[[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
const TRINE=[[8,0,4],[2,6,10],[5,9,1],[11,3,7]];
const STEMCOMB=[[0,5],[1,6],[2,7],[3,8],[4,9]];
const pairIn=(L,a,b)=>L.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
const sameTrine=(a,b)=>a!==b&&TRINE.some(t=>t.includes(a)&&t.includes(b));
function branchRel(a,b){if(a===b)return['იგივე ნიშანი','ერთნაირი ბუნება, მსგავსი რიტმი.','#c8a96e'];
  if(pairIn(HARM,a,b))return['ექვსი ჰარმონია (六合)','ბუნებრივი მიზიდულობა და თანხმობა.','#7fcf8f'];
  if(sameTrine(a,b))return['სამი ჰარმონია (三合)','საერთო ელემენტი და მიზნები — ძლიერი ალიანსი.','#7fcf8f'];
  if(pairIn(CLASH,a,b))return['შეჯახება (冲)','საპირისპირო ძალები — დაძაბულობა, ცვლილება, ვნება.','#e86b6b'];
  return['ნეიტრალური','პირდაპირი კავშირი არ არის.','rgba(232,226,213,.5)'];}
/* true-solar-time equation of time (minutes) */
function eot(y,m,d){const N=Math.round((Date.UTC(y,m-1,d)-Date.UTC(y,0,1))/864e5)+1;const B=2*Math.PI*(N-81)/365;return 9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);}
/* add minutes to a civil date-time (proleptic Gregorian via UTC Date with full year) */
function addMin(y,m,d,h,mi,add){const t=new Date(0);t.setUTCFullYear(y,m-1,d);t.setUTCHours(h,mi,0,0);t.setTime(t.getTime()+add*6e4);return{y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate(),h:t.getUTCHours(),mi:t.getUTCMinutes()};}

    <div class="note" style="text-align:center;margin-top:6px"><span style="color:var(--gold)">ოქროსფერი</span> — დაბადების, <span style="color:#7fcfe8">ცისფერი</span> — ${Y} წლის მევა (${ymw} ${MEWA[ymw][0]})</div>
    <div class="scroll" style="margin-top:10px"><table class="tbl"><tr><th>წელი</th><th>მევა</th><th>ელემენტი</th><th>შენს მევასთან</th></tr>${ml}</table></div></div>
  <div class="card"><div class="h">პარხა (8 ტრიგრამა)</div>
    <div class="pk">${PK_GRID.map(i=>cell(i,j=>(j===bp?'me ':'')+(j===chg?'ch':''))).join('')}</div>
    <div class="txt" style="margin-top:10px">${bp!=null?`დაბადების პარხა (დედის ასაკი ${ma} → ${ma+1}): <b>${PK[bp][1]} ${PK[bp][2]}</b> — ${PK[bp][3]}, ${PK[bp][4]}. <span class="note">(ზიგზაგის მეთოდით: ${PK[bpz][1]} ${PK[bpz][2]})</span>`:'დაბადების პარხისთვის შეიყვანე დედის ასაკი დაბადებისას.'}</div>
    <div class="txt" style="margin-top:6px">ცვალებადი პარხა ${Y} წელს (ასაკი ${age}, ${sx==='m'?'კაცი — ლიდან საათის ისრით':'ქალი — ხამიდან საათის ისრის საწინააღმდეგოდ'}): <b>${PK[chg][1]} ${PK[chg][2]}</b> — ${PK[chg][3]}, ${PK[chg][4]}. ეს მიმართულება წლის განმავლობაში შენთვის „საკუთარია“.</div>
    <div class="note" style="margin-top:6px"><span style="color:var(--gold)">ოქროსფერი</span> — დაბადების, <span style="color:var(--vio)">იისფერი</span> — ცვალებადი პარხა.</div></div>`;
}
function vCompat(r){
  if(!R2)return '<div class="card txt" style="text-align:center">შეიყვანე პარტნიორის თარიღი ზემოთ.</div>';
  const b=R2;let sc=50;const L=[];
  const tr=x=>[[0,4,8],[1,5,9],[2,6,10],[3,7,11]].findIndex(t=>t.includes(x));
  if(r.z===b.z){sc+=6;L.push(['ok','ერთი ცხოველი','მსგავსი ბუნება — მარტივი გაგება.']);}
  else if(tr(r.z)===tr(b.z)){sc+=16;L.push(['ok','ერთი სამკუთხედი','ცხოველები ერთ „ტომში“ არიან — ბუნებრივი მეგობრობა და მხარდაჭერა.']);}
  else if((r.z+6)%12===b.z){sc-=14;L.push(['bad','მოპირდაპირე ცხოველები (დუნ-ძური)','საპირისპირო ენერგიები — ძლიერი მიზიდულობა, მაგრამ კონფლიქტის რისკი.']);}
  const W=[2.5,2,2,1.5,1.5];
  r.F.forEach((e,i)=>{const x=yrel(e,b.F[i]);sc+=x[3]*W[i];L.push([x[3]>0?'ok':x[3]<0?'bad':'warn',`${FN[i][0]}: ${TEL[e]} ↔ ${TEL[b.F[i]]}`,`პარტნიორის ${FN[i][0].split(' · ')[0]} შენთვის — ${x[0]} (${x[1]}).`]);});
  const mx=yrel(MEWA[r.mw][2],MEWA[b.mw][2]);sc+=mx[3]*2;L.push([mx[3]>0?'ok':mx[3]<0?'bad':'warn',`მევა: ${r.mw} ${MEWA[r.mw][0]} ↔ ${b.mw} ${MEWA[b.mw][0]}`,`${mx[0]} — ${mx[1]}.`]);
  sc=Math.max(5,Math.min(97,Math.round(sc)));
  return `<div class="card" style="text-align:center"><div class="big" style="color:${sc>=70?'#7fcf8f':sc>=50?'#c8a96e':'#e86b6b'}">${sc}%</div><div class="sub">${nm(r)} ${ANIMAL_EMO[r.z]} ↔ ${ANIMAL_EMO[b.z]} ${nm(b)}</div></div>
   <div class="card"><div class="h">ფაქტორები</div>${L.map(x=>`<div class="rel"><b style="color:${x[0]==='ok'?'#7fcf8f':x[0]==='bad'?'#e86b6b':'#e8c95a'}">${x[1]}</b><div class="txt">${x[2]}</div></div>`).join('')}</div>`;
}
function vLife(r){
  const cnt=FN.map(()=>REL.map(()=>0)),yearsSc=[];
  for(let a=0;a<=90;a++){const y=r.ly+a;const yi=yearInfo(y);let s=0;r.F.forEach((e,i)=>{const x=yrel(e,yi.F[i]);cnt[i][REL.indexOf(x)]++;s+=x[3];});yearsSc.push([y,a,s,yi]);}
  const cur=new Date().getFullYear();const fut=yearsSc.filter(x=>x[0]>=cur&&x[0]<cur+40);
  const best=[...fut].sort((a,b)=>b[2]-a[2]).slice(0,6),worst=[...fut].sort((a,b)=>a[2]-b[2]).slice(0,6);
  return `<div class="card"><div class="h">0–90 წლის ასაკი: ძალების განაწილება</div>`+FN.map((f,i)=>`<div style="margin:10px 0 4px;font-size:12.5px">${f[0]} ${chip(r.F[i])}</div>`+REL.map((x,j)=>`<div class="elbar"><span class="n" style="color:${x[2]}">${x[0]}</span><div class="b"><i style="width:${cnt[i][j]/91*100}%;background:${x[2]}"></i></div><span class="v">${cnt[i][j]} წ.</span></div>`).join('')).join('')+`</div>
   <div class="card"><div class="h">საუკეთესო წლები (შემდეგი 40 წელი)</div>${best.map(x=>`<div class="rel"><b style="color:#7fcf8f">${x[0]}</b> · ${TEL[ganEl(x[3].g)]}-${AN_KA[x[3].z]} · ასაკი ${x[1]} · ჯამი +${x[2]}</div>`).join('')}</div>
   <div class="card"><div class="h">ყველაზე რთული წლები</div>${worst.map(x=>`<div class="rel"><b style="color:#e86b6b">${x[0]}</b> · ${TEL[ganEl(x[3].g)]}-${AN_KA[x[3].z]} · ასაკი ${x[1]} · ჯამი ${x[2]}</div>`).join('')}</div>`;
}
