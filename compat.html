<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>შეთავსება · MAGNUS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@300;400;600&family=IM+Fell+English:ital@0;1&family=Noto+Sans+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--void:#04030a;--gold:#c9a84c;--gold-l:#e8d5a0;--silver:#9ba8b8;--txt:#e9e2d0;--dim:rgba(155,168,184,.6);
  --card:rgba(10,8,22,.78);--brd:rgba(201,168,76,.18);--m:#7fb2f0;--f:#f08cb8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse 700px 500px at 20% 10%,rgba(100,50,200,.10),transparent 60%),
  radial-gradient(ellipse 600px 500px at 85% 75%,rgba(200,55,130,.08),transparent 60%),var(--void);
  color:var(--txt);font-family:'Noto Sans Georgian',sans-serif;min-height:100vh;padding:0 16px 80px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 41% 8%,rgba(255,255,255,.45),transparent),
  radial-gradient(1px 1px at 77% 13%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 15% 68%,rgba(255,255,255,.35),transparent),
  radial-gradient(1px 1px at 82% 80%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 60% 45%,rgba(255,255,255,.3),transparent)}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.back{display:inline-block;margin-top:22px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--gold);opacity:.7;
  text-decoration:none;border:1px solid rgba(201,168,76,.25);border-radius:3px;padding:7px 12px}
.back:hover{opacity:1}
header{text-align:center;padding:26px 0 26px}
.eyebrow{font-family:'Cinzel',serif;font-size:9px;letter-spacing:7px;color:var(--gold);opacity:.5;margin-bottom:12px}
h1{font-family:'Cinzel Decorative',serif;font-weight:400;font-size:clamp(28px,5vw,46px);letter-spacing:2px;
  background:linear-gradient(160deg,#f5e8ba 0%,var(--gold) 35%,#9a7028 60%,var(--gold-l) 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-family:'IM Fell English',serif;font-style:italic;font-size:13px;color:var(--silver);opacity:.6;margin-top:8px}
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:start}
@media(max-width:820px){.pick{grid-template-columns:1fr}.mid{justify-self:center}}
.pcard{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:16px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.ph b{font-family:'Cinzel',serif;font-weight:400;font-size:10px;letter-spacing:3px;color:var(--gold);opacity:.8}
.gender{display:flex;border:1px solid var(--brd);border-radius:20px;overflow:hidden}
.gender button{background:none;border:none;color:var(--dim);font-family:inherit;font-size:12px;padding:6px 14px;cursor:pointer}
.gender button.on.m{background:rgba(127,178,240,.18);color:var(--m)}
.gender button.on.f{background:rgba(240,140,184,.18);color:var(--f)}
.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:420px){.signs{grid-template-columns:repeat(3,1fr)}}
.sg{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 4px;cursor:pointer;
  color:var(--txt);font-family:inherit;text-align:center;transition:all .2s}
.sg:hover{border-color:rgba(201,168,76,.35)}
.sg.on{border-color:var(--gold);background:rgba(201,168,76,.12);box-shadow:0 0 14px rgba(201,168,76,.15)}
.sg i{display:block;font-style:normal;font-family:serif;font-size:22px;line-height:1.2}
.sg span{display:block;font-size:11px;margin-top:2px}
.sg small{display:block;font-size:8.5px;color:var(--dim);margin-top:1px}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:60px}
.swap{background:none;border:1px solid rgba(201,168,76,.35);color:var(--gold);border-radius:50%;width:46px;height:46px;font-size:18px;cursor:pointer}
.swap:hover{background:rgba(201,168,76,.1)}
.cnt{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:2px;color:var(--dim);text-align:center}
.res{margin-top:22px;background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:22px}
.rh{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{position:relative;width:118px;height:118px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:'Cinzel',serif;font-size:30px;color:var(--gold-l);font-weight:400}
.ring .v small{font-size:9px;color:var(--dim);letter-spacing:1px}
.pair{flex:1;min-width:240px}
.pair h2{font-weight:400;font-size:20px;line-height:1.5}
.pair h2 .g{font-family:serif;font-size:24px}
.pair .tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--brd);color:var(--gold);margin:6px 6px 0 0}
.verdict{font-size:13px;color:var(--gold-l);margin-top:8px}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 22px;margin:20px 0 6px}
.bar{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:8px;font-size:12px}
.bar .t{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:4px}
.bar em{font-style:normal;text-align:right;color:var(--gold-l)}
.sec{border-top:1px solid rgba(201,168,76,.12);padding-top:14px;margin-top:14px}
.sec h3{font-family:'Cinzel',serif;font-weight:400;font-size:10px;letter-spacing:3px;color:var(--gold);opacity:.85;margin-bottom:8px}
.sec p{font-size:13.5px;line-height:1.85;color:#d9d2c2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.prof{background:rgba(255,255,255,.02);border-radius:10px;padding:12px 14px;border-left:3px solid}
.prof h4{font-weight:400;font-size:14px;margin-bottom:6px}
.prof p{font-size:13px}
.kv{font-size:12.5px;line-height:1.8;color:#cfc7b6}
.kv b{color:var(--gold-l);font-weight:400}
.mx{margin-top:22px;background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:18px;overflow-x:auto}
.mx table{border-collapse:separate;border-spacing:3px;margin:0 auto}
.mx th{font-family:serif;font-weight:400;font-size:15px;color:var(--silver);padding:2px}
.mx th.r{color:var(--m)}.mx th.c{color:var(--f)}
.mx td{width:34px;height:28px;text-align:center;font-size:10.5px;border-radius:5px;cursor:pointer;color:#0b0812;font-weight:600}
.mx td.on{outline:2px solid #fff}
.mx .cap{font-size:11px;color:var(--dim);text-align:center;margin-bottom:10px}
.ttl{font-weight:400;font-size:21px;line-height:1.5;margin-bottom:14px;text-align:center}
.ttl .g{font-family:serif;font-size:25px}
.desc p{font-size:15px;line-height:1.95;color:#ddd6c6;margin-bottom:14px;text-indent:1.4em}
.desc p:first-child{text-indent:0;color:var(--gold-l);font-size:16px}
.desc b{font-weight:600;color:var(--gold-l)}
.res{max-width:820px;margin-left:auto;margin-right:auto;padding:28px 30px}
.tth{font-family:'Cinzel',serif;font-weight:400;font-size:10px;letter-spacing:3px;color:var(--gold);text-align:center;margin:22px 0 12px;border-top:1px solid rgba(201,168,76,.15);padding-top:18px}
.tarot{display:flex;gap:18px;align-items:flex-start}
.tarot .tc{flex:0 0 130px}
.tarot .tc img{width:130px;border-radius:8px;border:1px solid rgba(201,168,76,.35);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tarot .tn{font-size:18px;color:var(--gold-l)}
.tarot .tn span{font-size:13px;color:#f0a080}
.tarot .tk{font-size:12px;color:var(--gold);margin:4px 0 8px;opacity:.85}
.tarot p{font-size:14.5px;line-height:1.9;color:#ddd6c6}
.tarot .tw{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.7}
@media(max-width:560px){.tarot{flex-direction:column;align-items:center;text-align:center}}
.note{font-size:10.5px;color:var(--dim);text-align:center;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← მთავარი</a>
  <header>
    <div class="eyebrow">ზოდიაქოს ნიშნები</div>
    <h1>შეთავსება</h1>
    <div class="sub">აირჩიე ორი ნიშანი და სქესი</div>
  </header>

  <div class="pick">
    <div class="pcard" id="pa"></div>
    <div class="mid"><button class="swap" id="swap" title="სქესების შებრუნება">⇄</button><div class="cnt">სქესის<br>შებრუნება</div></div>
    <div class="pcard" id="pb"></div>
  </div>

  <div class="res" id="res"></div>
  <div class="note">ზოდიაქოს შეთავსება მზის ნიშნებს ეყრდნობა. სრული სურათისთვის საჭიროა ორივე ნატალური რუკა — მთვარე, ვენერა, მარსი და ასცენდენტი (იხ. „სინასტრია“).</div>
</div>

<script src="tarot_text.js"></script>

  /* 30° · 90° · 150°: the decan card of the sign that "leads" the pair */
  const own=((hi-lo)%12===d)?lo:hi, k=d, dec={1:0,3:1,5:2}[k];
  const base={C:2,X:5,M:8}[mo(own)],r=base+dec,su=EL_SUIT[el(own)];

}

wands14:['ვერძი მამაკაცი და ლომი ქალი — კვერთხების მეფე: ცეცხლოვანი ლიდერების კავშირი. ის იწყებს, ის აბრწყინებს; ერთად ქარიზმატული, გულუხვი და ძალიან ვნებიანი წყვილია.',

wands12:['ლომი მამაკაცი და მშვილდოსანი ქალი — კვერთხების რაინდი: თავგადასავალი, მოგზაურობა და ვნება. ცხოვრება ამ წყვილისთვის დიდი მოგზაურობაა, სადაც ყოველი დღე ახალი სცენაა.',
  'მშვილდოსანი მამაკაცი და ლომი ქალი — შებრუნებული რაინდი: იმპულსურობა და მოუსვენრობა. ის გარბის ახლისკენ, ის ერთგულებასა და აღიარებას ითხოვს; ვნება მაღალია, სტაბილურობა — დაბალი.'],
wands13:['ვერძი მამაკაცი და მშვილდოსანი ქალი — კვერთხების დედოფალი: თბილი, თავდაჯერებული, მხიარული კავშირი. ის ძლიერია, ის თავისუფალი და ოპტიმისტური; ერთმანეთს ცეცხლს არ უქრობენ.',

pentacles12:['კურო მამაკაცი და ქალწული ქალი — პენტაკლების რაინდი: ნელი, მაგრამ ურყევი სიყვარული. ერთგულება, მოთმინება და ყოველდღიური ზრუნვა — ეს წყვილი დროსთან ერთად სულ უფრო მყარი ხდება.',

pentacles13:['ქალწული მამაკაცი და თხის რქა ქალი — შებრუნებული დედოფალი: სამუშაო სახლში შემოდის. ორივე დაკავებულია და დაღლილი; სიყვარული მოვალეობად იქცევა, თუ ერთმანეთს დასვენებას არ აჩუქებენ.',

wands2:['ვერძი მამაკაცი და კურო ქალი — კვერთხების ორიანი: მან იცის, რა სურს, ის კი მყარ საფუძველს აძლევს. ერთად გეგმავენ დიდ მომავალს — ის ხედავს ჰორიზონტს, ის აშენებს.',

  'ვერძი მამაკაცი და თევზები ქალი — შებრუნებული რვიანი: წასვლა ან დარჩენა? ის აჩქარებს, ის ერიდება; საჭიროა გადაწყვეტილება, რომელიც ორივეს გულს ითვალისწინებს.'],

function tarotBlock(a,ga,b,gb){
  const c=pairCard(a,b);let rev;
  if(a===b)rev=ga===gb;
  else if(ga!==gb){const man=ga==='m'?a:b;rev=man!==c.owner;}
  else rev=a!==c.owner;
  const txt=typeof TAROT_TEXTS!=='undefined'&&TAROT_TEXTS[c.id];
  let love=CT[c.id]?CT[c.id][rev?1:0]:'';
  /* same-gender couple: the texts are written for a man and a woman — keep only the signs */
  if(ga===gb&&a!==b)love=love.replace(/^(.+?) მამაკაცი და (.+?) ქალი — /,'$1 და $2 — ');
  const kw=txt?(rev?txt.kr:txt.k):'';
  const who=a===b?(ga===gb?'ერთსქესიანი წყვილი — შებრუნებული':'კაცი და ქალი ერთ ნიშანში — პირდაპირი')
    :`პირდაპირია, როცა ${S[c.owner].n} ${ga!==gb?'მამაკაცია':'პირველი პირია'}; ${rev?'აქ — პირიქით, ამიტომ შებრუნებული':'აქ ზუსტად ასეა'}`;
  return `<div class="tarot"><div class="tc"><img src="${cardImg(c.id)}" alt="" style="${rev?'transform:rotate(180deg)':''}" onerror="this.style.display='none'"></div>
    <div class="tt"><div class="tn">🃏 ${cardName(c.id)}${rev?' <span>· შებრუნებული</span>':''}</div>
    ${kw?`<div class="tk">${kw}</div>`:''}
    ${love?`<p>${love}</p>`:''}
    <div class="tw">${c.why}<br>${who}.</div></div></div>`;
}

function render(){
  picker('pa','a');picker('pb','b');
  const {a,ga,b,gb}=st,R=compute(a,ga,b,gb);
  const PA=GEN[ga].P[a],PB=GEN[gb].P[b];
  const lab=(i,g)=>`<span class="g" style="color:${ELC[el(i)]}">${G(S[i].g)}</span> ${S[i].n} <span style="color:${g==='m'?'var(--m)':'var(--f)'}">${GEN[g].w}</span>`;
  const na=S[a].n+' '+GEN[ga].w,nb=S[b].n+' '+GEN[gb].w;
  document.getElementById('res').innerHTML=`
   <h2 class="ttl">${lab(a,ga)} &nbsp;+&nbsp; ${lab(b,gb)}</h2>
   <div class="desc">
     <p>${R.pr[1]}</p>
     <p><b>${na}</b> — ${PA[0]} <b>${nb}</b> — ${PB[0]}</p>
     <p>${na} ამ ურთიერთობაში აძლევს ${PA[1]} და პარტნიორისგან ელის ${PA[2]}. ${nb} კი აძლევს ${PB[1]} და ელის ${PB[2]}.</p>
     <p>${R.A[1]} ${ELP[R.ek].replace(/^[^:]+:\s*/,'')} ${MOP[R.mk]}</p>
     <p>${R.pol}</p>
     <p>რას უნდა გაუფრთხილდნენ: ${S[a].n} ${GEN[ga].gen} მხრიდან — ${PA[3]}, ${S[b].n} ${GEN[gb].gen} მხრიდან — ${PB[3]}. ${R.A[2]}</p>
   </div>
   <h3 class="tth">✦ წყვილის ტაროს ბარათი</h3>
   ${tarotBlock(a,ga,b,gb)}`;
  try{history.replaceState(null,'',`?a=${a}&ga=${ga}&b=${b}&gb=${gb}`);}catch(e){}
}
document.getElementById('swap').onclick=()=>{[st.ga,st.gb]=[st.gb,st.ga];render();};   /* Taurus man + Scorpio woman ⇄ Taurus woman + Scorpio man */
render();
</script>
