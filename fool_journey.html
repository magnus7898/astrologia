:root{--bg:#07060d;--gold:#c9a84c;--gold-lt:#ecd59a;--ink:#efe6d4;--dim:#8a7d68}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'NSG',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
.back{align-self:flex-start;font-family:'CZ',serif;font-size:11px;letter-spacing:2px;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,.3);border-radius:3px;padding:6px 11px;margin-bottom:12px}
h1{font-family:'NSG',serif;font-weight:600;color:var(--gold-lt);font-size:clamp(20px,4vw,30px);margin-bottom:12px;letter-spacing:1px}
.stage{width:100%;max-width:1280px;aspect-ratio:16/9;position:relative;border:1px solid rgba(201,168,76,.35);border-radius:8px;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block}
.ctl{display:flex;gap:10px;align-items:center;width:100%;max-width:1280px;margin-top:10px;flex-wrap:wrap}
.ctl button{background:none;border:1px solid rgba(201,168,76,.5);color:var(--gold-lt);border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
.ctl input[type=range]{flex:1;min-width:160px;accent-color:var(--gold)}
.ctl span{font-family:'CZ',serif;font-size:12px;color:var(--dim);min-width:90px;text-align:right}
.ch{display:flex;flex-wrap:wrap;gap:4px;max-width:1280px;width:100%;margin-top:10px}
.ch button{background:none;border:1px solid rgba(201,168,76,.2);color:var(--dim);border-radius:12px;padding:2px 9px;font:inherit;font-size:11.5px;cursor:pointer}
.ch button.on{border-color:var(--gold);color:var(--gold-lt)}

/* ════════ choreography ════════ */
const sceneX=i=>i*SP;
const WALKIN=1.25,LEAVE=3.3,GAP=(D-LEAVE)+WALKIN;
const restX=i=>sceneX(i)-120,depX=i=>i===7?sceneX(7)+380:restX(i);
function travel(i,w){/* from scene i's departure point to scene i+1's resting point, w = 0…1 */return lerp(depX(i),restX(i+1),ss(w));}
function at(t){
  /* where the traveller is at time t: {sc, u, x, y, walk, m, o} */
  if(t<INTRO)return {sc:0,u:0,x:sceneX(0)-520,y:440,walk:0,m:1,o:{}};
  const tt=t-INTRO,sc=Math.min(N-1,Math.floor(tt/D)),u=tt-sc*D,cx=sceneX(sc);
  let x=restX(sc),y=GY,walk=0,m=ss((u-1.25)/1.2),o={};
  if(sc===0){/* the Fool walks to the edge of the cliff — and steps off */
    x=lerp(cx-520,cx+250,ss(u/3.2));y=440;walk=x/26;m=1;
    if(u>3.4){const f=(u-3.4)/.8;x=cx+250+f*220;y=440+f*f*70;o.rot=f*.5;walk=0;}
    return {sc,u,x,y,walk,m,o};}
  if(sc===1&&u<1.0){const f=u/1.0;x=lerp(sceneX(0)+470,restX(1),ss(f));y=lerp(510,GY,f*f);o.rot=(1-f)*.5+f*0;m=0;return {sc,u,x,y,walk:0,m:0,o};}
  if(u<WALKIN&&sc>=2){x=travel(sc-1,((D-LEAVE)+u)/GAP);walk=x/26;}
  if(u>=LEAVE&&sc<N-1){x=travel(sc,(u-LEAVE)/GAP);walk=x/26;}
  /* acting */
  if(sc===1)o.armR=-Math.sin(ss((u-2.4)/.6)*Math.PI/2)*.2;
  if(sc===6&&u>1.4&&u<LEAVE)o.twin=ss((u-1.4)/.5)*(1-ss((u-2.9)/.4));
  if(sc===7&&u>2.4&&u<LEAVE){x=restX(7)+ss((u-2.4)/.9)*500;y=GY-40;walk=0;}
  if(sc===10&&u>2.0&&u<3.2){const k=(u-2.0)/1.2;y=GY-Math.abs(Math.sin(k*Math.PI*2))*70;}
  if(sc===12&&u>2.0&&u<LEAVE){o.hang=ss((u-2.0)/.5)*(1-ss((u-2.9)/.4));}
  if(sc===15)o.chain=ss((u-1.6)/.4)*(1-ss((u-2.9)/.25));
  if(sc===20&&u>2.4&&u<LEAVE)y=GY-ss((u-2.4)/.5)*40*(1-ss((u-3.0)/.3));
  if(sc===21&&u>1.6){x=sceneX(21);y=GY-60-ss((u-1.6)/1)*50;walk=0;o.rot=Math.sin(t*2)*.08;}
  if(sc===21&&u<=1.6&&u>=WALKIN){x=lerp(restX(21),sceneX(21),ss((u-WALKIN)/.35));}
  return {sc,u,x,y,walk,m,o};
}
function camera(t,p){
  let cx=p.x,cy=0;
  if(t<INTRO)cx=sceneX(0)-120;
  if(p.sc===0&&p.u<3.4)cy=-60;
  if(p.sc===21&&p.u>1.6)cx=sceneX(21);
  return {x:cx-VW/2,y:cy};
}
function drawFrame(t){
  const p=at(t),cam=camera(t,p),scf=(cam.x+VW/2)/SP;
  /* sky blends between neighbouring places */
  const i0=Math.max(0,Math.min(N-1,Math.floor(scf+.5)-1)),i1=Math.min(N-1,i0+1),f=ss(cl((scf-i0)-.5)*1+0);
  const a=Math.max(0,Math.min(N-1,Math.floor(scf))),b=Math.min(N-1,a+1),fr=ss(cl((scf-a-.35)/.3));
  const g=X.createLinearGradient(0,0,0,VH);g.addColorStop(0,mix(SKY[a][0],SKY[b][0],fr));g.addColorStop(1,mix(SKY[a][1],SKY[b][1],fr));X.fillStyle=g;X.fillRect(0,0,VW,VH);
  X.save();X.translate(-cam.x,-cam.y);
  for(let i=Math.max(0,a-1);i<=Math.min(N-1,a+1);i++){
    const ox=sceneX(i);
    /* ground strip with soft edges */
    const gg=X.createLinearGradient(ox-SP/2-150,0,ox+SP/2+150,0);const gc=hex(GROUND[i]).join(',');
    gg.addColorStop(0,`rgba(${gc},0)`);gg.addColorStop(.12,`rgba(${gc},1)`);gg.addColorStop(.88,`rgba(${gc},1)`);gg.addColorStop(1,`rgba(${gc},0)`);
    X.fillStyle=gg;X.fillRect(ox-SP/2-150,GY,SP+300,VH+200);
    const u=i===p.sc?p.u:(i<p.sc?D:0);
    sceneBG(i,ox,t,u);
  }
  /* traveller */
  const A=p.sc===0?LOOK[0]:LOOK[p.sc-1],B=LOOK[p.sc];
  if(p.o.twin){figure(p.x-115*p.o.twin,p.y,A,B,p.m,p.walk,t,{s:.95});const W={...B,robe:'#f4dcc0',head:'none'};figure(p.x+115*p.o.twin,p.y,W,W,1,0,t,{s:.9});}
  else if(p.o.hang){const k=p.o.hang;figure(p.x,p.y-k*330,A,B,p.m,0,t,{rot:Math.PI*k});}
  else figure(p.x,p.y,A,B,p.m,p.walk,t,{rot:p.o.rot||0,chain:p.o.chain||0});
  if(p.sc===15&&p.u>2.9&&p.u<3.6){const k=(p.u-2.9)/.7;for(let j=0;j<8;j++){const a2=j/8*6.28;C(p.x+Math.cos(a2)*k*120,p.y-60+Math.sin(a2)*k*80+k*k*90,4,'#9a9aa0');}}
  if(p.sc>0&&!(p.sc===1&&p.u<1.0))sparks(p.x,p.y,(p.u-1.25)/1.2,t);
  X.restore();
  /* vignette */
  const v=X.createRadialGradient(VW/2,VH/2,VH*.45,VW/2,VH/2,VH*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');X.fillStyle=v;X.fillRect(0,0,VW,VH);
  /* titles */
  if(t<INTRO){const k=ss(t/1)*(1-ss((t-2.3)/.7));X.globalAlpha=k;Rc(0,0,VW,VH,'rgba(7,6,13,.65)');txt('სულელის მოგზაურობა',VW/2,330,62,'#ecd59a');txt('22 დიდი არკანი · 0 → XXI',VW/2,400,28,'#d8c8a8','NSG',400);X.globalAlpha=1;}
  else if(t<INTRO+N*D){const k=ss((p.u-1.6)/.5)*(1-ss((p.u-3.7)/.4));if(k>0){X.globalAlpha=k;X.fillStyle='rgba(7,6,13,.55)';X.fillRect(36,34,330,104);
    txt(ROM[p.sc],56,74,30,'#ecd59a','CZ',600,'left');txt(NM[p.sc],56,110,32,'#f3ecdc','NSG',600,'left');txt(LINE[p.sc],56,132,18,'#c9b890','NSG',400,'left');X.globalAlpha=1;}}
  /* outro: everything fades to gold light, the Fool steps out again */
  const to=t-(INTRO+N*D);
  if(to>0){const w=ss(to/1.6);X.globalAlpha=w*(1-ss((to-4.4)/1.2)*.0);Rc(0,0,VW,VH,'#0b0918');X.globalAlpha=1;
    if(to>1.2){const k=ss((to-1.2)/1.2);X.globalAlpha=k;txt('ციკლი სრულდება',VW/2,300,48,'#ecd59a');txt('და სულელი ახალ გზას იწყებს',VW/2,360,28,'#d8c8a8','NSG',400);
      X.save();figure(lerp(VW/2-200,VW/2+200,ss((to-1.6)/4)),560,LOOK[0],LOOK[0],0,(to-1.6)*9,t,{s:.8});X.restore();X.globalAlpha=1;}}
}
/* ── player ── */
let T0=null,playing=false,tCur=0,snd=false,AC=null;
const seek=document.getElementById('seek'),tm=document.getElementById('tm');
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function loop(ts){if(playing){if(T0===null)T0=ts-tCur*1000;tCur=(ts-T0)/1000;if(tCur>=TOTAL){tCur=TOTAL;playing=false;document.getElementById('play').textContent='↻ თავიდან';}
  drawFrame(tCur);seek.value=tCur/TOTAL*1000;tm.textContent=fmt(tCur)+' / '+fmt(TOTAL);markCh();}requestAnimationFrame(loop);}
function bell(f){if(!snd||!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+2.4);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+2.5);}
let lastSc=-1;function markCh(){const s=tCur<INTRO?-1:Math.min(N-1,Math.floor((tCur-INTRO)/D));if(s!==lastSc){lastSc=s;if(s>=1)bell([261.6,293.7,329.6,392,440,523.3][s%6]);
  document.querySelectorAll('#chapters button').forEach((b,i)=>b.classList.toggle('on',i===s));}}
document.getElementById('play').onclick=()=>{if(tCur>=TOTAL)tCur=0;playing=!playing;T0=null;document.getElementById('play').textContent=playing?'⏸ პაუზა':'▶ დაკვრა';};
document.getElementById('snd').onclick=e=>{snd=!snd;if(snd&&!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(err){}e.target.textContent=snd?'🔊 ხმა':'🔈 ხმა';};
seek.oninput=()=>{tCur=seek.value/1000*TOTAL;T0=null;drawFrame(tCur);tm.textContent=fmt(tCur)+' / '+fmt(TOTAL);markCh();};
document.getElementById('chapters').innerHTML=NM.map((n,i)=>`<button data-i="${i}">${ROM[i]} ${n}</button>`).join('');
document.querySelectorAll('#chapters button').forEach(b=>b.onclick=()=>{tCur=INTRO+(+b.dataset.i)*D;T0=null;drawFrame(tCur);seek.value=tCur/TOTAL*1000;markCh();});
document.fonts&&document.fonts.ready.then(()=>drawFrame(tCur));drawFrame(0);requestAnimationFrame(loop);
window._film={drawFrame,TOTAL,INTRO,D};
