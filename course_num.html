<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGNUS · ნუმეროლოგიის კურსი</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0C1222;color:#EDE6D8;font-family:'Noto Serif Georgian',Georgia,serif;font-weight:300;display:flex;flex-direction:column;align-items:center}
.page{width:100%;max-width:760px;padding:56px 18px 80px;text-align:center;flex:1}
h1{font-family:'Marcellus SC','Noto Serif Georgian',serif;font-weight:400;font-size:clamp(24px,4vw,36px);letter-spacing:.12em;color:#E3BE84}
.sub{margin-top:8px;color:#7A8499;font-size:13px;letter-spacing:.06em}
.box{margin:34px auto 0;border:1px solid rgba(184,137,74,.3);background:rgba(17,26,46,.55);padding:30px 22px;max-width:520px}
.box p{color:#BCC0CA;line-height:1.8;font-size:14px}
.soon{display:inline-block;margin-bottom:14px;font-family:'Marcellus SC',serif;letter-spacing:.3em;font-size:11px;color:#B8894A;border:1px solid rgba(184,137,74,.4);padding:5px 14px}
</style>
</head>
<body>
<div class="page">
  <h1>ნუმეროლოგიის კურსი</h1>
  <div class="sub">Numerology Course</div>
  <div class="box">
    <div class="soon">მალე</div>
    <p>კურსი მზადდება.</p>
  </div>
</div>
<script src="site.js"></script>
<script src="account.js"></script>
</body>
</html>
