<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ინტუიციის ტესტი · MAGNUS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400;600&family=Noto+Serif+Georgian:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--void:#05040b;--surface:#0e0b1a;--raised:#161127;--gold:#c9a84c;--gold-lt:#ecd59a;--ink:#efe6d4;--ink-mid:#b3a68f;--ink-dim:#6d6253;
  --border:rgba(201,168,76,.16);--border-h:rgba(201,168,76,.45);--ok:#5fcf8a;--bad:#e2685c;--violet:#a585ef}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse 800px 500px at 50% -10%,rgba(150,90,230,.15),transparent 60%),var(--void);color:var(--ink);
  font-family:'Noto Serif Georgian',serif;min-height:100vh;line-height:1.55}
.page{max-width:760px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:18px;position:relative}
.back{position:absolute;left:0;top:4px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--gold);opacity:.75;text-decoration:none;
  border:1px solid var(--border);border-radius:3px;padding:6px 11px}
.back:hover{opacity:1;border-color:var(--border-h)}
h1{font-family:'Cinzel Decorative',serif;font-weight:400;font-size:clamp(24px,5vw,38px);letter-spacing:3px;
  background:linear-gradient(160deg,#f5e8ba,var(--gold) 40%,#9a7028 70%,var(--gold-lt));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--ink-dim);letter-spacing:1px;margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 14px}
.tabs button{background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:16px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{border-color:var(--gold);color:var(--gold-lt);background:rgba(201,168,76,.08)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.hud div{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center}
.hud b{display:block;font-family:'Cinzel',serif;font-size:20px;color:var(--gold-lt);font-weight:400;line-height:1.2}
.hud span{font-size:10px;color:var(--ink-dim);letter-spacing:.5px}
.stage{position:relative;min-height:430px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 16px;
  display:flex;flex-direction:column;align-items:center;gap:16px}
.how{font-size:12.5px;color:var(--ink-mid);text-align:center;max-width:520px}
.msg{text-align:center;font-size:13.5px;color:var(--ink-mid);min-height:22px}
.msg b{color:var(--gold-lt);font-weight:400}
/* card */
.cardbox{perspective:900px;width:150px;height:210px}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.9,.4,1)}
.flip.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.back-f{background:repeating-linear-gradient(45deg,rgba(201,168,76,.07) 0 6px,transparent 6px 12px),linear-gradient(160deg,#1e1636,#0d0a1a);
  border:1px solid var(--border-h);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.back-f::after{content:'';width:46px;height:46px;border:1px solid rgba(201,168,76,.45);transform:rotate(45deg)}
.front-f{transform:rotateY(180deg);background:linear-gradient(160deg,#f7efd8,#e6d6ac);border:1px solid #c9a84c}
.front-f svg{width:70%;height:70%}
/* cups */
.cups{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cup{width:76px;height:96px;position:relative;cursor:pointer;background:none;border:none}
.cup .c{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.cup svg{width:100%;height:100%}
.cup .pearl{position:absolute;left:50%;bottom:6px;width:22px;height:22px;margin-left:-11px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#e8e2f6 50%,#9a8fc0);box-shadow:0 0 14px rgba(255,255,255,.6);opacity:0}
.cup.up .c{transform:translateY(-44px)}
.cup.has .pearl{opacity:1}
.cup.pick svg path{stroke:var(--gold-lt)}
.cup:disabled{cursor:default}
/* options */
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{width:64px;height:64px;border-radius:12px;border:1px solid var(--border);background:var(--raised);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--border-h)}
.opt:active:not(:disabled){transform:scale(.93)}
.opt svg{width:60%;height:60%}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.25)}
.opt:disabled{cursor:default;opacity:.55}
.opt.sel:disabled{opacity:1}
.opt.wide{width:120px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:1px;color:var(--ink)}
.trail{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:520px}
.trail i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}
.trail i.h{background:var(--ok);border-color:var(--ok)}
.trail i.m{background:rgba(226,104,92,.45);border-color:rgba(226,104,92,.6)}
.trail i.now{border-color:var(--gold)}
/* time */
.orb{width:180px;height:180px;border-radius:50%;border:1px solid var(--border-h);display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 50% 40%,rgba(165,133,239,.14),transparent 70%)}
.orb b{font-family:'Cinzel',serif;font-size:44px;font-weight:400;color:var(--gold-lt);line-height:1}
.orb span{font-size:11px;color:var(--ink-dim);margin-top:6px}
.orb.run{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 40px rgba(165,133,239,.28)}}
.btn{background:linear-gradient(135deg,#8a6a24,#c9a84c);color:#120c02;border:none;border-radius:6px;padding:11px 22px;font-family:'Cinzel',serif;
  font-size:12.5px;letter-spacing:2px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--border-h);font-weight:400}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* result */
.res{width:100%;max-width:520px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.big{font-family:'Cinzel',serif;font-size:52px;color:var(--gold-lt);line-height:1}
.res p{font-size:13px;color:var(--ink-mid)}
.meter{width:100%;height:10px;border-radius:5px;background:rgba(255,255,255,.06);position:relative;overflow:visible}
.meter i{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:linear-gradient(90deg,#4b3a7a,var(--violet),var(--gold-lt))}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-dim)}
.verdict{font-size:14px;color:var(--gold-lt)}
.stats{width:100%;border-collapse:collapse;font-size:12.5px}
.stats td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;color:var(--ink-mid)}
.stats td:last-child{text-align:right;color:var(--ink);font-family:'Cinzel',serif}
.life{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.life h3{font-family:'Cinzel',serif;font-weight:400;font-size:13px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;text-align:center}
.note{font-size:11.5px;color:var(--ink-dim);text-align:center;margin-top:14px}
@media (max-width:520px){header{padding-top:34px}.back{top:0}.hud b{font-size:17px}.opt{width:54px;height:54px}.cup{width:62px;height:80px}.cardbox{width:126px;height:176px}}
</style>
</head>
<body>
<div class="page">
<header>
  <a class="back" href="index.html?g=games">← თამაშები</a>
  <h1>ინტუიცია</h1>
  <div class="sub">Intuition · ESP · Precognition · Time Sense</div>
</header>

<div class="tabs" id="tabs"></div>
<div class="hud">
  <div><b id="hTrial">0/0</b><span>ცდა</span></div>
  <div><b id="hHit">0</b><span>დამთხვევა</span></div>
  <div><b id="hExp">0</b><span>შემთხვევით</span></div>
  <div><b id="hRate">—</b><span>სიზუსტე</span></div>
</div>
<div class="stage" id="stage"></div>

<div class="life">
  <h3>ჯამური სტატისტიკა</h3>
  <table class="stats" id="lifeStats"></table>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="resetLife" style="padding:6px 12px;font-size:10.5px">გასუფთავება</button></div>
</div>
<div class="note">სამიზნე იქმნება კრიპტოგრაფიული შემთხვევითობით (crypto.getRandomValues). წინათგრძნობის რეჟიმში — მხოლოდ შენი არჩევანის შემდეგ.</div>
</div>

<script>
'use strict';
/* ── symbols ─────────────────────────────────────────────────────── */
const SVG=(inner,col)=>`<svg viewBox="0 0 40 40" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ZENER=[
  {k:'circle',n:'წრე',   s:'<circle cx="20" cy="20" r="13"/>'},
  {k:'cross', n:'ჯვარი', s:'<path d="M20 6v28M6 20h28"/>'},
  {k:'waves', n:'ტალღა', s:'<path d="M6 13c4-4 7-4 10 0s6 4 9 0 6-4 9 0M6 21c4-4 7-4 10 0s6 4 9 0 6-4 9 0M6 29c4-4 7-4 10 0s6 4 9 0 6-4 9 0"/>'},
  {k:'square',n:'კვადრატი',s:'<rect x="8" y="8" width="24" height="24"/>'},
  {k:'star',  n:'ვარსკვლავი',s:'<path d="M20 5l4.4 9.4 10.1 1.2-7.5 6.9 2 10L20 27.4 11 32.5l2-10-7.5-6.9 10.1-1.2z"/>'},
];
const SUIT={
  red:  {n:'წითელი',s:'<path d="M20 33C9 25 5 19 5 14a7.5 7.5 0 0 1 15-2 7.5 7.5 0 0 1 15 2c0 5-4 11-15 19z" fill="#c23b3b" stroke="#c23b3b"/>'},
  black:{n:'შავი',  s:'<path d="M20 5C12 13 5 17 5 23a7 7 0 0 0 12 5c-1 3-2 5-4 7h14c-2-2-3-4-4-7a7 7 0 0 0 12-5c0-6-7-10-15-18z" fill="#1a1426" stroke="#1a1426"/>'},
};
const COLORS=[
  {k:'r',n:'წითელი', c:'#d24a4a'},{k:'o',n:'ნარინჯისფერი',c:'#e08a2e'},{k:'y',n:'ყვითელი',c:'#e3c740'},
  {k:'g',n:'მწვანე', c:'#3fae6a'},{k:'b',n:'ლურჯი',c:'#3f7ee0'},{k:'v',n:'იისფერი',c:'#9a5fe0'},
];
const swatch=c=>`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="${c}"/></svg>`;

/* ── crypto RNG ─────────────────────────────────────────────────── */
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0];}while(x>=lim);return x%n;}

/* ── statistics: exact binomial upper tail P(X ≥ k) ─────────────── */
function binomTail(n,k,p){
  if(k<=0)return 1;
  let term=Math.pow(1-p,n),sum=0;            /* P(X=0) */
  for(let i=0;i<=n;i++){
    if(i>=k)sum+=term;
    term=term*(n-i)/(i+1)*p/(1-p);
  }
  return Math.min(1,sum);
}
function verdict(pv,hits,exp){
  if(hits<=exp)return 'შედეგი შემთხვევითობის ფარგლებშია — გონება ჯერ ხმაურშია. სცადე ისევ, უფრო მშვიდად.';
  if(pv<0.001)return 'განსაკუთრებული დამთხვევა — ასეთი შედეგი შემთხვევით ათასში ერთხელ ძლივს ხდება.';
  if(pv<0.01) return 'ძალიან ძლიერი შედეგი — შემთხვევითობაზე გაცილებით მაღლა.';
  if(pv<0.05) return 'სტატისტიკურად საყურადღებო — ინტუიციის ნიშანი ჩანს.';
  if(pv<0.2)  return 'ოდნავ ზემოთ მოსალოდნელზე — ტენდენცია არის, მაგრამ ჯერ სუსტია.';
  return 'შემთხვევითობის ფარგლებში, მცირე უპირატესობით.';
}

/* ── lifetime storage (per viewer, best-effort) ─────────────────── */
const LKEY='magnus_intuition_v1';
function lifeLoad(){try{return JSON.parse(localStorage.getItem(LKEY))||{};}catch(e){return {};}}
function lifeSave(d){try{localStorage.setItem(LKEY,JSON.stringify(d));}catch(e){}}
let LIFE=lifeLoad();

/* ── game definitions ───────────────────────────────────────────── */
const GAMES=[
  {key:'zener',tab:'ზენერის ბარათები',n:25,p:1/5,when:'before',
   how:'ბარათი უკვე არჩეულია და პირქვე დევს. იგრძენი — რომელი სიმბოლოა? 25 ცდა, შემთხვევითი მოლოდინი — 5.',
   opts:()=>ZENER.map(z=>({k:z.k,label:z.n,html:SVG(z.s,'#c9a84c'),face:SVG(z.s,'#3a2a10')}))},
  {key:'suit',tab:'წითელი · შავი',n:20,p:1/2,when:'before',
   how:'ბარათის ფერი — წითელი თუ შავი? გაჰყევი პირველ იმპულსს, ნუ იფიქრებ. 20 ცდა.',
   opts:()=>Object.entries(SUIT).map(([k,v])=>({k,label:v.n,html:SVG(k==='black'?v.s.replace(/#1a1426/g,'#d8d0ea'):v.s,'none'),face:SVG(v.s,'none')}))},
  {key:'cups',tab:'მარგალიტი',n:20,p:1/4,when:'before',kind:'cups',
   how:'ოთხი თასიდან ერთ-ერთის ქვეშ მარგალიტია. რომლის ქვეშ? 20 ცდა, მოლოდინი — 5.'},
  {key:'color',tab:'ფერის ხედვა',n:24,p:1/6,when:'before',
   how:'დახუჭე თვალი, წარმოიდგინე ბარათი და დაინახე მისი ფერი. 6 ფერი, 24 ცდა, მოლოდინი — 4.',
   opts:()=>COLORS.map(c=>({k:c.k,label:c.n,html:swatch(c.c),face:swatch(c.c)}))},
  {key:'precog',tab:'წინათგრძნობა',n:25,p:1/5,when:'after',
   how:'აქ სამიზნე ჯერ არ არსებობს — ის შენი არჩევანის შემდეგ შეიქმნება. იგრძენი, რა მოვა. 25 ცდა.',
   opts:()=>ZENER.map(z=>({k:z.k,label:z.n,html:SVG(z.s,'#a585ef'),face:SVG(z.s,'#3a2a10')}))},
  {key:'time',tab:'დროის შეგრძნება',kind:'time',n:6,
   how:'დაიწყე და გააჩერე ზუსტად მითითებულ წამზე — საათის გარეშე, მხოლოდ შინაგანი რიტმით. 6 რაუნდი.'},
];

const $=id=>document.getElementById(id);
const stage=$('stage');
let G=null,S=null;

function setHud(t,n,h,e,r){$('hTrial').textContent=t+'/'+n;$('hHit').textContent=h;$('hExp').textContent=e;$('hRate').textContent=r;}

function renderTabs(){
  $('tabs').innerHTML='';
  GAMES.forEach(g=>{
    const b=document.createElement('button');b.textContent=g.tab;b.className=G&&G.key===g.key?'on':'';
    b.onclick=()=>start(g.key);$('tabs').appendChild(b);
  });
}

function start(key){
  G=GAMES.find(g=>g.key===key)||GAMES[0];
  try{history.replaceState(null,'','?t='+G.key);}catch(e){}
  renderTabs();
  $('hHit').nextElementSibling.textContent='დამთხვევა';$('hExp').nextElementSibling.textContent='შემთხვევით';
  if(G.kind==='time')return startTime();
  S={i:0,hits:0,trail:[],target:null,busy:false};
  if(G.when==='before')S.target=nextTarget();
  setHud(0,G.n,0,(G.n*G.p).toFixed(1).replace(/\.0$/,''),'—');
  stage.innerHTML=`<div class="how">${G.how}</div>
    ${G.kind==='cups'?'<div class="cups" id="cups"></div>':
      '<div class="cardbox"><div class="flip" id="flip"><div class="face back-f"></div><div class="face front-f" id="front"></div></div></div><div class="opts" id="opts"></div>'}
    <div class="msg" id="msg">&nbsp;</div>
    <div class="trail" id="trail">${'<i></i>'.repeat(G.n)}</div>`;
  if(G.kind==='cups')drawCups();else drawOpts();
  markTrail();
}
function nextTarget(){
  if(G.kind==='cups')return rnd(4);
  const o=G.opts();return o[rnd(o.length)].k;
}
function markTrail(){
  const t=[...$('trail').children];
  t.forEach((el,i)=>{el.className=i<S.trail.length?(S.trail[i]?'h':'m'):i===S.i?'now':'';});
}
function drawOpts(){
  const box=$('opts');box.innerHTML='';
  G.opts().forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.title=o.label;b.innerHTML=o.html;b.dataset.k=o.k;
    b.onclick=()=>guess(o.k,b);box.appendChild(b);
  });
}
function drawCups(){
  const box=$('cups');box.innerHTML='';
  for(let i=0;i<4;i++){
    const b=document.createElement('button');b.className='cup';b.dataset.i=i;
    b.innerHTML=`<span class="pearl"></span><span class="c"><svg viewBox="0 0 76 96"><path d="M14 90h48L54 22H22z" fill="#2a1f45" stroke="#c9a84c" stroke-width="1.6"/><path d="M18 30h40" stroke="rgba(201,168,76,.4)" stroke-width="1"/><rect x="28" y="10" width="20" height="12" rx="3" fill="#2a1f45" stroke="#c9a84c" stroke-width="1.6"/></svg></span>`;
    b.onclick=()=>guess(i,b);box.appendChild(b);
  }
}
function guess(k,btn){
  if(S.busy||S.i>=G.n)return;S.busy=true;
  if(G.when==='after')S.target=nextTarget();                 /* precognition: target born after the choice */
  const hit=k===S.target;
  S.hits+=hit?1:0;S.trail.push(hit);S.i++;
  btn.classList.add(G.kind==='cups'?'pick':'sel');
  if(G.kind==='cups'){
    const cups=[...$('cups').children];cups.forEach(c=>c.disabled=true);
    cups[S.target].classList.add('has');
    cups[S.target].classList.add('up');if(!hit)btn.classList.add('up');
  }else{
    [...$('opts').children].forEach(b=>b.disabled=true);
    const o=G.opts().find(o=>o.k===S.target);
    $('front').innerHTML=o.face;$('flip').classList.add('open');
  }
  const tName=G.kind==='cups'?('თასი '+(S.target+1)):G.opts().find(o=>o.k===S.target).label;
  $('msg').innerHTML=hit?'<b>✓ დამთხვევა</b> — '+tName:'✕ იყო: '+tName;
  setHud(S.i,G.n,S.hits,(G.n*G.p).toFixed(1).replace(/\.0$/,''),Math.round(100*S.hits/S.i)+'%');
  markTrail();
  setTimeout(()=>{
    if(S.i>=G.n)return finish();
    if(G.when==='before')S.target=nextTarget();
    if(G.kind==='cups')drawCups();
    else{$('flip').classList.remove('open');setTimeout(()=>{$('front').innerHTML='';drawOpts();},260);}
    $('msg').innerHTML='&nbsp;';S.busy=false;
  },hit?950:1150);
}
function finish(){
  const exp=G.n*G.p,pv=binomTail(G.n,S.hits,G.p),sd=Math.sqrt(G.n*G.p*(1-G.p)),z=(S.hits-exp)/sd;
  const L=LIFE[G.key]||{n:0,h:0,sessions:0,best:0};
  L.n+=G.n;L.h+=S.hits;L.sessions++;L.best=Math.max(L.best,S.hits);LIFE[G.key]=L;lifeSave(LIFE);
  const pct=Math.min(100,100*S.hits/G.n);
  stage.innerHTML=`<div class="res">
    <div class="big">${S.hits}<span style="font-size:22px;color:var(--ink-dim)"> / ${G.n}</span></div>
    <div class="meter"><i style="width:${pct}%"></i><u style="left:${100*G.p}%"></u></div>
    <div class="verdict">${verdict(pv,S.hits,exp)}</div>
    <table class="stats">
      <tr><td>შემთხვევითი მოლოდინი</td><td>${exp.toFixed(1)}</td></tr>
      <tr><td>გადახრა (z)</td><td>${z>=0?'+':''}${z.toFixed(2)}</td></tr>
      <tr><td>ალბათობა შემთხვევით (p)</td><td>${pv<0.0001?'< 0.0001':pv.toFixed(4)}</td></tr>
      <tr><td>სერია (ყველაზე გრძელი)</td><td>${longest(S.trail)}</td></tr>
    </table>
    <div class="trail">${S.trail.map(h=>`<i class="${h?'h':'m'}"></i>`).join('')}</div>
    <div class="row"><button class="btn" id="again">თავიდან</button></div>
  </div>`;
  $('again').onclick=()=>start(G.key);
  renderLife();
}
function longest(a){let b=0,c=0;a.forEach(h=>{c=h?c+1:0;b=Math.max(b,c);});return b;}

/* ── time sense ─────────────────────────────────────────────────── */
function startTime(){
  S={round:0,errs:[],running:false,t0:0,target:0};
  setHud(0,G.n,'—','—','—');
  $('hHit').nextElementSibling.textContent='ბოლო ცდომა';$('hExp').nextElementSibling.textContent='საშუალო';
  stage.innerHTML=`<div class="how">${G.how}</div>
    <div class="orb" id="orb"><b id="tgt">—</b><span id="tlab">წამი</span></div>
    <div class="msg" id="msg">&nbsp;</div>
    <div class="row"><button class="btn" id="tbtn">დაწყება</button></div>
    <div class="trail" id="trail">${'<i></i>'.repeat(G.n)}</div>`;
  newTimeRound();
  $('tbtn').onclick=timeBtn;
}
function newTimeRound(){S.target=5+rnd(11);$('tgt').textContent=S.target;$('tlab').textContent='წამი — დაითვალე შინაგანად';}
function timeBtn(){
  const b=$('tbtn');
  if(!S.running){S.running=true;S.t0=performance.now();$('orb').classList.add('run');$('tgt').textContent='…';b.textContent='გაჩერება';$('msg').innerHTML='&nbsp;';return;}
  const el=(performance.now()-S.t0)/1000;S.running=false;$('orb').classList.remove('run');
  const err=(el-S.target)/S.target*100;S.errs.push(err);S.round++;
  $('tgt').textContent=el.toFixed(2);$('tlab').textContent='სამიზნე '+S.target+' წმ';
  $('msg').innerHTML=(Math.abs(err)<5?'<b>შესანიშნავი</b> — ':'')+(err>=0?'+':'')+err.toFixed(1)+'% '+(err>0?'(გვიან)':'(ადრე)');
  const mean=S.errs.reduce((a,x)=>a+Math.abs(x),0)/S.errs.length;
  setHud(S.round,G.n,(err>=0?'+':'')+err.toFixed(0)+'%',mean.toFixed(1)+'%',Math.max(0,100-mean).toFixed(0)+'%');
  const tr=[...$('trail').children];tr[S.round-1].className=Math.abs(err)<10?'h':'m';
  if(S.round>=G.n){b.textContent='შედეგი';b.onclick=finishTime;return;}
  b.textContent='შემდეგი';b.onclick=()=>{b.onclick=timeBtn;b.textContent='დაწყება';newTimeRound();};
}
function finishTime(){
  const abs=S.errs.map(Math.abs),mean=abs.reduce((a,x)=>a+x,0)/abs.length;
  const bias=S.errs.reduce((a,x)=>a+x,0)/S.errs.length;
  const score=Math.max(0,100-mean);
  const L=LIFE.time||{rounds:0,sumAbs:0,sessions:0,best:999};
  L.rounds+=S.errs.length;L.sumAbs+=abs.reduce((a,x)=>a+x,0);L.sessions++;L.best=Math.min(L.best,mean);LIFE.time=L;lifeSave(LIFE);
  const tag=mean<5?'ბროლის საათი — შინაგანი დრო თითქმის ზუსტია.':mean<10?'ძალიან კარგი შინაგანი რიტმი.':mean<20?'საშუალო — დრო ოდნავ „ცურავს“.':'შინაგანი საათი ჯერ თავისუფლად დადის.';
  stage.innerHTML=`<div class="res">
    <div class="big">${score.toFixed(0)}<span style="font-size:22px;color:var(--ink-dim)"> / 100</span></div>
    <div class="verdict">${tag}</div>
    <table class="stats">
      <tr><td>საშუალო ცდომა</td><td>${mean.toFixed(1)}%</td></tr>
      <tr><td>ტენდენცია</td><td>${bias>=0?'+':''}${bias.toFixed(1)}% ${Math.abs(bias)<3?'· ბალანსი':bias>0?'· დრო გინელდება':'· დრო გიჩქარდება'}</td></tr>
      <tr><td>საუკეთესო რაუნდი</td><td>${Math.min(...abs).toFixed(1)}%</td></tr>
    </table>
    <div class="row"><button class="btn" id="again">თავიდან</button></div>
  </div>`;
  $('again').onclick=()=>start('time');
  renderLife();
}

/* ── lifetime table ─────────────────────────────────────────────── */
function renderLife(){
  let rows='';
  GAMES.forEach(g=>{
    const L=LIFE[g.key];if(!L)return;
    if(g.kind==='time'){rows+=`<tr><td>${g.tab} · ${L.sessions} სესია</td><td>საშ. ${(L.sumAbs/L.rounds).toFixed(1)}% · საუკ. ${L.best.toFixed(1)}%</td></tr>`;return;}
    const pv=binomTail(L.n,L.h,g.p);
    rows+=`<tr><td>${g.tab} · ${L.n} ცდა</td><td>${(100*L.h/L.n).toFixed(1)}% (შანსი ${(100*g.p).toFixed(0)}%) · p ${pv<0.0001?'<0.0001':pv.toFixed(3)}</td></tr>`;
  });
  $('lifeStats').innerHTML=rows||'<tr><td style="text-align:center">ჯერ არცერთი სესია არ დასრულებულა</td></tr>';
}
$('resetLife').onclick=()=>{if(confirm('ჯამური სტატისტიკა წაიშალოს?')){LIFE={};lifeSave(LIFE);renderLife();}};

renderLife();
start(new URLSearchParams(location.search).get('t')||'zener');
</script>
